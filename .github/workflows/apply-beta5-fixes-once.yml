name: Apply beta.5 narrow fixes once

on:
  push:
    branches:
      - fix/v0.5.0-beta.5
    paths:
      - .github/workflows/apply-beta5-fixes-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/v0.5.0-beta.5
          fetch-depth: 0

      - name: Apply narrowly scoped beta.5 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # About: brand is current product name; version comes from Tauri runtime metadata.
          path = 'src/settings.ts'
          text = read(path)
          text = replace_once(
              text,
              "import { invoke } from '@tauri-apps/api/core'\n",
              "import { getVersion } from '@tauri-apps/api/app'\nimport { invoke } from '@tauri-apps/api/core'\n",
              'settings getVersion import',
          )
          text = replace_once(
              text,
              "let surfaceMessage = ''\nlet autostartEnabled = false\n",
              "let surfaceMessage = ''\nlet applicationVersion = desktopRuntime ? '' : '浏览器预览'\nlet autostartEnabled = false\n",
              'settings application version state',
          )
          old_about = """function aboutSurfaceMarkup(): string {
            return surfaceShell('关于', `
              <div class=\"surface-scroll simple-surface about-panel\">
                <div class=\"about-icon\">课</div>
                <h3>桌面课表</h3>
                <p>Windows 本地桌面课表组件</p>
                <span>版本 0.2.0</span>
                <p class=\"about-note\">课表数据仅保存在本机，不会上传到服务器。</p>
              </div>
            `)
          }
          """
          new_about = """function aboutSurfaceMarkup(): string {
            return surfaceShell('关于', `
              <div class=\"surface-scroll simple-surface about-panel\">
                <div class=\"about-icon\">课</div>
                <h3>课刻</h3>
                <p>Windows 本地桌面课表组件</p>
                <span>版本 ${escapeHtml(applicationVersion || '读取中…')}</span>
                <p class=\"about-note\">课表数据仅保存在本机，不会上传到服务器。</p>
              </div>
            `)
          }

          async function refreshAboutVersion(): Promise<void> {
            if (!desktopRuntime || applicationVersion) return
            try {
              applicationVersion = await getVersion()
            } catch {
              applicationVersion = '未知'
            }
            if (surface === 'about') render()
          }
          """
          text = replace_once(text, old_about, new_about, 'about markup')
          text = replace_once(
              text,
              "  render()\n}\n\nfunction closeSurface(reason: 'backdrop' | 'explicit'): void {",
              "  render()\n  if (next === 'about') void refreshAboutVersion()\n}\n\nfunction closeSurface(reason: 'backdrop' | 'explicit'): void {",
              'about version hydration',
          )
          write(path, text)

          # Empty week message: keep one weak top-of-grid rule; remove later centering overrides.
          path = 'src/settings.css'
          text = read(path)
          first = """.week-empty {
            position: absolute;
            top: 46px;
            left: var(--time-column);
            right: 0;
            color: #9aa0a9;
            font-size: 13px;
            text-align: center;
            pointer-events: none;
          }
          """
          consolidated = """.week-empty {
            position: absolute;
            top: 46px;
            left: var(--time-column);
            right: 0;
            color: #9aa1aa;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
          }
          """
          text = replace_once(text, first, consolidated, 'primary week-empty rule')
          for label, block in [
              ('center week-empty override', ".week-empty {\n  top: 50%;\n  transform: translateY(-50%);\n}\n"),
              ('final week-empty override', ".week-empty {\n  top: 50%;\n  color: #9aa1aa;\n  font-size: 12px;\n}\n"),
          ]:
              text = replace_once(text, block, '', label)
          write(path, text)

          # Generate a pinned Tauri template plus one exact legacy-brand migration patch.
          path = 'scripts/generate-installer-template.mjs'
          text = read(path)
          start = text.index('const generated = source.replace(')
          end = text.index('mkdirSync(outDir', start)
          replacement = r'''let generated = source.replace(
            [
              "; Don't auto jump to finish page after installation page,",
              '; because the installation page has useful info that can be used debug any issues with the installer.',
              NO_AUTO_CLOSE_DIRECTIVE,
            ].join('\n'),
            '; Auto-advance to the finish page after a successful interactive installation.',
          )

          if (generated === source || generated.includes(NO_AUTO_CLOSE_DIRECTIVE)) {
            throw new Error('failed to apply the single installer finish-page patch')
          }

          function replaceExactlyOnce(value, needle, replacement, label) {
            const occurrences = value.split(needle).length - 1
            if (occurrences !== 1) {
              throw new Error(`${label}: expected exactly one anchor, found ${occurrences}`)
            }
            return value.replace(needle, replacement)
          }

          const productKeyAnchor = [
            '!define UNINSTKEY "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\${PRODUCTNAME}"',
            '!define MANUKEY "Software\\${MANUFACTURER}"',
            '!define MANUPRODUCTKEY "${MANUKEY}\\${PRODUCTNAME}"',
          ].join('\n')
          generated = replaceExactlyOnce(
            generated,
            productKeyAnchor,
            [
              productKeyAnchor,
              '!define LEGACY_PRODUCTNAME "桌面课表"',
              '!define LEGACY_UNINSTKEY "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\${LEGACY_PRODUCTNAME}"',
              '!define LEGACY_MANUPRODUCTKEY "${MANUKEY}\\${LEGACY_PRODUCTNAME}"',
            ].join('\n'),
            'legacy product key definitions',
          )

          generated = replaceExactlyOnce(
            generated,
            'Var PassiveMode',
            ['Var PassiveMode', 'Var LegacyBrandMigration'].join('\n'),
            'legacy migration state variable',
          )

          const restoreAnchor = [
            'Function RestorePreviousInstallLocation',
            '  ReadRegStr $4 SHCTX "${MANUPRODUCTKEY}" ""',
            '  StrCmp $4 "" +2 0',
            '    StrCpy $INSTDIR $4',
            'FunctionEnd',
          ].join('\n')
          const restoreWithLegacy = [
            'Function RestorePreviousInstallLocation',
            '  StrCpy $LegacyBrandMigration 0',
            '  ReadRegStr $4 SHCTX "${MANUPRODUCTKEY}" ""',
            '  ${If} $4 != ""',
            '    StrCpy $INSTDIR $4',
            '    Return',
            '  ${EndIf}',
            '',
            '  ; Only migrate the exact historical identity used by this project.',
            '  ReadRegStr $5 SHCTX "${LEGACY_UNINSTKEY}" "DisplayName"',
            '  ${If} $5 != "${LEGACY_PRODUCTNAME}"',
            '    Return',
            '  ${EndIf}',
            '  ReadRegStr $4 SHCTX "${LEGACY_UNINSTKEY}" "InstallLocation"',
            '  ${If} $4 == ""',
            '    ReadRegStr $4 SHCTX "${LEGACY_MANUPRODUCTKEY}" ""',
            '  ${EndIf}',
            '  ${If} $4 != ""',
            '    StrCpy $INSTDIR $4',
            '    StrCpy $LegacyBrandMigration 1',
            '  ${EndIf}',
            'FunctionEnd',
          ].join('\n')
          generated = replaceExactlyOnce(
            generated,
            restoreAnchor,
            restoreWithLegacy,
            'legacy install location migration',
          )

          const postInstallAnchor = [
            '  !ifmacrodef NSIS_HOOK_POSTINSTALL',
            '    !insertmacro NSIS_HOOK_POSTINSTALL',
            '  !endif',
          ].join('\n')
          const postInstallMigration = [
            postInstallAnchor,
            '',
            '  ; After the new product is fully installed, retire only the exact old identity.',
            '  ${If} $LegacyBrandMigration = 1',
            '    ReadRegStr $0 SHCTX "${LEGACY_UNINSTKEY}" "DisplayName"',
            '    ${If} $0 == "${LEGACY_PRODUCTNAME}"',
            '      DeleteRegKey SHCTX "${LEGACY_UNINSTKEY}"',
            '    ${EndIf}',
            '    ReadRegStr $0 SHCTX "${LEGACY_MANUPRODUCTKEY}" ""',
            '    ${If} $0 == $INSTDIR',
            '      DeleteRegKey SHCTX "${LEGACY_MANUPRODUCTKEY}"',
            '    ${EndIf}',
            '    Delete "$SMPROGRAMS\\${LEGACY_PRODUCTNAME}.lnk"',
            '    Delete "$DESKTOP\\${LEGACY_PRODUCTNAME}.lnk"',
            '  ${EndIf}',
          ].join('\n')
          generated = replaceExactlyOnce(
            generated,
            postInstallAnchor,
            postInstallMigration,
            'legacy post-install cleanup',
          )

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'patched finish-page auto-advance`,',
              'patched finish-page auto-advance + exact legacy brand migration`,',
          )
          write(path, text)

          # Installer template contract must explicitly retain the migration semantics.
          path = 'scripts/check-installer-template.mjs'
          text = read(path)
          marker = "  'DeleteRegKey HKCU \"${UNINSTKEY}\"',\n]"
          insert = """  'DeleteRegKey HKCU \"${UNINSTKEY}\"',
            '!define LEGACY_PRODUCTNAME \"桌面课表\"',
            '!define LEGACY_UNINSTKEY \"Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Uninstall\\\\${LEGACY_PRODUCTNAME}\"',
            'Var LegacyBrandMigration',
            'ReadRegStr $5 SHCTX \"${LEGACY_UNINSTKEY}\" \"DisplayName\"',
            'StrCpy $LegacyBrandMigration 1',
            'DeleteRegKey SHCTX \"${LEGACY_UNINSTKEY}\"',
            'Delete \"$SMPROGRAMS\\\\${LEGACY_PRODUCTNAME}.lnk\"',
            'Delete \"$DESKTOP\\\\${LEGACY_PRODUCTNAME}.lnk\"',
          ]"""
          text = replace_once(text, marker, insert, 'installer template required migration fragments')
          text = text.replace(
              'uninstall registry preserved; finish page auto-advance enabled',
              'uninstall registry preserved; exact 桌面课表→课刻 migration preserved; finish page auto-advance enabled',
          )
          write(path, text)

          # Packaged OCR gate now mirrors the release runtime resolver instead of recursively accepting any location.
          verify_script = r'''param(
            [Parameter(Mandatory = $true)][string]$Installer,
            [string]$WorkingRoot = (Join-Path $env:RUNNER_TEMP "course-widget-native-ocr-package-$PID")
          )

          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $expected = [ordered]@{
            'PP-OCRv5_mobile_det_fp16.mnn' = '617b5228b101275594f96ebb6ae7662fd1618bcf8e84b0ffde1cf3b48e754951'
            'PP-OCRv5_mobile_rec_fp16.mnn' = 'ff03e4204260325eabe9f4eae0ec8cc6b79b8a97a8e38a5292ba69cf02a689fc'
            'ppocr_keys_v5.txt' = 'f2ed6bb20a850ce4767fa9b4622d9b282985ab7f0ea8f8c11abd790ca6d2ff94'
          }

          $root = [IO.Path]::GetFullPath($WorkingRoot)
          $installRoot = Join-Path $root '中文安装目录\课刻'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null

          try {
            $installerPath = [IO.Path]::GetFullPath($Installer)
            $process = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Installer exited with code $($process.ExitCode)."
            }

            $registrationPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\课刻'
            $registration = Get-ItemProperty -LiteralPath $registrationPath -ErrorAction Stop
            $mainBinaryName = [string]$registration.MainBinaryName
            if ([string]::IsNullOrWhiteSpace($mainBinaryName)) {
              $mainBinaryName = 'desktop-course-widget.exe'
            }
            $mainExe = Join-Path $installRoot $mainBinaryName
            if (-not (Test-Path -LiteralPath $mainExe -PathType Leaf)) {
              throw "Installed main executable is missing: $mainExe"
            }

            $exeDir = Split-Path -Parent $mainExe
            $runtimeRoots = @(
              (Join-Path $exeDir 'ocr-native'),
              (Join-Path $exeDir 'resources\ocr-native'),
              (Join-Path $exeDir '_up_\resources\ocr-native')
            )
            $modelRoot = $null
            foreach ($candidateRoot in $runtimeRoots) {
              $complete = $true
              foreach ($name in $expected.Keys) {
                if (-not (Test-Path -LiteralPath (Join-Path $candidateRoot $name) -PathType Leaf)) {
                  $complete = $false
                  break
                }
              }
              if ($complete) {
                $modelRoot = $candidateRoot
                break
              }
            }
            if (-not $modelRoot) {
              throw "Installed OCR resources are not visible from any packaged runtime resolver root: $($runtimeRoots -join '; ')"
            }

            foreach ($entry in $expected.GetEnumerator()) {
              $path = Join-Path $modelRoot $entry.Key
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $entry.Value) {
                throw "Installed native OCR resource hash mismatch for $($entry.Key): $actual"
              }
            }

            $manifestPath = Join-Path $modelRoot 'manifest.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw 'Installed native OCR manifest.json is missing.'
            }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if (@($manifest.files).Count -ne $expected.Count) {
              throw "Native OCR manifest lists $(@($manifest.files).Count) files instead of $($expected.Count)."
            }

            $forbidden = @(
              Get-ChildItem -LiteralPath $installRoot -Recurse -File |
                Where-Object {
                  $_.Name -match '(?i)^python(w)?\.exe$' -or
                  $_.FullName -match '(?i)[\\/](site-packages|conda|paddle)([\\/]|$)'
                }
            )
            if ($forbidden.Count -gt 0) {
              throw "Installer contains a forbidden Python/Paddle runtime path: $($forbidden[0].FullName)"
            }

            Write-Host "packaged runtime OCR resolver root verified: $modelRoot"
            "runtime_resolver_model_root=$modelRoot" >> $env:GITHUB_STEP_SUMMARY
            "installed_model_count=$($expected.Count)" >> $env:GITHUB_STEP_SUMMARY
            "python_runtime_files=0" >> $env:GITHUB_STEP_SUMMARY
          }
          finally {
            $uninstaller = Get-ChildItem -LiteralPath $installRoot -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(uninstall|unins).*\.exe$' } |
              Select-Object -First 1
            if ($uninstaller) {
              Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
          '''
          write('scripts/verify-native-ocr-package.ps1', verify_script)

          # Extend the existing public-upgrade smoke without weakening its beta.1 defaults.
          path = 'scripts/windows-release-upgrade-smoke.ps1'
          text = read(path)
          old_param = """param(
            [Parameter(Mandatory = $true)]
            [string]$Candidate
          )
          """
          new_param = """param(
            [Parameter(Mandatory = $true)]
            [string]$Candidate,
            [string]$BaseVersion = '0.5.0-beta.1',
            [string]$BaseUrl = 'https://github.com/Tyr1onX/desktop-course-widget/releases/download/v0.5.0-beta.1/_0.5.0-beta.1_x64-setup.exe',
            [string]$BaseSha256 = '8ac5d9e62bc492e0e80e3aad94c338c070b0cc349f0d11ec35c7f5a909980126',
            [string]$LegacyProductName = ''
          )
          """
          text = replace_once(text, old_param, new_param, 'upgrade smoke params')
          constants = """$baseVersion = '0.5.0-beta.1'
          $baseUrl = 'https://github.com/Tyr1onX/desktop-course-widget/releases/download/v0.5.0-beta.1/_0.5.0-beta.1_x64-setup.exe'
          $baseSha256 = '8ac5d9e62bc492e0e80e3aad94c338c070b0cc349f0d11ec35c7f5a909980126'
          $baseInstaller = Join-Path $env:RUNNER_TEMP 'course-widget-v0.5.0-beta.1.exe'
          """
          text = replace_once(
              text,
              constants,
              "$baseVersion = $BaseVersion\n$baseUrl = $BaseUrl\n$baseSha256 = $BaseSha256.ToLowerInvariant()\n$baseInstaller = Join-Path $env:RUNNER_TEMP (\"course-widget-{0}.exe\" -f $baseVersion)\n$baseProductName = if ([string]::IsNullOrWhiteSpace($LegacyProductName)) { $productName } else { $LegacyProductName }\n",
              'upgrade smoke baseline constants',
          )
          text = replace_once(
              text,
              'function Get-UninstallEntries {\n',
              'function Get-UninstallEntries([string]$Name = $productName) {\n',
              'upgrade uninstall lookup signature',
          )
          text = replace_once(text, '$_.DisplayName -eq $productName -and', '$_.DisplayName -eq $Name -and', 'upgrade uninstall display name')
          text = replace_once(
              text,
              'function Get-Registration([string]$Version) {\n  $entries = @(Get-UninstallEntries)\n  if ($entries.Count -ne 1) {\n    throw "Expected exactly one $productName uninstall registration, found $($entries.Count)."\n',
              'function Get-Registration([string]$Version, [string]$Name = $productName) {\n  $entries = @(Get-UninstallEntries -Name $Name)\n  if ($entries.Count -ne 1) {\n    throw "Expected exactly one $Name uninstall registration, found $($entries.Count)."\n',
              'upgrade registration lookup',
          )
          text = replace_once(
              text,
              'if (@(Get-UninstallEntries).Count -ne 0) {\n  throw "$productName is already installed on the release-upgrade runner."\n}\n',
              'if (@(Get-UninstallEntries -Name $productName).Count -ne 0) {\n  throw "$productName is already installed on the release-upgrade runner."\n}\nif ($baseProductName -ne $productName -and @(Get-UninstallEntries -Name $baseProductName).Count -ne 0) {\n  throw "$baseProductName is already installed on the release-upgrade runner."\n}\n',
              'upgrade initial registration guard',
          )
          text = replace_once(text, '$baseRegistration = Get-Registration $baseVersion', '$baseRegistration = Get-Registration $baseVersion $baseProductName', 'baseline registration brand')
          text = replace_once(
              text,
              '  Probe-App $basePaths.MainExe "public $baseVersion"\n  Seed-Beta1UserData\n\n  $candidateProcess =',
              '''  Probe-App $basePaths.MainExe "public $baseVersion"
            Seed-Beta1UserData

            $legacyStartShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "$baseProductName.lnk"
            $legacyDesktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) "$baseProductName.lnk"
            if ($baseProductName -ne $productName) {
              if (-not (Test-Path -LiteralPath $legacyStartShortcut)) {
                throw "Public $baseVersion did not create the expected legacy Start Menu shortcut: $legacyStartShortcut"
              }
              if (-not (Test-Path -LiteralPath $legacyDesktopShortcut)) {
                throw "Public $baseVersion did not create the expected legacy desktop shortcut: $legacyDesktopShortcut"
              }
              Write-Host "legacy Windows identity verified before upgrade: DisplayName='$baseProductName' installRoot='$($basePaths.InstallRoot)'"
            }

            $candidateProcess =''',
              'legacy identity baseline assertions',
          )
          text = replace_once(
              text,
              '  if ($candidatePaths.InstallRoot -ne $basePaths.InstallRoot) {\n    throw "Upgrade changed install root: \'$($basePaths.InstallRoot)\' -> \'$($candidatePaths.InstallRoot)\'."\n  }\n  Probe-App',
              '''  if ($candidatePaths.InstallRoot -ne $basePaths.InstallRoot) {
              throw "Upgrade changed install root: '$($basePaths.InstallRoot)' -> '$($candidatePaths.InstallRoot)'."
            }
            if ($baseProductName -ne $productName) {
              if (@(Get-UninstallEntries -Name $baseProductName).Count -ne 0) {
                throw "Legacy uninstall registration '$baseProductName' remained after candidate upgrade."
              }
              if (Test-Path -LiteralPath $legacyStartShortcut) {
                throw "Legacy Start Menu shortcut remained after migration: $legacyStartShortcut"
              }
              if (Test-Path -LiteralPath $legacyDesktopShortcut) {
                throw "Legacy desktop shortcut remained after migration: $legacyDesktopShortcut"
              }
              $newStartShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "$productName.lnk"
              $newDesktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) "$productName.lnk"
              foreach ($shortcut in @($newStartShortcut, $newDesktopShortcut)) {
                if (-not (Test-Path -LiteralPath $shortcut)) {
                  throw "Migrated $productName shortcut is missing: $shortcut"
                }
              }
              $shell = New-Object -ComObject WScript.Shell
              $startTarget = [IO.Path]::GetFullPath($shell.CreateShortcut($newStartShortcut).TargetPath)
              $expectedTarget = [IO.Path]::GetFullPath($candidatePaths.MainExe)
              if ($startTarget -ne $expectedTarget) {
                throw "Migrated Start Menu shortcut targets '$startTarget', expected '$expectedTarget'."
              }
              Write-Host "legacy brand migration verified: old registration/shortcuts removed; new identity='$productName'; installRoot preserved"
            }
            Probe-App''',
              'legacy identity post-upgrade assertions',
          )
          text = replace_once(
              text,
              '  Write-Host "public release upgrade smoke passed: $baseVersion -> $expectedVersion; timetable/settings preserved; default uninstall preserved data; delete-app-data removed data"\n',
              '  Write-Host "public release upgrade smoke passed: $baseVersion -> $expectedVersion; baselineBrand=$baseProductName; timetable/settings preserved; default uninstall preserved data; delete-app-data removed data"\n',
              'upgrade success output',
          )
          text = replace_once(
              text,
              '  $entries = @(Get-UninstallEntries)\n  foreach ($entry in $entries) {',
              '  $entries = @(Get-UninstallEntries -Name $productName)\n  if ($baseProductName -ne $productName) { $entries += @(Get-UninstallEntries -Name $baseProductName) }\n  foreach ($entry in $entries) {',
              'upgrade cleanup registrations',
          )
          write(path, text)

          # Dedicated static regressions for this narrow beta.5 round.
          beta5_test = r'''import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import test from 'node:test'

          const settings = readFileSync('src/settings.ts', 'utf8')
          const css = readFileSync('src/settings.css', 'utf8')
          const generator = readFileSync('scripts/generate-installer-template.mjs', 'utf8')
          const packageGate = readFileSync('scripts/verify-native-ocr-package.ps1', 'utf8')

          test('About uses current brand and runtime application version', () => {
            assert.match(settings, /import \{ getVersion \} from '@tauri-apps\/api\/app'/)
            assert.match(settings, /<h3>课刻<\/h3>/)
            assert.match(settings, /applicationVersion = await getVersion\(\)/)
            assert.doesNotMatch(settings, /版本 0\.2\.0|<h3>桌面课表<\/h3>/)
          })

          test('week empty hint has one non-centered CSS definition', () => {
            assert.equal((css.match(/\.week-empty\s*\{/g) ?? []).length, 1)
            const block = css.match(/\.week-empty\s*\{[^}]+\}/s)?.[0] ?? ''
            assert.match(block, /top:\s*46px/)
            assert.doesNotMatch(block, /top:\s*50%|translateY/)
          })

          test('installer generator only migrates the exact historical product identity', () => {
            assert.match(generator, /LEGACY_PRODUCTNAME.*桌面课表/)
            assert.match(generator, /LEGACY_UNINSTKEY/)
            assert.match(generator, /LegacyBrandMigration/)
            assert.match(generator, /DeleteRegKey SHCTX.*LEGACY_UNINSTKEY/)
            assert.match(generator, /SMPROGRAMS.*LEGACY_PRODUCTNAME/)
            assert.match(generator, /DESKTOP.*LEGACY_PRODUCTNAME/)
          })

          test('packaged OCR gate mirrors release runtime resolver roots', () => {
            assert.match(packageGate, /Join-Path \$exeDir 'ocr-native'/)
            assert.match(packageGate, /Join-Path \$exeDir 'resources\\ocr-native'/)
            assert.match(packageGate, /Join-Path \$exeDir '_up_\\resources\\ocr-native'/)
            assert.doesNotMatch(packageGate, /Get-ChildItem -LiteralPath \$installRoot -Recurse -File \|\s*Where-Object \{ \$expected\.Contains/s)
          })
          '''
          write('scripts/beta5-regressions.test.mjs', beta5_test)

          # Candidate identity moves to beta.5 in both formal CI workflows.
          for path in ['.github/workflows/validate.yml', '.github/workflows/release-build.yml']:
              text = read(path)
              if '0.5.0-beta.4' not in text:
                  raise SystemExit(f'{path}: beta.4 candidate identity not found')
              text = text.replace('0.5.0-beta.4', '0.5.0-beta.5')
              write(path, text)

          # Add the distinct real public v0.3.0 legacy-brand migration gate.
          path = '.github/workflows/release-build.yml'
          text = read(path)
          anchor = """      - name: Verify packaged native OCR resources
          """
          migration_step = """      - name: Smoke test public v0.3.0 legacy-brand upgrade
                shell: pwsh
                run: |
                  $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
                  if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
                  ./scripts/windows-release-upgrade-smoke.ps1 `
                    -Candidate $installer.FullName `
                    -BaseVersion '0.3.0' `
                    -BaseUrl 'https://github.com/Tyr1onX/desktop-course-widget/releases/download/v0.3.0/_0.3.0_x64-setup.exe' `
                    -BaseSha256 '4a54a97c9dc0799098d123ffa0ba5ae253fe6557e1e8067968706a62404b99b6' `
                    -LegacyProductName '桌面课表'

                - name: Verify packaged native OCR resources
          """
          text = replace_once(text, anchor, migration_step, 'release v0.3 migration gate')
          # Normalize the indentation introduced above to the workflow's six-space step indent.
          text = text.replace('\n            shell: pwsh\n            run: |\n', '\n        shell: pwsh\n        run: |\n')
          text = text.replace('\n              $installer =', '\n          $installer =')
          text = text.replace('\n              if (-not $installer)', '\n          if (-not $installer)')
          text = text.replace('\n              ./scripts/windows-release-upgrade-smoke.ps1', '\n          ./scripts/windows-release-upgrade-smoke.ps1')
          text = text.replace('\n                -Candidate', '\n            -Candidate')
          text = text.replace('\n                -BaseVersion', '\n            -BaseVersion')
          text = text.replace('\n                -BaseUrl', '\n            -BaseUrl')
          text = text.replace('\n                -BaseSha256', '\n            -BaseSha256')
          text = text.replace('\n                -LegacyProductName', '\n            -LegacyProductName')
          text = text.replace('\n            - name: Verify packaged native OCR resources', '\n      - name: Verify packaged native OCR resources')
          write(path, text)
          PY

          node scripts/set-build-version.mjs 0.5.0-beta.5
          node scripts/generate-installer-template.mjs

