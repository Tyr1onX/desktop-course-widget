name: Apply beta.5 non-workflow changes once

on:
  push:
    branches:
      - fix/v0.5.0-beta.5
    paths:
      - .github/workflows/apply-beta5-nonworkflow-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/v0.5.0-beta.5
          fetch-depth: 0

      - name: Reuse scoped transformation and stage workflow outputs as ordinary files
        shell: bash
        run: |
          awk '
            /python3 <<'"'"'PY'"'"'/{capture=1; next}
            capture && /^          PY$/{capture=0; exit}
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-beta5-fixes-once.yml > /tmp/apply-beta5.py
          python3 /tmp/apply-beta5.py
          node scripts/set-build-version.mjs 0.5.0-beta.5
          node scripts/generate-installer-template.mjs

          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release-build.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('      - name: Smoke test public v0.3.0 legacy-brand upgrade')
          end = text.index('      - name: Verify packaged native OCR resources', start)
          block = '''      - name: Smoke test public v0.3.0 legacy-brand upgrade
            shell: pwsh
            run: |
              $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
              if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
              ./scripts/windows-release-upgrade-smoke.ps1 `
                -Candidate $installer.FullName `
                -BaseVersion '0.3.0' `
                -BaseUrl 'https://github.com/Tyr1onX/desktop-course-widget/releases/download/v0.3.0/_0.3.0_x64-setup.exe' `
                -BaseSha256 '4a54a97c9dc0799098d123ffa0ba5ae253fe6557e1e8067968706a62404b99b6' `
                -LegacyProductName '桌面课表'

          '''
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

          mkdir -p .ci-staging
          cp .github/workflows/release-build.yml .ci-staging/release-build.yml
          cp .github/workflows/validate.yml .ci-staging/validate.yml
          git restore .github/workflows/release-build.yml .github/workflows/validate.yml

      - name: Commit non-workflow changes
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git commit -m "fix: prepare v0.5.0-beta.5 regression fixes"
          git push origin HEAD:fix/v0.5.0-beta.5
