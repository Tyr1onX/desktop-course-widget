name: Apply data backup feature

on:
  push:
    branches:
      - feat/data-backup-recovery
    paths:
      - .github/workflows/apply-data-backup.yml
      - scripts/apply-data-backup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/data-backup-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply implementation
        run: python scripts/apply-data-backup.py

      - name: Install web dependencies
        run: npm ci

      - name: Build web interface
        run: npm run web:build

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check diff
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add settings.html src/backup-ui.ts src/backup-ui.css src-tauri/src/lib.rs src-tauri/src/data_backup.rs
          git commit -m "feat: add local data backup and recovery"
          git push origin HEAD:feat/data-backup-recovery
