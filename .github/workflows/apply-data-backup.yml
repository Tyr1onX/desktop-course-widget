name: Apply data backup feature

on:
  push:
    branches:
      - feat/data-backup-recovery
    paths:
      - .github/workflows/apply-data-backup.yml
      - scripts/apply-data-backup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/data-backup-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply implementation
        run: python scripts/apply-data-backup.py

      - name: Install web dependencies
        run: npm ci

      - name: Build web interface
        id: web
        continue-on-error: true
        shell: pwsh
        run: npm run web:build 2>&1 | Tee-Object -FilePath data-backup-web.log

      - name: Run Rust library tests
        id: rust
        continue-on-error: true
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | Tee-Object -FilePath data-backup-rust.log

      - name: Check diff
        id: diff
        continue-on-error: true
        shell: pwsh
        run: |
          git diff --check 2>&1 | Tee-Object -FilePath data-backup-diff.log
          git diff --stat

      - name: Record validation result
        if: always()
        shell: pwsh
        run: |
          @"
          web=${{ steps.web.outcome }}
          rust=${{ steps.rust.outcome }}
          diff=${{ steps.diff.outcome }}
          "@ | Set-Content data-backup-ci-result.txt -Encoding utf8

      - name: Commit generated implementation and logs
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add settings.html src/backup-ui.ts src/backup-ui.css src-tauri/src/lib.rs src-tauri/src/data_backup.rs data-backup-ci-result.txt data-backup-web.log data-backup-rust.log data-backup-diff.log
          git commit -m "feat: add local data backup and recovery"
          git push origin HEAD:feat/data-backup-recovery

      - name: Fail when validation failed
        if: steps.web.outcome != 'success' || steps.rust.outcome != 'success' || steps.diff.outcome != 'success'
        shell: pwsh
        run: throw 'Generated data backup implementation did not pass validation'
