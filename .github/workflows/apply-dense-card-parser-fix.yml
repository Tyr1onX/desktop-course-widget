name: Apply dense card parser fix

on:
  push:
    branches:
      - spike/rust-native-ocr
    paths:
      - '.github/workflows/apply-dense-card-parser-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/rust-native-ocr
      - name: Restructure dense card parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          metadata_path = Path('src-tauri/src/native_ocr/metadata.rs')
          metadata = metadata_path.read_text(encoding='utf-8')
          metadata = replace_between(metadata, 'fn course_anchors(', 'fn parse_weeks_and_parity(', r'''
          fn course_anchors(tokens: &[Token]) -> Vec<CourseAnchor> {
              let mut anchors = tokens
                  .iter()
                  .enumerate()
                  .filter_map(|(token_index, token)| {
                      let weekday = weekday_from_schedule_text(&token.text)?;
                      let (start_section, end_section) = section_range_from_text(&token.text)?;
                      let (weeks, parity, used_default_weeks) = parse_weeks_and_parity(&token.text);
                      Some(CourseAnchor {
                          token_index,
                          weekday,
                          start_section,
                          end_section,
                          weeks,
                          parity,
                          used_default_weeks,
                      })
                  })
                  .collect::<Vec<_>>();
              anchors.sort_by(|left, right| {
                  left.weekday
                      .cmp(&right.weekday)
                      .then(left.start_section.cmp(&right.start_section))
                      .then_with(|| {
                          tokens[left.token_index]
                              .top
                              .partial_cmp(&tokens[right.token_index].top)
                              .unwrap_or(Ordering::Equal)
                      })
              });
              anchors
          }

          fn weekday_from_schedule_text(value: &str) -> Option<u8> {
              let pattern = Regex::new(r"(?:周|星期)([一二三四五六日天1-7])").unwrap();
              let captures = pattern.captures(&compact_text(value))?;
              weekday_character(captures.get(1)?.as_str().chars().next()?)
          }

          fn section_range_from_text(value: &str) -> Option<(u8, u8)> {
              let compact = compact_text(value);
              let patterns = [
                  r"第?(\d{1,2})节(?:[-—~－–‑一]+|至|到)第?(\d{1,2})节?",
                  r"第?(\d{1,2})(?:[-—~－–‑一]+|至|到)第?(\d{1,2})节",
              ];
              for pattern in patterns {
                  let regex = Regex::new(pattern).unwrap();
                  let Some(captures) = regex.captures(&compact) else {
                      continue;
                  };
                  let start = captures.get(1)?.as_str().parse::<u8>().ok()?;
                  let end = captures.get(2)?.as_str().parse::<u8>().ok()?;
                  if start > 0 && end >= start && end <= 20 {
                      return Some((start, end));
                  }
              }
              None
          }
          ''')
          metadata = replace_between(metadata, 'fn find_teacher_fragment', 'fn explicit_teacher_from_text', r'''
          fn find_teacher_fragment<'a>(
              tokens: impl IntoIterator<Item = &'a Token>,
              name_token: &'a Token,
              course_name: &str,
              _anchor: &'a Token,
          ) -> Option<(&'a Token, String)> {
              let mut tokens = tokens.into_iter().collect::<Vec<_>>();
              tokens.sort_by(|left, right| token_reading_order(left, right));

              for token in &tokens {
                  for value in token.parts.iter().chain(std::iter::once(&token.text)) {
                      if let Some(teacher) = explicit_teacher_from_text(value) {
                          return Some((*token, teacher));
                      }
                  }
              }

              let name_part = name_token.parts.iter().position(|value| {
                  course_name_from_text(value).as_deref() == Some(course_name)
              });
              if let Some(name_part) = name_part {
                  for value in name_token.parts.iter().skip(name_part + 1) {
                      if is_location_text(value) || looks_like_schedule_metadata(value) {
                          break;
                      }
                      if let Some(teacher) = bare_teacher_from_text(value, course_name) {
                          return Some((name_token, teacher));
                      }
                  }
              }

              let schedule_top = tokens
                  .iter()
                  .filter(|token| {
                      token.parts.iter().chain(std::iter::once(&token.text)).any(|value| {
                          looks_like_schedule_metadata(value)
                              || section_range_from_text(value).is_some()
                      })
                  })
                  .map(|token| token.top)
                  .fold(f32::MAX, f32::min);
              let schedule_top = if schedule_top.is_finite() {
                  schedule_top
              } else {
                  name_token.bottom() + name_token.height.max(18.0) * 3.0
              };

              let mut passed_name = false;
              for token in tokens {
                  if std::ptr::eq(token, name_token) {
                      passed_name = true;
                      continue;
                  }
                  if !passed_name || token.top + 2.0 < name_token.top {
                      continue;
                  }
                  if token.top >= schedule_top - 1.0 {
                      break;
                  }
                  if token.top - name_token.bottom()
                      > name_token.height.max(token.height).max(18.0) * 2.2
                  {
                      break;
                  }
                  for value in &token.parts {
                      if let Some(teacher) = bare_teacher_from_text(value, course_name) {
                          return Some((token, teacher));
                      }
                  }
              }
              None
          }
          ''')
          marker = 'fn find_location_fragment'
          roster = r'''
          fn looks_like_roster_text(value: &str) -> bool {
              let compact = compact_text(value);
              let repeated_class = Regex::new(
                  r"\d{2}[\u{4e00}-\u{9fff}A-Za-z]{1,10}\d{2}",
              )
              .unwrap()
              .find_iter(&compact)
              .count();
              let separators = compact
                  .chars()
                  .filter(|character| matches!(character, ',' | '，' | '、'))
                  .count();
              let digits = compact
                  .chars()
                  .filter(|character| character.is_ascii_digit())
                  .count();
              repeated_class >= 2 || (separators >= 2 && digits >= 6)
          }

          '''
          if 'fn looks_like_roster_text' not in metadata:
              metadata = metadata.replace(marker, roster + marker, 1)
          metadata = replace_between(metadata, 'fn normalize_trailing_course_code', 'fn course_name_from_text', r'''
          fn normalize_trailing_course_code(value: &str) -> String {
              let pattern = Regex::new(
                  r"^(.*[\u{4e00}-\u{9fff}].*?)(?:\[|[|丨Il])(\d{2})(?:\]|[|丨Il])?$",
              )
              .unwrap();
              let Some(captures) = pattern.captures(value) else {
                  return value.to_owned();
              };
              let base = captures
                  .get(1)
                  .map(|value| value.as_str().trim())
                  .unwrap_or_default();
              let code = captures
                  .get(2)
                  .map(|value| value.as_str())
                  .unwrap_or_default();
              if base.is_empty() || code.is_empty() {
                  value.to_owned()
              } else {
                  format!("{base}[{code}]")
              }
          }
          ''')
          metadata = metadata.replace(
              "character.is_ascii_punctuation()\n                || matches!(character, '（' | '）' | '【' | '】' | '，' | '。' | '：' | '；')",
              "(character.is_ascii_punctuation() && !matches!(character, '[' | ']'))\n                || matches!(character, '（' | '）' | '【' | '】' | '，' | '。' | '：' | '；')",
              1,
          )
          metadata = metadata.replace(
              "|| is_common_header(&candidate)\n    {",
              "|| is_common_header(&candidate)\n        || looks_like_roster_text(&candidate)\n    {",
              1,
          )
          metadata = metadata.replace(
              "|| looks_like_schedule_metadata(&candidate)\n    {\n        return None;\n    }\n    candidate = normalize_trailing_course_code(&candidate);",
              "|| looks_like_schedule_metadata(&candidate)\n        || looks_like_roster_text(&candidate)\n    {\n        return None;\n    }\n    candidate = normalize_trailing_course_code(&candidate);",
              1,
          )
          metadata_path.write_text(metadata, encoding='utf-8')

          grid_path = Path('src-tauri/src/native_ocr/grid.rs')
          grid = grid_path.read_text(encoding='utf-8')
          grid = grid.replace(
              "let starts_named_card = token_starts_course_card(&token)\n                && groups.last().is_some_and(|group| group_has_card_body(group));",
              "let starts_named_card = token_starts_course_card(&token)\n                && groups.last().is_some_and(|group| {\n                    group.iter().any(token_starts_course_card)\n                });",
              1,
          )
          old = '''            let parsed_anchors = course_anchors(&group);
            let first_y = group.first().map(Token::center_y).unwrap_or_default();
            let last_y = group.last().map(Token::center_y).unwrap_or(first_y);
            let positional_start = nearest_section(sections, first_y);
            let positional_end = nearest_section(sections, last_y).max(positional_start);
            let fallback_weeks = parse_weeks_and_parity(&combined);
            let (weekday, start_section, end_section, weeks, parity, used_default_weeks, anchor) =
                if let Some(parsed) = parsed_anchors.first() {
                    (
                        parsed.weekday,
                        parsed.start_section,
                        parsed.end_section,
                        parsed.weeks.clone(),
                        parsed.parity.clone(),
                        parsed.used_default_weeks,
                        &group[parsed.token_index],
                    )
                } else {
                    let Some(anchor) = group.first() else {
                        continue;
                    };
                    (
                        header.weekday,
                        positional_start,
                        positional_end,
                        fallback_weeks.0,
                        fallback_weeks.1,
                        fallback_weeks.2,
                        anchor,
                    )
                };'''
          new = '''            let parsed_anchors = course_anchors(&group);
            let first_y = group.first().map(Token::center_y).unwrap_or_default();
            let last_y = group.last().map(Token::center_y).unwrap_or(first_y);
            let positional_start = nearest_section(sections, first_y);
            let positional_end = nearest_section(sections, last_y).max(positional_start);
            let fallback_weeks = parse_weeks_and_parity(&combined);
            let parsed_range = section_range_from_text(&combined);
            let parsed_weekday = weekday_from_schedule_text(&combined).unwrap_or(header.weekday);
            let (weekday, start_section, end_section, weeks, parity, used_default_weeks, anchor) =
                if let Some(parsed) = parsed_anchors.first() {
                    (
                        parsed.weekday,
                        parsed.start_section,
                        parsed.end_section,
                        parsed.weeks.clone(),
                        parsed.parity.clone(),
                        parsed.used_default_weeks,
                        &group[parsed.token_index],
                    )
                } else {
                    let Some(anchor) = group.first() else {
                        continue;
                    };
                    let (start_section, end_section) =
                        parsed_range.unwrap_or((positional_start, positional_end));
                    (
                        parsed_weekday,
                        start_section,
                        end_section,
                        fallback_weeks.0,
                        fallback_weeks.1,
                        fallback_weeks.2,
                        anchor,
                    )
                };'''
          if old not in grid:
              raise SystemExit('fallback anchor block not found')
          grid = grid.replace(old, new, 1)
          start = grid.index('fn section_markers(')
          end = grid.index('\nfn section_number_from_text', start)
          dense = r'''
          fn section_markers(tokens: &[Token], image_width: u32) -> Vec<(u8, f32)> {
              let mut detected = tokens
                  .iter()
                  .filter(|token| token.center_x() < image_width as f32 * 0.18)
                  .filter_map(|token| {
                      section_number_from_text(&token.text).map(|section| (section, token.center_y()))
                  })
                  .collect::<Vec<_>>();
              detected.sort_by_key(|(section, _)| *section);
              detected.dedup_by_key(|(section, _)| *section);
              if detected.len() < 2 {
                  return detected;
              }

              let mut spacings = detected
                  .windows(2)
                  .filter_map(|pair| {
                      let section_delta = pair[1].0.saturating_sub(pair[0].0);
                      (section_delta > 0).then_some((pair[1].1 - pair[0].1) / section_delta as f32)
                  })
                  .filter(|spacing| spacing.is_finite() && *spacing > 4.0)
                  .collect::<Vec<_>>();
              if spacings.is_empty() {
                  return detected;
              }
              spacings.sort_by(|left, right| {
                  left.partial_cmp(right).unwrap_or(Ordering::Equal)
              });
              let spacing = spacings[spacings.len() / 2];
              let reference = detected[0];
              let last_section = detected
                  .iter()
                  .map(|(section, _)| *section)
                  .max()
                  .unwrap_or(DEFAULT_SECTION_COUNT)
                  .max(DEFAULT_SECTION_COUNT);
              (1..=last_section)
                  .map(|section| {
                      let offset = section as i16 - reference.0 as i16;
                      (section, reference.1 + spacing * offset as f32)
                  })
                  .collect()
          }
          '''
          grid = grid[:start] + dense.rstrip() + '\n\n' + grid[end+1:]
          grid_path.write_text(grid, encoding='utf-8')

          tests_path = Path('src-tauri/src/native_ocr/tests.rs')
          tests = tests_path.read_text(encoding='utf-8')
          insertion = r'''

              #[test]
              fn normalizes_missing_course_code_brackets_and_rejects_rosters() {
                  assert_eq!(
                      course_name_from_text("课程甲[03").as_deref(),
                      Some("课程甲[03]")
                  );
                  assert_eq!(
                      course_name_from_text("课程乙|04").as_deref(),
                      Some("课程乙[04]")
                  );
                  assert!(course_name_from_text("24班级01,24班级02,24班级03").is_none());
              }

              #[test]
              fn fallback_teacher_is_read_after_title_when_anchor_is_title() {
                  let tokens = vec![
                      token("星期一", 190.0, 40.0),
                      token("星期二", 390.0, 40.0),
                      token("星期三", 590.0, 40.0),
                      token("1", 20.0, 120.0),
                      token("2", 20.0, 180.0),
                      token("课程甲|03", 130.0, 90.0),
                      token("李明", 130.0, 118.0),
                      token("3-8周", 130.0, 146.0),
                      token("第一教学楼", 130.0, 174.0),
                  ];
                  let headers = weekday_headers(&tokens);
                  let sections = section_markers(&tokens, 800);
                  let courses = fallback_courses(&tokens, &headers, &sections, 800, 600);
                  assert_eq!(courses.len(), 1);
                  assert_eq!(courses[0].name, "课程甲[03]");
                  assert_eq!(courses[0].teacher.as_deref(), Some("李明"));
              }

              #[test]
              fn sparse_section_markers_are_completed_before_position_mapping() {
                  let tokens = vec![
                      token("1", 20.0, 100.0),
                      token("3", 20.0, 220.0),
                      token("5", 20.0, 340.0),
                  ];
                  let sections = section_markers(&tokens, 800);
                  assert_eq!(sections.len(), 12);
                  assert_eq!(nearest_section(&sections, 160.0), 2);
                  assert_eq!(nearest_section(&sections, 280.0), 4);
              }

              #[test]
              fn fallback_preserves_each_strong_title_even_when_previous_card_is_incomplete() {
                  let tokens = vec![
                      token("星期一", 190.0, 40.0),
                      token("星期二", 390.0, 40.0),
                      token("星期三", 590.0, 40.0),
                      token("1", 20.0, 100.0),
                      token("2", 20.0, 160.0),
                      token("3", 20.0, 220.0),
                      token("课程甲|01", 130.0, 82.0),
                      token("课程乙|02", 130.0, 142.0),
                      token("李明", 130.0, 170.0),
                      token("3-8周,星期1,第2节--第3节", 130.0, 198.0),
                      token("第一教学楼", 130.0, 226.0),
                  ];
                  let headers = weekday_headers(&tokens);
                  let sections = section_markers(&tokens, 800);
                  let courses = fallback_courses(&tokens, &headers, &sections, 800, 600);
                  assert_eq!(courses.len(), 1);
                  assert_eq!(courses[0].name, "课程乙[02]");
                  assert_eq!(courses[0].teacher.as_deref(), Some("李明"));
              }
          '''
          pos = tests.rfind('\n}')
          tests = tests[:pos] + insertion + tests[pos:]
          tests_path.write_text(tests, encoding='utf-8')
          PY
          rm .github/workflows/apply-dense-card-parser-fix.yml
      - name: Commit parser fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: parse dense timetables by course cards"
          git push origin HEAD:spike/rust-native-ocr
