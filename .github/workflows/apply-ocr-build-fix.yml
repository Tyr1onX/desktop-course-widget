name: Apply OCR build fix

on:
  push:
    branches:
      - spike/rust-native-ocr
    paths:
      - '.github/workflows/apply-ocr-build-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/rust-native-ocr
      - name: Remove unused timer local
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/screenshot-import-controller.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    const elapsedSeconds = recognitionElapsedSeconds()
            updatePickerState(currentSurface)
          '''
          new = '''    updatePickerState(currentSurface)
          '''
          if old not in text:
              raise SystemExit('expected timer block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-ocr-build-fix.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove unused recognition timer local"
          git push origin HEAD:spike/rust-native-ocr
