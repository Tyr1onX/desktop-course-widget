name: Apply dense timetable OCR follow-up

on:
  push:
    branches:
      - spike/rust-native-ocr
    paths:
      - '.github/workflows/apply-ocr-dense-timetable-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/rust-native-ocr

      - name: Apply focused parser and UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src-tauri/src/native_ocr/metadata.rs',
              '''    let anchor = Regex::new(
                  r"(?:周|星期)([一二三四五六日天]).*?第?\\s*(\\d{1,2})\\s*(?:节\\s*)?[-—~至]\\s*第?\\s*(\\d{1,2})\\s*节",
              )''',
              '''    let anchor = Regex::new(
                  r"(?:周|星期)([一二三四五六日天1-7]).*?第?\\s*(\\d{1,2})\\s*(?:节\\s*)?(?:[-—~]+|至|到)\\s*第?\\s*(\\d{1,2})\\s*节",
              )''',
          )
          replace(
              'src-tauri/src/native_ocr/metadata.rs',
              '    let range = Regex::new(r"(\\d{1,2})\\s*[-—~至]\\s*(\\d{1,2})\\s*周").unwrap();',
              '    let range = Regex::new(r"(\\d{1,2})\\s*(?:[-—~]+|至|到)\\s*(\\d{1,2})\\s*周").unwrap();',
          )
          replace(
              'src-tauri/src/native_ocr/metadata.rs',
              '''fn find_location_fragment<'a>(
          ''',
              '''fn find_teacher_fragment<'a>(
              tokens: impl IntoIterator<Item = &'a Token>,
              name_token: &'a Token,
              course_name: &str,
          ) -> Option<(&'a Token, String)> {
              let tokens = tokens.into_iter().collect::<Vec<_>>();

              for token in &tokens {
                  for value in token.parts.iter().chain(std::iter::once(&token.text)) {
                      if let Some(teacher) = explicit_teacher_from_text(value) {
                          return Some((*token, teacher));
                      }
                  }
              }

              let name_part = name_token.parts.iter().position(|value| {
                  course_name_from_text(value).as_deref() == Some(course_name)
              });
              for value in name_token.parts.iter().skip(name_part.map_or(0, |index| index + 1)) {
                  if is_location_text(value) || looks_like_schedule_metadata(value) {
                      break;
                  }
                  if let Some(teacher) = bare_teacher_from_text(value, course_name) {
                      return Some((name_token, teacher));
                  }
              }

              let mut nearby = tokens
                  .into_iter()
                  .filter(|token| !std::ptr::eq(*token, name_token))
                  .filter(|token| token.top >= name_token.top - 2.0)
                  .collect::<Vec<_>>();
              nearby.sort_by(|left, right| token_reading_order(left, right));
              for token in nearby {
                  if token.top > name_token.bottom() + name_token.height.max(28.0) * 3.0 {
                      break;
                  }
                  for value in &token.parts {
                      if let Some(teacher) = bare_teacher_from_text(value, course_name) {
                          return Some((token, teacher));
                      }
                  }
              }
              None
          }

          fn explicit_teacher_from_text(value: &str) -> Option<String> {
              let compact = compact_text(value);
              if !is_teacher_text(&compact) {
                  return None;
              }
              let prefix = Regex::new(r"^(?:老师|教师)[:：]?").unwrap();
              let suffix = Regex::new(r"(?:老师|教师|教授)$").unwrap();
              let mut candidate = prefix.replace(&compact, "").into_owned();
              candidate = suffix.replace(&candidate, "").into_owned();
              let candidate = candidate.trim_matches([':', '：', '，', ',', '·']).to_owned();
              if is_bare_teacher_name(&candidate) {
                  Some(candidate)
              } else if compact.chars().count() <= 12 {
                  Some(compact)
              } else {
                  None
              }
          }

          fn bare_teacher_from_text(value: &str, course_name: &str) -> Option<String> {
              let candidate = compact_text(value)
                  .trim_matches([':', '：', '，', ',', '·'])
                  .to_owned();
              (candidate != course_name && is_bare_teacher_name(&candidate)).then_some(candidate)
          }

          fn is_bare_teacher_name(value: &str) -> bool {
              let count = value.chars().count();
              (2..=4).contains(&count)
                  && value.chars().all(|character| ('\\u{4e00}'..='\\u{9fff}').contains(&character))
                  && !matches!(value, "未识别" | "待确认" | "未知教师" | "暂无教师")
                  && !is_common_header(value)
                  && !is_location_text(value)
                  && !looks_like_schedule_metadata(value)
          }

          fn find_location_fragment<'a>(
          ''',
          )
          replace(
              'src-tauri/src/native_ocr/metadata.rs',
              '        r"^(?:(?:周|星期)[一二三四五六日天])?',
              '        r"^(?:(?:周|星期)[一二三四五六日天1-7])?',
          )
          replace(
              'src-tauri/src/native_ocr/metadata.rs',
              '''    let character_count = candidate.chars().count();
          ''',
              '''    candidate = normalize_trailing_course_code(&candidate);

              let character_count = candidate.chars().count();
          ''',
          )
          replace(
              'src-tauri/src/native_ocr/metadata.rs',
              '''fn course_name_from_text(value: &str) -> Option<String> {
          ''',
              '''fn normalize_trailing_course_code(value: &str) -> String {
              let pattern = Regex::new(r"^(.*[\\u{4e00}-\\u{9fff}].*?)[|丨Il](\\d{2})[\\]|丨Il]?$" ).unwrap();
              let Some(captures) = pattern.captures(value) else {
                  return value.to_owned();
              };
              let base = captures.get(1).map(|value| value.as_str().trim()).unwrap_or_default();
              let code = captures.get(2).map(|value| value.as_str()).unwrap_or_default();
              if base.is_empty() || code.is_empty() {
                  value.to_owned()
              } else {
                  format!("{base}[{code}]")
              }
          }

          fn course_name_from_text(value: &str) -> Option<String> {
          ''',
          )

          replace(
              'src-tauri/src/native_ocr/courses.rs',
              '    let teacher = find_fragment(candidates.clone(), is_teacher_text);',
              '    let teacher = find_teacher_fragment(candidates.clone(), name_token, &name);',
          )

          replace(
              'src-tauri/src/native_ocr/support.rs',
              '''        '一' => Some(1),
                  '二' => Some(2),
                  '三' => Some(3),
                  '四' => Some(4),
                  '五' => Some(5),
                  '六' => Some(6),
                  '日' | '天' => Some(7),''',
              '''        '一' | '1' => Some(1),
                  '二' | '2' => Some(2),
                  '三' | '3' => Some(3),
                  '四' | '4' => Some(4),
                  '五' | '5' => Some(5),
                  '六' | '6' => Some(6),
                  '日' | '天' | '7' => Some(7),''',
          )

          replace(
              'src-tauri/src/native_ocr/tests.rs',
              '''    #[test]
              fn extracts_course_from_native_tokens() {''',
              '''    #[test]
              fn parses_dense_numeric_weekday_cards_and_plain_teacher_names() {
                  let tokens = vec![
                      token("星期一", 190.0, 40.0),
                      token("星期二", 390.0, 40.0),
                      token("星期三", 590.0, 40.0),
                      token(
                          "通信与网络|03\\n李启豪\\n3-8周,星期1,第1节--第2节\\n南湖-第1教学楼-四阶",
                          130.0,
                          110.0,
                      ),
                      token(
                          "通信与网络|03\\n顾海军\\n9-14周,星期1,第1节--第2节\\n南湖-第1教学楼-四阶",
                          130.0,
                          210.0,
                      ),
                  ];
                  let headers = weekday_headers(&tokens);
                  let anchors = course_anchors(&tokens);
                  let (courses, warnings) = anchor_courses(&tokens, &anchors, &headers, 800, 600);
                  assert!(warnings.is_empty());
                  assert_eq!(anchors.len(), 2);
                  assert_eq!(courses.len(), 2);
                  assert_eq!(courses[0].name, "通信与网络[03]");
                  assert_eq!(courses[0].teacher.as_deref(), Some("李启豪"));
                  assert_eq!(courses[0].start_section, 1);
                  assert_eq!(courses[0].end_section, 2);
                  assert_eq!(courses[0].weeks, (3..=8).collect::<Vec<_>>());
                  assert_eq!(courses[1].teacher.as_deref(), Some("顾海军"));
                  assert_eq!(courses[1].weeks, (9..=14).collect::<Vec<_>>());
              }

              #[test]
              fn recognizes_two_character_plain_teacher_names() {
                  assert_eq!(bare_teacher_from_text("刘聪", "单片机原理及其应用[04]").as_deref(), Some("刘聪"));
                  assert_eq!(bare_teacher_from_text("孙吉", "现场总线技术[03]").as_deref(), Some("孙吉"));
                  assert_eq!(bare_teacher_from_text("信息论", "信息论").as_deref(), None);
              }

              #[test]
              fn extracts_course_from_native_tokens() {''',
          )

          replace(
              'src/screenshot-import-controller.ts',
              "const importDescription = '选择 Excel 或完整单张课表截图，识别结果会进入同一套复核流程；已有课表不会被覆盖。'\n",
              '',
          )
          replace(
              'src/screenshot-import-controller.ts',
              '''  if (introCopy && introCopy.textContent !== importDescription) introCopy.textContent = importDescription
          ''',
              '''  introCopy?.remove()
          ''',
          )
          old_picker = '''  screenshotPicker.innerHTML = `
              <strong>${selectionPending
                ? '正在选择课表截图'
                : recognitionPending
                  ? `正在识别课表 · ${elapsedSeconds} 秒`
                  : '选择 PNG / JPG 课表截图'}</strong>
              <span>${selectionPending
                ? '选择完成后才开始计算识别时间'
                : recognitionPending
                  ? '正在读取图片、识别文字并整理课程；完成前其他操作已锁定'
                  : desktopRuntime
                    ? '请使用完整单张截图，包含星期标题、节次和全部课程；暂不支持多图拼接'
                    : '浏览器预览中不会读取本机图片'}</span>
            `'''
          new_picker = '''  screenshotPicker.innerHTML = `
              <strong>${selectionPending
                ? '正在选择课表截图'
                : recognitionPending
                  ? `正在识别课表 · ${elapsedSeconds} 秒`
                  : '选择课表截图'}</strong>
            `'''
          replace('src/screenshot-import-controller.ts', old_picker, new_picker)
          replace(
              'src/screenshot-import-controller.ts',
              '''    setMessage(currentSurface, `正在本机识别并整理课程，已用时 ${elapsedSeconds} 秒…`)
          ''',
              '',
          )
          replace(
              'src/screenshot-import-controller.ts',
              '''      <p>${escapeHtml(draft.sourceName)} 已在本机完成识别。请先核对课程数量和摘要；可以随时放弃本次结果并重新选择图片。</p>
          ''',
              '',
          )
          replace(
              'src/screenshot-import-controller.ts',
              '''      <div><h3>逐项检查</h3><p>先浏览课程摘要；整体无误可一次确认全部，只有异常项需要展开修改。</p></div>
          ''',
              '''      <div><h3>逐项检查</h3></div>
          ''',
          )
          replace(
              'src/screenshot-import-controller.ts',
              '''  surface.querySelectorAll('.import-evidence-copy').forEach((element) => element.remove())
          ''',
              '''  surface
                .querySelectorAll('.import-evidence-copy, .surface-intro p, .import-review-heading p')
                .forEach((element) => element.remove())
          ''',
          )

          replace(
              'scripts/screenshot-import-dom.test.ts',
              '''  assert(
              screenshotPickers[0].textContent?.includes('完整单张截图'),
              'screenshot picker should explain that one complete image is required',
            )
            assert(
              screenshotPickers[0].textContent?.includes('暂不支持多图拼接'),
              'screenshot picker should state the current multi-image limitation',
            )
          ''',
              '''  assert(screenshotPickers[0].querySelector('span') === null, 'screenshot picker should not show secondary helper copy')
            assert(screenshotPickers[0].textContent?.trim() === '选择课表截图', 'screenshot picker should use one direct action label')
          ''',
          )
          replace(
              'scripts/screenshot-import-dom.test.ts',
              '''  assert(!picker.textContent?.includes('秒'), 'file selection time must not count as OCR time')
          ''',
              '''  assert(!picker.textContent?.includes('秒'), 'file selection time must not count as OCR time')
            assert(picker.querySelector('span') === null, 'file selection should not expose implementation helper copy')
          ''',
          )
          replace(
              'scripts/screenshot-import-dom.test.ts',
              '''  assert(document.body.textContent?.includes('老师：未识别'), 'collapsed summary should expose missing optional teacher before bulk confirmation')
          ''',
              '''  assert(document.body.textContent?.includes('老师：李启豪'), 'collapsed summary should expose recognized teacher before bulk confirmation')
            assert(document.querySelector('.surface-intro p') === null, 'image review should not show redundant intro copy')
            assert(document.querySelector('.import-review-heading p') === null, 'image review should not show redundant review instructions')
          ''',
          )
          replace(
              'scripts/screenshot-import-dom.test.html',
              "                teacher: '',\n",
              "                teacher: '李启豪',\n",
          )
          replace(
              'scripts/screenshot-import-dom.test.html',
              "                    { field: 'teacher', status: 'missing', reason: '截图 OCR 字段需人工确认' },\n",
              "                    { field: 'teacher', status: 'review', reason: '截图 OCR 字段需人工确认' },\n",
          )
          PY

          rm .github/workflows/apply-ocr-dense-timetable-followup.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: recover dense timetable anchors and teachers"
          git push origin HEAD:spike/rust-native-ocr
