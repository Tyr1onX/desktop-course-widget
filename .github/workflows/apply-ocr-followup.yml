name: Apply OCR follow-up

on:
  push:
    branches:
      - spike/rust-native-ocr
    paths:
      - '.github/workflows/apply-ocr-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/rust-native-ocr

      - name: Apply focused follow-up patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src-tauri/src/lib.rs',
              '''#[tauri::command]
          async fn choose_and_parse_screenshot(
              app: AppHandle,
          ) -> Result<Option<import_draft::ImportDraft>, String> {
              let selected = app
                  .dialog()
                  .file()
                  .add_filter("课表截图", &["png", "jpg", "jpeg"])
                  .blocking_pick_file();

              let Some(selected) = selected else {
                  return Ok(None);
              };

              let path = selected
                  .into_path()
                  .map_err(|_| "无法读取所选课表截图路径".to_owned())?;
              let recognition_app = app.clone();
              let draft = tauri::async_runtime::spawn_blocking(move || {
                  screenshot_import::recognize_screenshot(&recognition_app, &path)
              })
              .await
              .map_err(|error| format!("截图识别任务异常结束：{error}"))??;
              Ok(Some(draft))
          }
          ''',
              '''#[tauri::command]
          fn choose_screenshot(app: AppHandle) -> Result<Option<String>, String> {
              let selected = app
                  .dialog()
                  .file()
                  .add_filter("课表截图", &["png", "jpg", "jpeg"])
                  .blocking_pick_file();

              let Some(selected) = selected else {
                  return Ok(None);
              };

              let path = selected
                  .into_path()
                  .map_err(|_| "无法读取所选课表截图路径".to_owned())?;
              Ok(Some(path.to_string_lossy().into_owned()))
          }

          #[tauri::command]
          async fn parse_screenshot(
              app: AppHandle,
              path: String,
          ) -> Result<import_draft::ImportDraft, String> {
              let path = PathBuf::from(path);
              let recognition_app = app.clone();
              tauri::async_runtime::spawn_blocking(move || {
                  screenshot_import::recognize_screenshot(&recognition_app, &path)
              })
              .await
              .map_err(|error| format!("截图识别任务异常结束：{error}"))?
          }
          ''',
          )
          replace(
              'src-tauri/src/lib.rs',
              '''            choose_and_parse_excel,
                      choose_and_parse_screenshot,
                      apply_imported_schedule,''',
              '''            choose_and_parse_excel,
                      choose_screenshot,
                      parse_screenshot,
                      apply_imported_schedule,''',
          )

          replace(
              'scripts/screenshot-import-dom.test.html',
              '''          if (command === 'choose_and_parse_screenshot') {
                      await new Promise((resolve) => setTimeout(resolve, 80))''',
              '''          if (command === 'choose_screenshot') {
                      await new Promise((resolve) => setTimeout(resolve, 80))
                      return 'C:\\\\课表 测试.png'
                    }
                    if (command === 'parse_screenshot') {
                      await new Promise((resolve) => setTimeout(resolve, 120))''',
          )

          replace(
              'scripts/screenshot-import-dom.test.ts',
              '''  picker.click()
            assert(document.documentElement.classList.contains('screenshot-import-busy'), 'recognition should lock the complete settings surface')
            assert(picker.disabled, 'screenshot picker must be disabled while OCR is running')
            assert(excelPicker.disabled, 'Excel picker must be disabled while OCR is running')
            assert(unrelatedControl.disabled, 'controls outside the import card must be disabled while OCR is running')
            assert(picker.textContent?.includes('正在识别课表'), 'busy picker should state the current recognition task')
            assert(picker.textContent?.includes('秒'), 'busy picker should show real elapsed time instead of fake progress')
            assert(!picker.textContent?.includes('%'), 'busy picker must not show a fake percentage')
            picker.click()
          ''',
              '''  picker.click()
            assert(picker.textContent?.includes('正在选择课表截图'), 'file selection should have a distinct state')
            assert(!picker.textContent?.includes('秒'), 'file selection time must not count as OCR time')
            picker.click()
            await waitFor(
              () => document.documentElement.classList.contains('screenshot-import-busy'),
              'recognition should start only after a file path is returned',
            )
            assert(picker.disabled, 'screenshot picker must be disabled while OCR is running')
            assert(excelPicker.disabled, 'Excel picker must be disabled while OCR is running')
            assert(unrelatedControl.disabled, 'controls outside the import card must be disabled while OCR is running')
            assert(/正在识别课表 · \\d+ 秒/.test(picker.textContent ?? ''), 'busy picker should show whole elapsed seconds')
            assert(!picker.textContent?.includes('.'), 'busy picker should update in whole-second steps')
            assert(!picker.textContent?.includes('%'), 'busy picker must not show a fake percentage')
          ''',
          )
          replace(
              'scripts/screenshot-import-dom.test.ts',
              '''  const recognizeCalls = window.__screenshotImportCommands.filter((command) => command === 'choose_and_parse_screenshot')
            assert(recognizeCalls.length === 1, 'rapid duplicate clicks must start only one recognizer')''',
              '''  const chooseCalls = window.__screenshotImportCommands.filter((command) => command === 'choose_screenshot')
            const parseCalls = window.__screenshotImportCommands.filter((command) => command === 'parse_screenshot')
            assert(chooseCalls.length === 1, 'rapid duplicate clicks must open only one file picker')
            assert(parseCalls.length === 1, 'one selected image must start only one recognizer')''',
          )

          replace(
              'src-tauri/src/native_ocr/courses.rs',
              '    let location = find_fragment(candidates, is_location_text);',
              '    let location = find_location_fragment(candidates);',
          )

          metadata_marker = '''fn find_course_name<'a>(
          '''
          metadata_insert = '''fn find_location_fragment<'a>(
              tokens: impl IntoIterator<Item = &'a Token>,
          ) -> Option<(&'a Token, String)> {
              for token in tokens {
                  for value in token.parts.iter().chain(std::iter::once(&token.text)) {
                      if let Some(location) = location_from_text(value) {
                          return Some((token, location));
                      }
                  }
              }
              None
          }

          fn location_from_text(value: &str) -> Option<String> {
              let compact = compact_text(value);
              if !is_location_text(&compact) {
                  return None;
              }

              let label = Regex::new(r"^地点[:：]?").unwrap();
              let leading_metadata = Regex::new(
                  r"^(?:(?:周|星期)[一二三四五六日天])?(?:(?:第?\\d{1,2}节(?:[-—~至]第?\\d{1,2}节)?)|(?:第?\\d{1,2}(?:[-—~至]第?\\d{1,2})?节)|节)?(?:\\d{1,2}(?:[-—~至]\\d{1,2})?周(?:[（(][单双][)）])?)?[，,、;；:：·|\\-]*",
              )
              .unwrap();
              let mut candidate = label.replace(&compact, "").into_owned();
              candidate = leading_metadata.replace(&candidate, "").into_owned();

              if let Some(index) = ["老师", "教师", "教授"]
                  .iter()
                  .filter_map(|marker| candidate.find(marker))
                  .min()
              {
                  candidate.truncate(index);
              }
              let candidate = candidate
                  .trim_matches(|character: char| {
                      character.is_ascii_punctuation()
                          || matches!(character, '，' | '。' | '：' | '；' | '、' | '·' | '（' | '）')
                  })
                  .to_owned();
              (!candidate.is_empty() && is_location_text(&candidate)).then_some(candidate)
          }

          fn find_course_name<'a>(
          '''
          replace('src-tauri/src/native_ocr/metadata.rs', metadata_marker, metadata_insert)

          replace(
              'src-tauri/src/native_ocr/tests.rs',
              '''    #[test]
              fn extracts_course_from_native_tokens() {''',
              '''    #[test]
              fn removes_schedule_metadata_from_locations() {
                  assert_eq!(
                      location_from_text("地点：节，南湖-第1教学楼-七阶").as_deref(),
                      Some("南湖-第1教学楼-七阶")
                  );
                  assert_eq!(
                      location_from_text("第3节-第4节，南湖-第1教学楼-四阶·老师").as_deref(),
                      Some("南湖-第1教学楼-四阶")
                  );
              }

              #[test]
              fn extracts_course_from_native_tokens() {''',
          )
          PY

          rm .github/workflows/apply-ocr-followup.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: separate screenshot selection and clean locations"
          git push origin HEAD:spike/rust-native-ocr
