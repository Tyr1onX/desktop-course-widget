    let mut anchors = tokens
        .iter()
        .enumerate()
        .filter_map(|(token_index, token)| {
            let metadata_text = schedule_text_for_anchor(tokens, token_index);
            let weekday = weekday_from_schedule_text(&metadata_text)?;
