name: Apply real OCR oneDNN fix

on:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/apply-real-ocr-onednn-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screenshot-recognition-spike

      - name: Apply targeted adapter and benchmark fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ocr_path = Path('experiments/screenshot_import/ocr.py')
          ocr = ocr_path.read_text(encoding='utf-8')
          replacements = [
              ('import json\nimport time', 'import json\nimport os\nimport time'),
              (
                  '    def __init__(self, *, language: str = "ch", device: str = "cpu"):\n        try:\n            from paddleocr import PaddleOCR',
                  '    def __init__(self, *, language: str = "ch", device: str = "cpu"):\n        # PaddlePaddle 3.3.x has a known PIR/oneDNN CPU inference regression.\n        # Keep the locked versions and explicitly select the standard CPU kernels.\n        os.environ.setdefault("FLAGS_use_mkldnn", "0")\n        try:\n            from paddleocr import PaddleOCR',
              ),
              (
                  '            "device": device,\n        }',
                  '            "device": device,\n            "enable_mkldnn": False,\n        }',
              ),
              (
                  '            "device": self._device,\n        }',
                  '            "device": self._device,\n            "mkldnn": "disabled",\n        }',
              ),
          ]
          for old, new in replacements:
              if old not in ocr:
                  raise SystemExit(f'missing ocr replacement anchor: {old!r}')
              ocr = ocr.replace(old, new, 1)
          ocr_path.write_text(ocr, encoding='utf-8')

          test_path = Path('experiments/screenshot_import/tests/test_paddle_ocr.py')
          test = test_path.read_text(encoding='utf-8')
          if 'import os\n' not in test:
              test = test.replace('import json\n', 'import json\nimport os\n', 1)
          addition = '''\n\ndef test_windows_cpu_backend_disables_mkldnn(monkeypatch):\n    engine = _engine(monkeypatch, _payload())\n    assert engine._ocr.kwargs["enable_mkldnn"] is False\n    assert os.environ["FLAGS_use_mkldnn"] == "0"\n    assert engine.version_info()["mkldnn"] == "disabled"\n'''
          if 'test_windows_cpu_backend_disables_mkldnn' not in test:
              test += addition
          test_path.write_text(test, encoding='utf-8')

          workflow_path = Path('.github/workflows/real-ocr-benchmark.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '          PADDLE_PDX_MODEL_SOURCE: BOS\n',
              '          PADDLE_PDX_MODEL_SOURCE: BOS\n          FLAGS_use_mkldnn: "0"\n',
          )
          if '# Adapter explicitly disables oneDNN for PaddlePaddle 3.3.x.' not in workflow:
              workflow += '\n# Adapter explicitly disables oneDNN for PaddlePaddle 3.3.x.\n'
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/screenshot_import/ocr.py \
            experiments/screenshot_import/tests/test_paddle_ocr.py \
            .github/workflows/real-ocr-benchmark.yml
          git commit -m "fix: disable oneDNN for real OCR benchmark [real-ocr-benchmark]"
          git push origin HEAD:feat/screenshot-recognition-spike
