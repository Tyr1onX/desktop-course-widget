name: Apply screenshot reset flow

on:
  push:
    branches:
      - feat/screenshot-import-vertical-slice
    paths:
      - .github/screenshot-reset-flow-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Tyr1onX/desktop-course-widget'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screenshot-import-vertical-slice
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply page-local reset flow
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          review_path = Path('src/import-review-controller.ts')
          review = review_path.read_text(encoding='utf-8')
          anchor = '''export function rememberImportDraft(draft: ImportDraft): void {
            if (activeDraft !== draft) {
              filter = 'all'
              expandedCourseIndex = draft.source === 'image' ? -1 : 0
              activeLessonSections = []
            }
            activeDraft = draft
            queueEnhancement()
          }
          '''
          replacement = anchor + '''
          export function forgetImportDraft(): void {
            activeDraft = null
            filter = 'all'
            expandedCourseIndex = -1
            activeLessonSections = []
          }
          '''
          if anchor not in review:
              raise SystemExit('rememberImportDraft anchor not found')
          review_path.write_text(review.replace(anchor, replacement, 1), encoding='utf-8')

          controller_path = Path('src/screenshot-import-controller.ts')
          controller = controller_path.read_text(encoding='utf-8')
          controller = controller.replace(
              "import { rememberImportDraft } from './import-review-controller'",
              "import { forgetImportDraft, rememberImportDraft } from './import-review-controller'",
              1,
          )
          controller = controller.replace("const reopenImportKey = 'screenshot-import:reopen-after-reset'\n", '', 1)
          controller = controller.replace('restoreImportSurfaceAfterReset()\n', '', 1)
          restore_start = controller.index('function restoreImportSurfaceAfterReset(')
          restore_end = controller.index('\nfunction enhanceImportSurface()', restore_start)
          controller = controller[:restore_start] + controller[restore_end + 1:]
          old_reset = '''function resetScreenshotImport(): void {
            if (!window.confirm('放弃当前识别结果并重新选择图片？')) return
            activeDraft = null
            activeSettings = null
            importName = ''
            firstWeekMonday = ''
            recognitionPending = false
            createPending = false
            requestId = ''
            sessionStorage.setItem(reopenImportKey, 'true')
            window.location.reload()
          }
          '''
          new_reset = '''function resetScreenshotImport(): void {
            if (!window.confirm('放弃当前识别结果并重新选择图片？')) return
            activeDraft = null
            activeSettings = null
            importName = ''
            firstWeekMonday = ''
            recognitionPending = false
            createPending = false
            requestId = ''
            forgetImportDraft()
            window.dispatchEvent(new CustomEvent('screenshot-import:reset'))
          }
          '''
          if old_reset not in controller:
              raise SystemExit('resetScreenshotImport anchor not found')
          controller_path.write_text(controller.replace(old_reset, new_reset, 1), encoding='utf-8')

          settings_path = Path('src/settings.ts')
          settings = settings_path.read_text(encoding='utf-8')
          keyboard_anchor = "window.addEventListener('keydown', (event) => {"
          reset_listener = '''window.addEventListener('screenshot-import:reset', () => {
            importDraft = null
            importNameDraft = ''
            importFirstWeekDraft = ''
            expandedImportCourseIndex = 0
            importRequestId = ''
            importCreatePending = false
            surfaceMessage = ''
            surface = 'import'
            render()
          })

          '''
          if keyboard_anchor not in settings:
              raise SystemExit('settings keyboard anchor not found')
          settings_path.write_text(settings.replace(keyboard_anchor, reset_listener + keyboard_anchor, 1), encoding='utf-8')

          test_path = Path('scripts/screenshot-import-dom.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test_anchor = "  assert(document.querySelector('.surface-message')?.textContent?.includes('可以创建课表'), 'bulk confirmation should explain the next action')\n"
          test_insert = test_anchor + '''

            const createCallsBeforeReset = window.__screenshotImportCommands
              .filter((command) => command.includes('create_schedule_from_import')).length
            window.confirm = () => true
            resetButton.click()
            await waitFor(
              () => document.querySelectorAll('[data-action="choose-screenshot"]').length === 1,
              'restart should return to the file picker without reloading the page',
            )
            assert(document.querySelector('.import-review-toolbar') === null, 'restart should discard the old review UI')
            assert(!document.body.textContent?.includes('通信原理'), 'restart should discard the old recognized draft')
            assert(
              document.querySelector('[data-action="choose-screenshot"]')?.textContent?.includes('完整单张截图'),
              'restart should return to the guided screenshot picker',
            )
            const createCallsAfterReset = window.__screenshotImportCommands
              .filter((command) => command.includes('create_schedule_from_import')).length
            assert(createCallsAfterReset === createCallsBeforeReset, 'restart must not create a schedule')
          '''
          if test_anchor not in test:
              raise SystemExit('screenshot DOM test anchor not found')
          test_path.write_text(test.replace(test_anchor, test_insert, 1), encoding='utf-8')
          '@ | python -

      - name: Install dependencies
        run: npm ci

      - name: Check screenshot import DOM flow
        run: npm run check:screenshot-import-dom

      - name: Check import review DOM flow
        run: npm run check:import-review-dom

      - name: Commit patch and remove temporary trigger
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/screenshot-reset-flow-trigger .github/workflows/apply-screenshot-reset-flow.yml
          git add src/import-review-controller.ts src/screenshot-import-controller.ts src/settings.ts scripts/screenshot-import-dom.test.ts
          git commit -m "fix: return screenshot import to file selection"
          git push origin HEAD:feat/screenshot-import-vertical-slice
