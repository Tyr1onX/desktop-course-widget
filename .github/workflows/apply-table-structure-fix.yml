name: Apply table structure parser patch

on:
  push:
    branches:
      - fix/weekday-header-row-detection
    paths:
      - scripts/apply_table_structure_fix.py
      - scripts/fix_apply_table_structure_script.py
      - .github/workflows/apply-table-structure-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/weekday-header-row-detection
          fetch-depth: 0

      - name: Correct patch target file
        run: python scripts/fix_apply_table_structure_script.py

      - name: Apply parser patch
        run: python scripts/apply_table_structure_fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/native_ocr.rs \
            src-tauri/src/native_ocr/runtime.rs \
            src-tauri/src/native_ocr/grid.rs \
            src-tauri/src/native_ocr/courses.rs \
            src-tauri/src/native_ocr/metadata.rs \
            src-tauri/src/native_ocr/support.rs \
            src-tauri/src/native_ocr/table_structure_tests.rs
          git diff --cached --check
          git commit -m "fix: parse traditional timetable structure"
          git push origin HEAD:fix/weekday-header-row-detection
