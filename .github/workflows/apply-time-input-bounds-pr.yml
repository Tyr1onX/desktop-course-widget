name: Apply time input bounds on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/time-input-bounds' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/time-input-bounds
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          set +e
          python3 scripts/apply-time-input-bounds.py > patch-error.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add patch-error.txt
            git commit -m "chore: capture time bounds patch failure"
            git push origin HEAD:fix/time-input-bounds
            exit "$status"
          fi
          rm -f patch-error.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Check time-flow model
        run: npm run check:time-flow
      - name: Build web interface
        run: npm run web:build
      - name: Select stable Rust
        run: rustup default stable
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/main.ts src/settings.ts src-tauri/src/app_settings.rs patch-error.txt
          git commit -m "fix: enforce time input bounds"
          git push origin HEAD:fix/time-input-bounds
