name: Apply corrected traditional grid parser v2

on:
  push:
    branches:
      - fix/weekday-header-row-detection
    paths:
      - .github/workflows/apply-traditional-grid-v2-corrected.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/weekday-header-row-detection
          fetch-depth: 0

      - name: Apply parser patch
        run: python scripts/apply_traditional_grid_v2.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust parser
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Commit parser changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/native_ocr/runtime.rs \
            src-tauri/src/native_ocr/support.rs \
            src-tauri/src/native_ocr/grid.rs \
            src-tauri/src/native_ocr/metadata.rs \
            src-tauri/src/native_ocr/courses.rs \
            src-tauri/src/native_ocr/traditional_fields.rs \
            src-tauri/src/native_ocr/tests.rs \
            src-tauri/src/native_ocr/table_structure_tests.rs
          git diff --cached --check
          git commit -m "fix: parse merged traditional timetable cells"
          git push origin HEAD:fix/weekday-header-row-detection
