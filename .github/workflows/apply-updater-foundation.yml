name: Apply updater foundation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed implementation
        id: state
        shell: pwsh
        run: |
          if (Test-Path src/updater-ui.ts) {
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Node
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        if: steps.state.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install updater dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm install @tauri-apps/plugin-updater@^2.10.1 @tauri-apps/plugin-process@^2

      - name: Apply updater implementation
        if: steps.state.outputs.skip != 'true'
        run: python scripts/apply-updater-foundation.py

      - name: Refresh Rust lockfile
        if: steps.state.outputs.skip != 'true'
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Normalize generated text
        if: steps.state.outputs.skip != 'true'
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRTUXB'],
              text=True,
              encoding='utf-8',
          ).splitlines()
          binary_suffixes = {
              '.ico', '.png', '.jpg', '.jpeg', '.gif', '.webp', '.zip', '.exe',
              '.dll', '.pdb', '.woff', '.woff2', '.ttf', '.otf', '.xlsx', '.pdf',
          }
          for raw in changed:
              path = Path(raw)
              if not path.is_file() or path.suffix.lower() in binary_suffixes:
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8-sig')
              except UnicodeDecodeError:
                  continue
              normalized = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              path.write_text(normalized, encoding='utf-8', newline='\n')

      - name: Validate web build
        if: steps.state.outputs.skip != 'true'
        run: npm run web:build

      - name: Validate Rust tests
        if: steps.state.outputs.skip != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check diff
        if: steps.state.outputs.skip != 'true'
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Commit generated implementation
        if: steps.state.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json settings.html src src-tauri docs/UPDATER_SETUP.md
          git commit -m "feat: add signed in-app update flow"
          git push origin HEAD:${{ github.head_ref }}
