name: Apply weekday header row fix

on:
  push:
    branches:
      - fix/weekday-header-row-detection
    paths:
      - .github/workflows/apply-weekday-header-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/weekday-header-row-detection
          fetch-depth: 0

      - name: Apply parser fix and regression tests
        shell: pwsh
        run: |
          $gridPath = 'src-tauri/src/native_ocr/grid.rs'
          $grid = (Get-Content $gridPath -Raw).Replace("`r`n", "`n")
          $pattern = '(?s)fn weekday_headers\(tokens: &\[Token\]\) -> Vec<WeekdayHeader> \{.*?\n\}\n\nfn section_markers'
          $replacement = @'
          fn weekday_headers(tokens: &[Token]) -> Vec<WeekdayHeader> {
              #[derive(Clone)]
              struct Candidate {
                  header: WeekdayHeader,
                  center_y: f32,
                  height: f32,
              }

              let mut candidates = tokens
                  .iter()
                  .filter_map(|token| {
                      weekday_from_text(&token.text).map(|weekday| Candidate {
                          header: WeekdayHeader {
                              weekday,
                              center_x: token.center_x(),
                              bottom: token.bottom(),
                          },
                          center_y: token.center_y(),
                          height: token.height.max(1.0),
                      })
                  })
                  .collect::<Vec<_>>();

              // OCR may return `星期` and the final weekday character as separate boxes.
              for (prefix_index, prefix) in tokens.iter().enumerate() {
                  let prefix_text = compact_text(&prefix.text);
                  if prefix_text != "星期" && prefix_text != "周" {
                      continue;
                  }
                  for (suffix_index, suffix) in tokens.iter().enumerate() {
                      if prefix_index == suffix_index {
                          continue;
                      }
                      let suffix_text = compact_text(&suffix.text);
                      if suffix_text.chars().count() != 1 {
                          continue;
                      }
                      let Some(weekday) = suffix_text.chars().next().and_then(weekday_character) else {
                          continue;
                      };
                      let height = prefix.height.max(suffix.height).max(1.0);
                      if (prefix.center_y() - suffix.center_y()).abs() > height * 0.8 + 4.0 {
                          continue;
                      }
                      let horizontal_gap = suffix.left - prefix.right();
                      if horizontal_gap < -height * 0.25 || horizontal_gap > height * 1.8 + 8.0 {
                          continue;
                      }
                      let left = prefix.left.min(suffix.left);
                      let right = prefix.right().max(suffix.right());
                      let top = prefix.top.min(suffix.top);
                      let bottom = prefix.bottom().max(suffix.bottom());
                      candidates.push(Candidate {
                          header: WeekdayHeader {
                              weekday,
                              center_x: (left + right) / 2.0,
                              bottom,
                          },
                          center_y: (top + bottom) / 2.0,
                          height: (bottom - top).max(1.0),
                      });
                  }
              }

              let mut best_headers = Vec::new();
              let mut best_is_monotonic = false;
              let mut best_center_y = f32::MAX;
              let mut best_span = 0.0_f32;

              for seed in &candidates {
                  let mut by_weekday: [Option<&Candidate>; 7] = std::array::from_fn(|_| None);
                  for candidate in &candidates {
                      let tolerance = seed.height.max(candidate.height) * 1.35 + 6.0;
                      if (seed.center_y - candidate.center_y).abs() > tolerance {
                          continue;
                      }
                      let slot = &mut by_weekday[(candidate.header.weekday - 1) as usize];
                      let candidate_distance = (candidate.center_y - seed.center_y).abs();
                      let should_replace = slot.is_none_or(|existing| {
                          candidate_distance < (existing.center_y - seed.center_y).abs()
                      });
                      if should_replace {
                          *slot = Some(candidate);
                      }
                  }

                  let mut row = by_weekday
                      .into_iter()
                      .flatten()
                      .map(|candidate| candidate.header.clone())
                      .collect::<Vec<_>>();
                  row.sort_by(|left, right| {
                      left.center_x
                          .partial_cmp(&right.center_x)
                          .unwrap_or(Ordering::Equal)
                  });
                  let is_monotonic = row
                      .windows(2)
                      .all(|pair| pair[0].weekday < pair[1].weekday);
                  let span = row
                      .last()
                      .zip(row.first())
                      .map(|(last, first)| last.center_x - first.center_x)
                      .unwrap_or_default();

                  let is_better = row.len() > best_headers.len()
                      || (row.len() == best_headers.len()
                          && is_monotonic
                          && !best_is_monotonic)
                      || (row.len() == best_headers.len()
                          && is_monotonic == best_is_monotonic
                          && seed.center_y < best_center_y)
                      || (row.len() == best_headers.len()
                          && is_monotonic == best_is_monotonic
                          && (seed.center_y - best_center_y).abs() < 1.0
                          && span > best_span);
                  if is_better {
                      best_headers = row;
                      best_is_monotonic = is_monotonic;
                      best_center_y = seed.center_y;
                      best_span = span;
                  }
              }

              best_headers
          }

          fn section_markers
          '@
          $replacement = ($replacement -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $matches = [regex]::Matches($grid, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one weekday_headers function, found $($matches.Count)."
          }
          $grid = [regex]::Replace($grid, $pattern, $replacement, 1)
          [System.IO.File]::WriteAllText($gridPath, $grid, [System.Text.UTF8Encoding]::new($false))

          $testPath = 'src-tauri/src/native_ocr/weekday_header_tests.rs'
          $tests = @'
          #[cfg(test)]
          mod weekday_header_tests {
              use super::*;

              fn sized_token(
                  text: &str,
                  left: f32,
                  top: f32,
                  width: f32,
                  height: f32,
              ) -> Token {
                  Token::from_text(text, 0.98, left, top, width, height).unwrap()
              }

              #[test]
              fn finds_header_row_below_phone_chrome_and_student_metadata() {
                  let mut tokens = vec![
                      sized_token("19:36", 20.0, 10.0, 80.0, 32.0),
                      sized_token("正方教务管理系统", 100.0, 65.0, 300.0, 44.0),
                      sized_token("2025-2026学年第2学期学生个人课表", 120.0, 170.0, 420.0, 28.0),
                      sized_token("学号姓名学院专业", 40.0, 220.0, 360.0, 24.0),
                  ];
                  for (index, text) in ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"]
                      .into_iter()
                      .enumerate()
                  {
                      tokens.push(sized_token(text, 120.0 + index as f32 * 110.0, 320.0, 76.0, 24.0));
                  }
                  tokens.extend([
                      sized_token("周一", 150.0, 650.0, 48.0, 22.0),
                      sized_token("周二", 370.0, 650.0, 48.0, 22.0),
                      sized_token("周三", 590.0, 650.0, 48.0, 22.0),
                  ]);

                  let headers = weekday_headers(&tokens);
                  assert_eq!(headers.len(), 7);
                  assert_eq!(headers.iter().map(|header| header.weekday).collect::<Vec<_>>(), vec![1, 2, 3, 4, 5, 6, 7]);
                  assert!(headers.iter().all(|header| header.bottom < 360.0));
              }

              #[test]
              fn combines_split_weekday_header_boxes() {
                  let tokens = vec![
                      sized_token("页面标题", 20.0, 20.0, 180.0, 36.0),
                      sized_token("星期", 120.0, 280.0, 52.0, 24.0),
                      sized_token("一", 174.0, 280.0, 20.0, 24.0),
                      sized_token("星期", 320.0, 280.0, 52.0, 24.0),
                      sized_token("二", 374.0, 280.0, 20.0, 24.0),
                      sized_token("星期", 520.0, 280.0, 52.0, 24.0),
                      sized_token("三", 574.0, 280.0, 20.0, 24.0),
                  ];

                  let headers = weekday_headers(&tokens);
                  assert_eq!(headers.len(), 3);
                  assert_eq!(headers.iter().map(|header| header.weekday).collect::<Vec<_>>(), vec![1, 2, 3]);
              }
          }
          '@
          $tests = ($tests -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          [System.IO.File]::WriteAllText($testPath, $tests, [System.Text.UTF8Encoding]::new($false))

          $nativePath = 'src-tauri/src/native_ocr.rs'
          $native = (Get-Content $nativePath -Raw).Replace("`r`n", "`n")
          $needle = 'include!("native_ocr/tests.rs");'
          if (-not $native.Contains($needle)) { throw 'Native OCR test include was not found.' }
          $native = $native.Replace($needle, "$needle`ninclude!(\"native_ocr/weekday_header_tests.rs\");")
          [System.IO.File]::WriteAllText($nativePath, $native, [System.Text.UTF8Encoding]::new($false))

          $runtimePath = 'src-tauri/src/native_ocr/runtime.rs'
          $runtime = (Get-Content $runtimePath -Raw).Replace("`r`n", "`n")
          $runtime = $runtime.Replace('ocr-rs-mnn-ppocrv5-mobile-v2', 'ocr-rs-mnn-ppocrv5-mobile-v3')
          [System.IO.File]::WriteAllText($runtimePath, $runtime, [System.Text.UTF8Encoding]::new($false))

          $releasePath = '.github/workflows/release-build.yml'
          $release = (Get-Content $releasePath -Raw).Replace('COURSE_WIDGET_BUILD_VERSION: 0.5.0-beta.1', 'COURSE_WIDGET_BUILD_VERSION: 0.5.0-beta.2')
          [System.IO.File]::WriteAllText($releasePath, $release, [System.Text.UTF8Encoding]::new($false))

          Remove-Item '.github/workflows/apply-weekday-header-fix.yml' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/native_ocr/grid.rs src-tauri/src/native_ocr/runtime.rs src-tauri/src/native_ocr.rs src-tauri/src/native_ocr/weekday_header_tests.rs .github/workflows/release-build.yml .github/workflows/apply-weekday-header-fix.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix: detect weekday headers below page chrome'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/weekday-header-row-detection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
