name: Build PR 64 line-reveal NSIS installer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-nsis:
    if: github.event.pull_request.number == 64
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check line reveal handoff
        run: npm run check:presentation-clock

      - name: Check time-flow model
        run: npm run check:time-flow

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-line-reveal-${{ github.event.pull_request.head.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
