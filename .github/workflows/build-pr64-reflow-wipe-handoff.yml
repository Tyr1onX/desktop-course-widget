name: Build PR 64 reflow wipe handoff

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build-windows:
    if: github.event.pull_request.number == 64 && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out replay branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply reflow wipe handoff patch
        run: python scripts/patch-pr64-reflow-wipe-handoff.py

      - name: Install dependencies
        run: npm ci

      - name: Check presentation handoff
        run: npm run check:presentation-clock

      - name: Check time-flow model
        run: npm run check:time-flow

      - name: Build web interface
        run: npm run build

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Commit application changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/widget-page.ts src/widget-page.css scripts/check-presentation-clock.mjs
          git diff --cached --check
          git commit -m "fix: reflow shared course into final card"
          git push origin HEAD:feat/time-replay-demo

      - name: Upload NSIS test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-reflow-wipe-handoff
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
