name: Build PR 64 cleaned transition overlay

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build-windows:
    if: github.event.pull_request.number == 64 && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out replay branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Normalize current transition constants
        run: python scripts/fix-pr64-transition-overlay-input.py

      - name: Apply transition overlay cleanup
        run: python scripts/patch-pr64-transition-overlay-cleanup.py

      - name: Normalize wipe CSS
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/widget-page.css')
          css = path.read_text(encoding='utf-8')
          start = css.index('.course-final-wipe {')
          end = css.index('.is-course-transitioning', start)
          replacement = '''.course-final-wipe {
            position: absolute;
            z-index: 2;
            overflow: hidden;
            border-radius: 18px;
            pointer-events: none;
            transform-origin: center;
            will-change: transform, opacity;
          }

          .course-final-wipe::before {
            position: absolute;
            inset: -12% auto -12% -58%;
            width: 58%;
            border-radius: 42%;
            background: linear-gradient(
              90deg,
              rgba(255, 255, 255, 0),
              rgba(255, 255, 255, .16) 22%,
              rgba(255, 255, 255, .78) 49%,
              rgba(var(--identity-accent-rgb), .24) 61%,
              rgba(255, 255, 255, 0)
            );
            content: '';
            filter: blur(.6px);
            mix-blend-mode: screen;
            pointer-events: none;
          }

          '''
          path.write_text(css[:start] + replacement + css[end:], encoding='utf-8')
          '@ | python -

      - name: Install dependencies
        run: npm ci

      - name: Check presentation handoff
        run: npm run check:presentation-clock

      - name: Check time-flow model
        run: npm run check:time-flow

      - name: Build web interface
        run: npm run build

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Commit application cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/widget-page.ts src/widget-page.css scripts/check-presentation-clock.mjs
          git diff --cached --check
          git commit -m "refactor: simplify course transition overlay"
          git push origin HEAD:feat/time-replay-demo

      - name: Upload NSIS test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-transition-overlay-cleanup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
