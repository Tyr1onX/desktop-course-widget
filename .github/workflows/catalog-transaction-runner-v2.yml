name: Run catalog transaction patch v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: fix/catalog-transaction-safety
          fetch-depth: 0
      - name: Detect completed patch
        id: detect
        shell: bash
        run: |
          if [ -f src-tauri/src/data_transaction.rs ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply compressed focused patch
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import zlib
          payload = '';
          source = zlib.decompress(base64.b64decode(payload))
          exec(compile(source, '<catalog-transaction-patch>', 'exec'))
          PY
      - name: Format Rust changes
        if: steps.detect.outputs.changed == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Set up Node.js
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        if: steps.detect.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: npm ci
      - name: Run required checks
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock
          npm run web:build
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Commit focused fix
        if: steps.detect.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.ts src-tauri/src/app_settings.rs src-tauri/src/data_transaction.rs src-tauri/src/lib.rs src-tauri/src/schedule_apply.rs src-tauri/src/schedule_catalog.rs src-tauri/src/schedule_store.rs
          git commit -m "fix: make catalog mutations recoverable"
          git push origin HEAD:fix/catalog-transaction-safety
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows-nsis:
    needs: patch-and-check
    if: needs.patch-and-check.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch-and-check.outputs.commit_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Re-run required checks
        shell: pwsh
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock
          npm run web:build
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows NSIS installer
        run: npm run tauri:build
      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-catalog-transaction-safety
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
