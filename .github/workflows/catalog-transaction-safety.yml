name: Build catalog transaction safety

on:
  push:
    branches:
      - fix/catalog-transaction-safety

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.event.head_commit.message == 'ci: apply catalog transaction safety patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out transaction branch
        uses: actions/checkout@v4
        with:
          ref: fix/catalog-transaction-safety
          fetch-depth: 0

      - name: Apply focused data transaction patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          source = base64.b64decode(' iNbdGF1cmk6OmNvbW1hbmRdXG5mbiBnZXRfc2NoZWR1bGUoYXBwOiBBcHBIYW5kbGUsIHNjaGVkdWxlX2lkOiBTdHJpbmcpIC0+IFJlc3VsdDxDYXRhbG9nU2NoZWR1bGUsIFN0cmluZz4ge1xuICAgIGxldCBfZ3VhcmQgPSBjYXRhbG9nX2d1YXJkKCk/O1xuICAgIGxldCBpbmRleCA9IGVuc3VyZV9jYXRhbG9nKCZhcHApPztcbiAgICBpZiAhaW5kZXguc2NoZWR1bGVfaWRzLml0ZXIoKS5hbnko fGlkfCBpZCA9PSAmc2NoZWR1bGVfaWQpIHtcbiAgICAgICAgcmV0dXJuIEVycihcIuaJvuS4jeWIsOimgee8lui+keeahFwiLmludG8oKSk7XG4gICAgfVxuICAgIHJlYWRfY2F0YWxvZ19zY2hlZHVsZSgmYXBwLCAmc2NoZWR1bGVfaWQpXG59XG4nLCAnY2F0YWxvZyBnZXRfc2NoZWR1bGUnKQoK...TRUNCATED...')
          exec(compile(source, '<catalog-transaction-patch>', 'exec'))
          PY

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        shell: bash
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock
          npm run web:build
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit focused fix
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.ts src-tauri/src/app_settings.rs src-tauri/src/data_transaction.rs src-tauri/src/lib.rs src-tauri/src/schedule_apply.rs src-tauri/src/schedule_catalog.rs src-tauri/src/schedule_store.rs
          git commit -m "fix: make catalog mutations recoverable"
          git push origin HEAD:fix/catalog-transaction-safety
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows-nsis:
    needs: patch-and-check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch-and-check.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Re-run required checks
        shell: pwsh
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock
          npm run web:build
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-catalog-transaction-safety
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
