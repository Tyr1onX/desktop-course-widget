name: Cleanup Actions History

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove stale workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 30);

            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            for (const run of runs) {
              const created = new Date(run.created_at);
              const isRelease = run.event === 'release' || run.name?.toLowerCase().includes('release');

              if (created < cutoff && !isRelease) {
                core.info(`Deleting ${run.id}: ${run.name} (${run.created_at})`);
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              }
            }
