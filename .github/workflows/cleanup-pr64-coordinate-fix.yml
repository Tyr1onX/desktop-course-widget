name: Clean PR 64 coordinate-space tooling

on:
  push:
    branches:
      - feat/time-replay-demo

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message != 'chore: remove temporary PR 64 fix tooling' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Remove temporary fix tooling
        shell: bash
        run: |
          git rm \
            .github/workflows/cleanup-pr64-coordinate-fix.yml \
            .github/workflows/pr64-coordinate-space-fix.yml \
            .github/workflows/fix-pr64-patcher.yml \
            .github/workflows/fix-pr64-patcher-v2.yml \
            .github/workflows/pr64-coordinate-space-fix-v3.yml \
            .github/workflows/pr64-coordinate-space-fix-v4.yml \
            .github/workflows/pr64-coordinate-space-fix-v5.yml \
            .github/workflows/pr64-coordinate-space-fix-v6.yml \
            scripts/apply_pr64_coordinate_fix.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove temporary PR 64 fix tooling"
          git push origin HEAD:feat/time-replay-demo
