name: Close beta.5 branch edits v2 once

on:
  push:
    branches:
      - fix/v0.5.0-beta.5

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/v0.5.0-beta.5
          fetch-depth: 0
      - name: Apply closeout edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          path = 'scripts/generate-installer-template.mjs'
          text = read(path)
          old = """const restoreWithLegacy = [
            'Function RestorePreviousInstallLocation',
            '  StrCpy $LegacyBrandMigration 0',
            '  ReadRegStr $4 SHCTX \"${MANUPRODUCTKEY}\" \"\"',
            '  ${If} $4 != \"\"',
            '    StrCpy $INSTDIR $4',
            '    Return',
            '  ${EndIf}',
            '',
            '  ; Only migrate the exact historical identity used by this project.',
            '  ReadRegStr $5 SHCTX \"${LEGACY_UNINSTKEY}\" \"DisplayName\"',
            '  ${If} $5 != \"${LEGACY_PRODUCTNAME}\"',
            '    Return',
            '  ${EndIf}',
            '  ReadRegStr $4 SHCTX \"${LEGACY_UNINSTKEY}\" \"InstallLocation\"',
            '  ${If} $4 == \"\"',
            '    ReadRegStr $4 SHCTX \"${LEGACY_MANUPRODUCTKEY}\" \"\"',
            '  ${EndIf}',
            '  ${If} $4 != \"\"',
            '    StrCpy $INSTDIR $4',
            '    StrCpy $LegacyBrandMigration 1',
            '  ${EndIf}',
            'FunctionEnd',
          ].join('\\n')"""
          new = """const restoreWithLegacy = [
            'Function RestorePreviousInstallLocation',
            '  StrCpy $LegacyBrandMigration 0',
            '  ReadRegStr $4 SHCTX \"${MANUPRODUCTKEY}\" \"\"',
            '  ${If} $4 != \"\"',
            '    StrCpy $INSTDIR $4',
            '  ${EndIf}',
            '',
            '  ; Cleanup is keyed only by the exact historical product identity, even when 课刻 already exists.',
            '  ReadRegStr $5 SHCTX \"${LEGACY_UNINSTKEY}\" \"DisplayName\"',
            '  ${If} $5 == \"${LEGACY_PRODUCTNAME}\"',
            '    StrCpy $LegacyBrandMigration 1',
            '    ; Reuse the historical install root only when the current product has no saved location.',
            '    ${If} $4 == \"\"',
            '      ReadRegStr $4 SHCTX \"${LEGACY_UNINSTKEY}\" \"InstallLocation\"',
            '      ${If} $4 == \"\"',
            '        ReadRegStr $4 SHCTX \"${LEGACY_MANUPRODUCTKEY}\" \"\"',
            '      ${EndIf}',
            '      ${If} $4 != \"\"',
            '        StrCpy $INSTDIR $4',
            '      ${EndIf}',
            '    ${EndIf}',
            '  ${EndIf}',
            'FunctionEnd',
          ].join('\\n')"""
          text = once(text, old, new, 'restore migration')
          text = once(
              text,
              """  '    ReadRegStr $0 SHCTX \"${LEGACY_MANUPRODUCTKEY}\" \"\"',
            '    ${If} $0 == $INSTDIR',
            '      DeleteRegKey SHCTX \"${LEGACY_MANUPRODUCTKEY}\"',
            '    ${EndIf}',""",
              """  '    ReadRegStr $0 SHCTX \"${LEGACY_MANUPRODUCTKEY}\" \"\"',
            '    ${If} $0 != \"\"',
            '      DeleteRegKey SHCTX \"${LEGACY_MANUPRODUCTKEY}\"',
            '    ${EndIf}',""",
              'legacy product-key cleanup',
          )
          write(path, text)

          path = 'scripts/windows-release-upgrade-smoke.ps1'
          text = read(path)
          text = once(text,
              "  [string]$BaseSha256 = '8ac5d9e62bc492e0e80e3aad94c338c070b0cc349f0d11ec35c7f5a909980126',\n  [string]$LegacyProductName = ''\n)",
              "  [string]$BaseSha256 = '8ac5d9e62bc492e0e80e3aad94c338c070b0cc349f0d11ec35c7f5a909980126',\n  [string]$LegacyProductName = '',\n  [string]$ExpectedVersion = ''\n)",
              'upgrade ExpectedVersion param')
          text = once(text, "$expectedVersion = [string]$config.version",
              "$expectedVersion = if ([string]::IsNullOrWhiteSpace($ExpectedVersion)) { [string]$config.version } else { $ExpectedVersion }",
              'upgrade expected version assignment')
          marker = "function Enable-DeleteDataOption([IntPtr]$Handle, [int]$TimeoutSeconds = 12) {"
          helper = r'''function Seed-LegacyIdentityResidue([string]$Name, [string]$InstallRoot, [string]$MainExe, [string]$Uninstaller) {
            $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$Name"
            New-Item -Path $uninstallKey -Force | Out-Null
            New-ItemProperty -LiteralPath $uninstallKey -Name DisplayName -Value $Name -PropertyType String -Force | Out-Null
            New-ItemProperty -LiteralPath $uninstallKey -Name DisplayVersion -Value $baseVersion -PropertyType String -Force | Out-Null
            New-ItemProperty -LiteralPath $uninstallKey -Name Publisher -Value $publisher -PropertyType String -Force | Out-Null
            New-ItemProperty -LiteralPath $uninstallKey -Name InstallLocation -Value $InstallRoot -PropertyType String -Force | Out-Null
            New-ItemProperty -LiteralPath $uninstallKey -Name UninstallString -Value ('"{0}"' -f $Uninstaller) -PropertyType String -Force | Out-Null
            New-ItemProperty -LiteralPath $uninstallKey -Name MainBinaryName -Value ([IO.Path]::GetFileName($MainExe)) -PropertyType String -Force | Out-Null
            $legacyProductKey = "HKCU:\Software\$publisher\$Name"
            New-Item -Path $legacyProductKey -Force | Out-Null
            Set-Item -LiteralPath $legacyProductKey -Value $InstallRoot
            $shell = New-Object -ComObject WScript.Shell
            foreach ($shortcutPath in @(
              (Join-Path ([Environment]::GetFolderPath('Programs')) "$Name.lnk"),
              (Join-Path ([Environment]::GetFolderPath('Desktop')) "$Name.lnk")
            )) {
              $shortcut = $shell.CreateShortcut($shortcutPath)
              $shortcut.TargetPath = $MainExe
              $shortcut.WorkingDirectory = $InstallRoot
              $shortcut.Save()
            }
            Write-Host "seeded exact legacy identity residue while current '$productName' remains installed: '$Name'"
          }

          '''
          text = once(text, marker, helper + marker, 'legacy residue helper')
          text = once(text,
          '''  Probe-App $candidatePaths.MainExe "candidate $expectedVersion"
            Assert-RetainedUserData

            Stop-App
          ''',
          '''  Probe-App $candidatePaths.MainExe "candidate $expectedVersion"
            Assert-RetainedUserData

            if ($baseProductName -ne $productName) {
              Seed-LegacyIdentityResidue $baseProductName $candidatePaths.InstallRoot $candidatePaths.MainExe $candidatePaths.Uninstaller
              if (@(Get-UninstallEntries -Name $productName).Count -ne 1 -or @(Get-UninstallEntries -Name $baseProductName).Count -ne 1) {
                throw 'Failed to establish current-product + legacy-residue migration precondition.'
              }
              $residualUpgrade = Start-Process -FilePath $Candidate -ArgumentList '/S' -PassThru -Wait
              if ($residualUpgrade.ExitCode -ne 0) { throw "Candidate residual-identity reinstall exited with $($residualUpgrade.ExitCode)." }
              if (@(Get-UninstallEntries -Name $baseProductName).Count -ne 0) {
                throw "Legacy uninstall registration '$baseProductName' remained when $productName was already installed."
              }
              if (@(Get-UninstallEntries -Name $productName).Count -ne 1) {
                throw "Expected exactly one current '$productName' uninstall identity after residual cleanup."
              }
              foreach ($shortcut in @($legacyStartShortcut, $legacyDesktopShortcut)) {
                if (Test-Path -LiteralPath $shortcut) {
                  throw "Legacy shortcut remained when $productName was already installed: $shortcut"
                }
              }
              $candidateRegistration = Get-Registration $expectedVersion
              $candidatePaths = Get-InstalledPaths $candidateRegistration
              Assert-RetainedUserData
              Write-Host "current product + legacy residue migration passed: only one '$productName' identity remains; user data preserved"
            }

            Stop-App
          ''', 'residual migration execution')
          write(path, text)

          path = 'scripts/beta5-regressions.test.mjs'
          text = read(path)
          text = once(text, "  assert.match(generator, /LegacyBrandMigration/)\n",
              "  assert.match(generator, /LegacyBrandMigration/)\n  assert.doesNotMatch(generator, /StrCpy \\$INSTDIR \\$4',\\n\\s*'    Return'/)\n  assert.match(generator, /Cleanup is keyed only by the exact historical product identity/)\n",
              'beta5 migration assertions')
          text = once(text,
              "const packageGate = readFileSync('scripts/verify-native-ocr-package.ps1', 'utf8')\n",
              "const packageGate = readFileSync('scripts/verify-native-ocr-package.ps1', 'utf8')\nconst upgradeSmoke = readFileSync('scripts/windows-release-upgrade-smoke.ps1', 'utf8')\n",
              'upgrade smoke test fixture')
          text += "\ntest('upgrade smoke covers current product plus exact legacy residue', () => {\n  assert.match(upgradeSmoke, /Seed-LegacyIdentityResidue/)\n  assert.match(upgradeSmoke, /current product \\+ legacy residue migration passed/)\n  assert.match(upgradeSmoke, /ExpectedVersion/)\n})\n"
          write(path, text)

          validate = read('.ci-staging/validate.yml')
          anchor = "      - name: Check screenshot import DOM lifecycle\n        run: npm run check:screenshot-import-dom\n"
          validate = once(validate, anchor,
              anchor + "\n      - name: Check beta.5 regression contracts\n        run: node --test scripts/beta5-regressions.test.mjs\n",
              'Validate beta5 regression step')
          write('.ci-staging/final-validate.yml', validate)

          release = read('.ci-staging/release-build.yml')
          start = release.index('      - name: Smoke test public v0.3.0 legacy-brand upgrade\n')
          end = release.index('      - name: Verify packaged native OCR resources\n', start)
          release = release[:start] + release[end:]
          release = once(release, 'permissions:\n  contents: read\n', 'permissions:\n  contents: read\n  actions: read\n', 'release actions read permission')
          release = release.rstrip() + r'''

            legacy-brand-upgrade:
              name: Public v0.3.0 brand migration
              if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
              needs: build-release
              runs-on: windows-latest
              timeout-minutes: 20

              steps:
                - name: Checkout release branch
                  uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                  with:
                    ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0

                - name: Download candidate installer from build-release
                  shell: pwsh
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    $artifactDir = Join-Path $env:RUNNER_TEMP 'beta5-candidate'
                    New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
                    gh run download $env:GITHUB_RUN_ID `
                      --repo $env:GITHUB_REPOSITORY `
                      --name desktop-course-widget-windows-release `
                      --dir $artifactDir
                    $installer = @(Get-ChildItem -LiteralPath $artifactDir -Filter '*.exe' -File)
                    if ($installer.Count -ne 1) {
                      throw "Expected exactly one candidate installer artifact, found $($installer.Count)."
                    }
                    "CANDIDATE_INSTALLER=$($installer[0].FullName)" >> $env:GITHUB_ENV

                - name: Smoke test public v0.3.0 legacy-brand upgrade
                  shell: pwsh
                  run: |
                    ./scripts/windows-release-upgrade-smoke.ps1 `
                      -Candidate $env:CANDIDATE_INSTALLER `
                      -ExpectedVersion $env:COURSE_WIDGET_BUILD_VERSION `
                      -BaseVersion '0.3.0' `
                      -BaseUrl 'https://github.com/Tyr1onX/desktop-course-widget/releases/download/v0.3.0/_0.3.0_x64-setup.exe' `
                      -BaseSha256 '4a54a97c9dc0799098d123ffa0ba5ae253fe6557e1e8067968706a62404b99b6' `
                      -LegacyProductName '桌面课表'
          ''' + '\n'
          write('.ci-staging/final-release-build.yml', release)
          PY
          git diff --check
          git status --short
      - name: Commit staged closeout files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-installer-template.mjs scripts/windows-release-upgrade-smoke.ps1 scripts/beta5-regressions.test.mjs .ci-staging/final-validate.yml .ci-staging/final-release-build.yml
          git commit -m 'fix: close beta.5 migration and CI coverage'
          git push origin HEAD:fix/v0.5.0-beta.5
