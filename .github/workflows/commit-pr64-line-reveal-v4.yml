name: Commit PR 64 line reveal handoff v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  commit-line-reveal-handoff:
    if: github.event.pull_request.number == 64 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Patch shared time and line reveals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def index_of(lines, value, start=0):
              for index in range(start, len(lines)):
                  if lines[index].strip() == value:
                      return index
              raise SystemExit(f'line not found: {value}')

          def replace_range(lines, start_value, end_value, replacement, include_end=True, search_start=0):
              start = index_of(lines, start_value, search_start)
              end = index_of(lines, end_value, start)
              stop = end + 1 if include_end else end
              return lines[:start] + replacement.splitlines() + lines[stop:]

          Path('src/duration.ts').write_text("""export function formatMinutesDuration(totalMinutes: number): string {
            const minutes = Math.max(0, Math.round(totalMinutes))
            if (minutes < 60) return `${minutes} 分钟`
            const hours = Math.floor(minutes / 60)
            const remainingMinutes = minutes % 60
            return remainingMinutes > 0
              ? `${hours} 小时 ${remainingMinutes} 分钟`
              : `${hours} 小时`
          }
          """, encoding='utf-8')

          widget_path = Path('src/widget.ts')
          widget = widget_path.read_text(encoding='utf-8')
          if "from './duration'" not in widget:
              widget = "import { formatMinutesDuration } from './duration'\n" + widget
          widget = widget.replace(
              "if (model.mode === 'current') return `<p class=\"countdown\">距下课 ${Math.max(0, parseTime(model.focus.end) - nowMinutes)} 分钟</p>`",
              "if (model.mode === 'current') return `<p class=\"countdown\">距下课 ${formatMinutesDuration(parseTime(model.focus.end) - nowMinutes)}</p>`",
              1,
          )
          widget = widget.replace(
              "if (model.mode === 'next') return `<p class=\"countdown\">${Math.max(0, parseTime(model.focus.start) - nowMinutes)} 分钟后开始</p>`",
              "if (model.mode === 'next') return `<p class=\"countdown\">${formatMinutesDuration(parseTime(model.focus.start) - nowMinutes)}后开始</p>`",
              1,
          )
          if 'formatMinutesDuration(parseTime(model.focus.end)' not in widget or 'formatMinutesDuration(parseTime(model.focus.start)' not in widget:
              raise SystemExit('widget countdown replacements did not land')
          widget_path.write_text(widget, encoding='utf-8')

          flow_path = Path('src/time-flow.ts')
          flow = flow_path.read_text(encoding='utf-8')
          if "from './duration'" not in flow:
              flow = "import { formatMinutesDuration } from './duration'\n" + flow
          flow = flow.replace(
              "if (countdown) countdown.textContent = `还剩 ${Math.max(0, minutesUntilEnd)} 分钟`",
              "if (countdown) countdown.textContent = `还剩 ${formatMinutesDuration(minutesUntilEnd)}`",
              1,
          )
          if 'formatMinutesDuration(minutesUntilEnd)' not in flow:
              raise SystemExit('time flow countdown replacement did not land')
          flow_path.write_text(flow, encoding='utf-8')

          page_path = Path('src/widget-page.ts')
          lines = page_path.read_text(encoding='utf-8').splitlines()
          constants = {
              'const COURSE_SHARED_TEXT_MOVE_MS = 980': 'const COURSE_SHARED_TEXT_MOVE_MS = 1120',
              'const COURSE_CARD_FORM_MS = 980': 'const COURSE_CARD_FORM_MS = 1120',
              'const COURSE_TEXT_HANDOFF_MS = 110': 'const COURSE_TEXT_HANDOFF_MS = 90',
          }
          for old, new in constants.items():
              index = index_of(lines, old)
              indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
              lines[index] = indent + new
          handoff_index = index_of(lines, 'const COURSE_TEXT_HANDOFF_MS = 90')
          lines.insert(handoff_index, 'const COURSE_LINE_REVEAL_MS = 820')

          helper_index = index_of(lines, 'function elementText(root: ParentNode | null, selector: string) {')
          helper = """function prepareLineReveal(element: HTMLElement) {
            const copy = document.createElement('span')
            copy.className = 'course-line-reveal-copy'
            copy.textContent = element.textContent ?? ''
            const stroke = document.createElement('span')
            stroke.className = 'course-line-reveal-stroke'
            element.replaceChildren(stroke, copy)
            element.classList.add('course-line-reveal')
            return { root: element, stroke, copy }
          }
          """.splitlines()
          lines[helper_index:helper_index] = helper + ['']

          lines = replace_range(
              lines,
              "const sourceTitle = sharedSource.querySelector<HTMLElement>('strong')",
              "const sharedMotions = [titleMotion, locationMotion].filter((motion): motion is NonNullable<typeof motion> => Boolean(motion))",
              """  const sourceTitle = sharedSource.querySelector<HTMLElement>('strong')
            const sourceLocation = sharedSource.querySelector<HTMLElement>('small')
            const sourceTime = sharedSource.querySelector<HTMLElement>('time')
            const targetTitle = targetPrimary.querySelector<HTMLElement>('h2')
            const targetLocation = targetPrimary.querySelector<HTMLElement>('.course-location')
            const targetTime = targetPrimary.querySelector<HTMLElement>('.course-time')
            const titleMotion = sharedTextMotion(sourceTitle, targetTitle)
            const locationMotion = sharedTextMotion(sourceLocation, targetLocation)
            const timeMotion = sharedTextMotion(sourceTime, targetTime)
            const sharedMotions = [titleMotion, locationMotion, timeMotion]
              .filter((motion): motion is NonNullable<typeof motion> => Boolean(motion))""",
          )

          lines = replace_range(
              lines,
              "const targetCopies = Array.from(targetLayer.querySelectorAll<HTMLElement>('h2, .course-location'))",
              'morph.append(surface, targetLayer)',
              """  const targetTitleCopy = targetLayer.querySelector<HTMLElement>('h2')
            const targetLocationCopy = targetLayer.querySelector<HTMLElement>('.course-location')
            const targetTimeCopy = targetLayer.querySelector<HTMLElement>('.course-time')
            const fullTargetTime = targetTimeCopy?.textContent?.trim() ?? ''
            const [targetStartTime = '', ...targetEndParts] = fullTargetTime.split(/[–-]/)
            const targetEndTime = targetEndParts.join('–').trim()
            let targetTimePrefix: HTMLElement | null = null
            let targetTimeExtension: HTMLElement | null = null
            if (targetTimeCopy && targetStartTime) {
              targetTimePrefix = document.createElement('span')
              targetTimePrefix.className = 'course-time-shared-prefix is-shared-copy-hidden'
              targetTimePrefix.textContent = targetStartTime.trim()
              targetTimeExtension = document.createElement('span')
              targetTimeExtension.className = 'course-time-extension'
              targetTimeExtension.textContent = targetEndTime ? `–${targetEndTime}` : ''
              targetTimeCopy.replaceChildren(targetTimePrefix, targetTimeExtension)
            }
            const targetCopies = [targetTitleCopy, targetLocationCopy, targetTimePrefix]
              .filter((copy): copy is HTMLElement => Boolean(copy))
            targetCopies.forEach((copy) => copy.classList.add('is-shared-copy-hidden'))
            const lineRevealParts = Array.from(targetLayer.querySelectorAll<HTMLElement>('.focus-kicker, .countdown'))
              .map(prepareLineReveal)
            const softRevealParts = Array.from(targetLayer.querySelectorAll<HTMLElement>('.course-date, .course-flow'))
            lineRevealParts.forEach(({ stroke, copy }) => {
              stroke.style.opacity = '.28'
              stroke.style.transform = 'scaleX(.08)'
              copy.style.opacity = '0'
              copy.style.clipPath = 'inset(0 100% 0 0)'
            })
            softRevealParts.forEach((part) => {
              part.style.opacity = '0'
              part.style.clipPath = 'inset(0 100% 0 0)'
              part.style.transform = 'translateY(5px)'
            })
            if (targetTimeExtension) {
              targetTimeExtension.style.opacity = '0'
              targetTimeExtension.style.clipPath = 'inset(0 100% 0 0)'
            }
            morph.append(surface, targetLayer)""",
          )

          parallel_start = index_of(lines, '...targetRevealParts.map((part, index) => animateElement(part, [')
          parallel_end = index_of(lines, '})),', parallel_start)
          parallel = """    ...(targetTimeExtension ? [animateElement(targetTimeExtension, [
              { opacity: .08, clipPath: 'inset(0 100% 0 0)', transform: 'translateX(-2px)' },
              { offset: .48, opacity: .45, clipPath: 'inset(0 42% 0 0)', transform: 'translateX(-1px)' },
              { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateX(0)' },
            ], { duration: COURSE_LINE_REVEAL_MS, delay: 230, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' })] : []),
            ...lineRevealParts.flatMap(({ stroke, copy }, index) => [
              animateElement(stroke, [
                { opacity: .22, transform: 'scaleX(.08)' },
                { offset: .58, opacity: .56, transform: 'scaleX(1)' },
                { opacity: 0, transform: 'scaleX(1)' },
              ], { duration: COURSE_LINE_REVEAL_MS, delay: 180 + index * 80, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'both' }),
              animateElement(copy, [
                { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateY(2px)' },
                { offset: .34, opacity: .14, clipPath: 'inset(0 76% 0 0)', transform: 'translateY(1px)' },
                { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateY(0)' },
              ], { duration: COURSE_LINE_REVEAL_MS, delay: 250 + index * 80, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' }),
            ]),
            ...softRevealParts.map((part, index) => animateElement(part, [
              { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateY(5px)' },
              { offset: .4, opacity: .22, clipPath: 'inset(0 64% 0 0)', transform: 'translateY(3px)' },
              { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateY(0)' },
            ], { duration: COURSE_LINE_REVEAL_MS, delay: 300 + index * 70, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' })),""".splitlines()
          lines[parallel_start:parallel_end + 1] = parallel

          cleanup_start = index_of(lines, 'targetRevealParts.forEach((part) => {')
          target_replace = index_of(lines, 'targetPrimary.replaceWith(targetLayer)', cleanup_start)
          cleanup = """  lineRevealParts.forEach(({ root, stroke, copy }) => {
            clearElementAnimations(stroke)
            clearElementAnimations(copy)
            root.classList.remove('course-line-reveal')
            root.textContent = copy.textContent ?? ''
          })
            softRevealParts.forEach((part) => {
              clearElementAnimations(part)
              part.style.removeProperty('opacity')
              part.style.removeProperty('clip-path')
              part.style.removeProperty('transform')
            })
            if (targetTimeExtension) clearElementAnimations(targetTimeExtension)
            if (targetTimeCopy) targetTimeCopy.textContent = fullTargetTime""".splitlines()
          lines[cleanup_start:target_replace] = cleanup
          page_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          css_path = Path('src/widget-page.css')
          css_lines = css_path.read_text(encoding='utf-8').splitlines()
          css_start = index_of(css_lines, '.following.is-promoting-course .timeline::before,')
          css_end = index_of(css_lines, '}', css_start)
          css_lines[css_start:css_end + 1] = """.following.is-promoting-course .timeline::before,
          .following.is-promoting-course .is-promoting-source::after {
            opacity: 0;
          }""".splitlines()
          source_start = index_of(css_lines, '.is-promoting-source strong,')
          source_second = index_of(css_lines, '.is-promoting-source small {', source_start)
          css_lines[source_second:source_second + 1] = [
              '.is-promoting-source small,',
              '.is-promoting-source > time {',
          ]
          insert_at = index_of(css_lines, '.is-course-transitioning .focus-course,')
          reveal_css = """.course-time-shared-prefix,
          .course-time-extension { display: inline-block; transform-origin: left center; }
          .course-time-extension { will-change: clip-path, opacity, transform; }
          .course-line-reveal { position: relative; display: block; overflow: hidden; }
          .course-line-reveal-stroke,
          .course-line-reveal-copy { display: block; }
          .course-line-reveal-stroke {
            position: absolute;
            inset: 50% 0 auto;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, currentColor, rgba(var(--identity-accent-rgb), .18));
            transform-origin: left center;
            pointer-events: none;
            will-change: transform, opacity;
          }
          .course-line-reveal-copy { will-change: clip-path, opacity, transform; }
          """.splitlines()
          css_lines[insert_at:insert_at] = reveal_css + ['']
          css_path.write_text('\n'.join(css_lines) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build web interface
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/duration.ts src/widget.ts src/time-flow.ts src/widget-page.ts src/widget-page.css
          git diff --cached --check
          git commit -m "fix: reveal course details through shared line growth"
          git push origin HEAD:feat/time-replay-demo
