name: Dispatch Canonical Real OCR Benchmark Once

on:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/dispatch-real-ocr-once.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch retained benchmark workflow and record run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'real-ocr-benchmark.yml';
            const ref = 'feat/screenshot-recognition-spike';
            const started = Date.now();

            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref });

            let matched = null;
            for (let attempt = 0; attempt < 30 && !matched; attempt += 1) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: ref,
                event: 'workflow_dispatch',
                per_page: 20,
              });
              matched = response.data.workflow_runs.find(run =>
                run.head_sha === context.sha &&
                Date.parse(run.created_at) >= started - 30000
              );
            }

            if (!matched) {
              core.setFailed(`Could not locate dispatched ${workflow_id} run for ${context.sha}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 72,
              body: [
                '### Canonical benchmark dispatch receipt',
                '',
                `- Run ID: \`${matched.id}\``,
                `- Run HEAD: \`${matched.head_sha}\``,
                `- Workflow: \`${workflow_id}\``,
                `- Event: \`${matched.event}\``,
                `- URL: ${matched.html_url}`,
                '',
                'This receipt was generated by the temporary one-shot dispatcher. The benchmark itself runs through the retained formal workflow.',
              ].join('\n'),
            });