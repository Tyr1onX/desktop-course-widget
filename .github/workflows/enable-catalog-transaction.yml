name: Enable catalog transaction build

on:
  push:
    branches:
      - fix/catalog-transaction-safety

permissions:
  contents: write

jobs:
  enable:
    if: github.event.head_commit.message != 'ci: enable catalog transaction workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-transaction-safety
      - name: Relax one-time workflow guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/catalog-transaction-safety.yml')
          text = path.read_text(encoding='utf-8')
          old = "if: github.event.head_commit.message == 'ci: apply catalog transaction safety patch'"
          new = "if: \"!contains(github.event.head_commit.message, 'fix: make catalog mutations recoverable')\""
          if old not in text:
              raise SystemExit('workflow guard anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit workflow guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/catalog-transaction-safety.yml
          git commit -m "ci: enable catalog transaction workflow"
          git push origin HEAD:fix/catalog-transaction-safety
