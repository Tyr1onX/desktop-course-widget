name: Export source debug

on:
  push:
    branches:
      - fix/weekday-header-row-detection
    paths:
      - .github/workflows/export-source-debug.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf ../desktop-course-widget-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-course-widget-source-debug
          path: ../desktop-course-widget-source.tar.gz
          retention-days: 1
