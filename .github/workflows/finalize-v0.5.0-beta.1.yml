name: Finalize v0.5.0-beta.1

on:
  push:
    branches:
      - spike/rust-native-ocr
    paths:
      - .github/workflows/finalize-v0.5.0-beta.1.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: finalize-v0.5.0-beta.1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 0.5.0-beta.1
      RELEASE_TAG: v0.5.0-beta.1

    steps:
      - name: Checkout release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: spike/rust-native-ocr
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select stable Rust
        run: rustup default stable

      - name: Commit release metadata and remove one-time workflow
        id: metadata
        shell: pwsh
        run: |
          node scripts/set-build-version.mjs $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $path = 'CHANGELOG.md'
          $content = Get-Content $path -Raw
          $old = @'
          ## Unreleased

          - Added a hidden time replay and presentation mode with a separate controller window and animated course handoffs.
          - Added a source-neutral import draft shared by Excel import and future screenshot recognition.
          - Added a course-by-course review and correction screen before importing a timetable.
          - Removed the obsolete in-app updater UI and its unused process/updater dependencies.
          - Reduced the production frontend build to the widget and settings pages.
          - Removed unused website styles, demo states, and duplicate validation configuration.
          - Removed the low-frequency manual backup and restore surface to keep the settings experience focused.
          - Updated repository documentation for the current release.
          '@
          $old = ($old -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $new = @'
          ## Unreleased

          ## v0.5.0-beta.1 - 2026-08-05

          - Added fully local timetable screenshot recognition using in-process Rust OCR with bundled, hash-pinned models and no Python runtime.
          - Added a course-by-course review and correction screen before importing screenshot or Excel results.
          - Preserved existing timetables and settings during the tested upgrade from v0.4.0.
          - Added clear failures for non-timetable images and kept recognition controls locked only while processing.
          - Added a hidden time replay and presentation mode with a separate controller window and animated course handoffs.
          - Tightened Tauri window capabilities with dedicated source-bound commands and no generic WebView window permissions.
          - Removed the obsolete in-app updater UI and its unused process/updater dependencies.
          - Reduced the production frontend build and removed unused website/demo configuration.

          ### Known limitations

          - Screenshot recognition is a Beta feature and may require manual correction for unfamiliar timetable layouts.
          - Some optional location fields may remain empty even when the core course arrangement is recovered correctly.
          - Use a complete PNG/JPG screenshot containing weekday headers, section markers, and all course cards.
          '@
          $new = ($new -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          if (-not $content.Contains($old)) {
            throw 'Expected Unreleased changelog block was not found.'
          }
          [System.IO.File]::WriteAllText($path, $content.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))

          Remove-Item '.github/workflows/finalize-v0.5.0-beta.1.yml' -Force

          npm run check:version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md .github/workflows/finalize-v0.5.0-beta.1.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'chore: prepare v0.5.0-beta.1 release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = git rev-parse HEAD
          "head_sha=$head" >> $env:GITHUB_OUTPUT
          git push origin HEAD:spike/rust-native-ocr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Check import review helpers
        run: npm run check:import-review

      - name: Check screenshot import policy
        run: npm run check:screenshot-import

      - name: Check import review DOM lifecycle
        run: npm run check:import-review-dom

      - name: Check screenshot import DOM lifecycle
        run: npm run check:screenshot-import-dom

      - name: Check presentation clock
        run: npm run check:presentation-clock

      - name: Check Tauri security policy
        run: npm run check:security-boundary

      - name: Build web interface
        run: npm run web:build

      - name: Check Rust dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Release OCR compile boundary
        run: cargo check --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Rust library tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Download pinned native OCR models
        shell: pwsh
        run: ./scripts/download-native-ocr-models.ps1

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Verify packaged native OCR resources
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
          ./scripts/verify-native-ocr-package.ps1 -Installer $installer.FullName

      - name: Smoke test packaged windows
        shell: pwsh
        run: ./scripts/windows-window-smoke.ps1

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $assetName = '课刻_0.5.0-beta.1_x64-setup.exe'
          "$hash  $assetName" | Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Squash merge PR 91
        id: merge
        shell: pwsh
        run: |
          $payload = @{
            commit_title = 'feat: add local screenshot recognition (v0.5.0-beta.1)'
            commit_message = 'Add in-process Rust OCR, import review, release packaging, runtime capability boundaries, and the v0.5.0-beta.1 release metadata.'
            merge_method = 'squash'
            sha = '${{ steps.metadata.outputs.head_sha }}'
          } | ConvertTo-Json
          $raw = $payload | gh api --method PUT `
            -H 'Accept: application/vnd.github+json' `
            'repos/Tyr1onX/desktop-course-widget/pulls/91/merge' `
            --input -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = $raw | ConvertFrom-Json
          if (-not $result.merged) { throw "PR merge failed: $($result.message)" }
          "merge_sha=$($result.sha)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub prerelease
        shell: pwsh
        run: |
          $notes = @"
          ## 本版重点

          课刻首次提供完全本地的课表截图识别。识别在应用进程内通过 Rust OCR 完成，不依赖 Python、云端服务或账号；结果会先进入人工检查页面，不会直接覆盖现有课表。

          ## 新增功能

          - 支持选择 PNG/JPG 完整课表截图并在本地识别。
          - 自动整理课程名、教师、星期、节次、周次、单双周和地点。
          - 提供逐项检查、一键确认和手动新增课程安排。
          - 加入隐藏的时间回放与演示控制器。

          ## 体验与稳定性

          - 覆盖安装已验证可以保留既有课表、作息和设置。
          - 文件选择完成后才开始显示识别耗时。
          - 识别期间锁定相关控件，结束或报错后自动恢复。
          - 普通照片或不完整课表会明确报错，不会无限卡住。
          - 收紧窗口权限边界，WebView 不再拥有通用窗口控制权限。

          ## 已知限制

          - 这是 Beta 版本，不熟悉的学校课表样式可能需要手动修正。
          - 少数可选地点字段可能为空，但不阻断课程导入。
          - 请使用包含完整星期栏、节次和全部课程的清晰截图。

          ## 升级说明

          安装器检测到旧版时请选择“安装前卸载”。不要选择删除应用数据；正常覆盖安装会保留本地课表和设置。

          ## 文件校验

          `课刻_0.5.0-beta.1_x64-setup.exe`

          SHA-256：`${{ steps.assets.outputs.sha256 }}`
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          [System.IO.File]::WriteAllText('release-notes.md', $notes, [System.Text.UTF8Encoding]::new($false))

          gh release create $env:RELEASE_TAG `
            "${{ steps.assets.outputs.installer }}#课刻_0.5.0-beta.1_x64-setup.exe" `
            'SHA256SUMS.txt#SHA256SUMS.txt' `
            --repo Tyr1onX/desktop-course-widget `
            --target '${{ steps.merge.outputs.merge_sha }}' `
            --title '课刻 v0.5.0-beta.1' `
            --notes-file release-notes.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: course-widget-v0.5.0-beta.1-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
