name: Normalize staged beta.5 release workflow once

on:
  push:
    branches:
      - fix/v0.5.0-beta.5
    paths:
      - .github/workflows/fix-beta5-staged-release-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/v0.5.0-beta.5
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.ci-staging/release-build.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('      - name: Smoke test public v0.3.0 legacy-brand upgrade')
          end = text.index('      - name: Smoke test release executable windows', start)
          fixed = '''      - name: Smoke test public v0.3.0 legacy-brand upgrade
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
          ./scripts/windows-release-upgrade-smoke.ps1 `
            -Candidate $installer.FullName `
            -BaseVersion '0.3.0' `
            -BaseUrl 'https://github.com/Tyr1onX/desktop-course-widget/releases/download/v0.3.0/_0.3.0_x64-setup.exe' `
            -BaseSha256 '4a54a97c9dc0799098d123ffa0ba5ae253fe6557e1e8067968706a62404b99b6' `
            -LegacyProductName '桌面课表'

      - name: Verify packaged native OCR resources
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
          ./scripts/verify-native-ocr-package.ps1 -Installer $installer.FullName

'''
          path.write_text(text[:start] + fixed + text[end:], encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.ci-staging/release-build.yml').read_text(encoding='utf-8')
          assert 'timeout-minutes: 50' in text
          assert text.count('Smoke test public v0.5.0-beta.1 upgrade') == 1
          assert text.count('Smoke test public v0.3.0 legacy-brand upgrade') == 1
          assert text.count('Verify packaged native OCR resources') == 1
          assert 'COURSE_WIDGET_BUILD_VERSION: "0.5.0-beta.5.' in text
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-staging/release-build.yml
          git commit -m "chore: normalize staged beta.5 release workflow"
          git push origin HEAD:fix/v0.5.0-beta.5
