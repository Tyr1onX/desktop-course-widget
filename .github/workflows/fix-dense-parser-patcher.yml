name: Fix dense parser patcher

on:
  push:
    branches:
      - spike/rust-native-ocr
    paths:
      - '.github/workflows/fix-dense-parser-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/rust-native-ocr
      - name: Make title cleanup patch indentation-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-dense-card-parser-fix-v2.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('          old_trim =')
          end = text.index('          metadata = metadata.replace(\n              "        || is_common_header', start)
          replacement = "\n".join([
              "          course_name_marker = 'fn course_name_from_text'",
              "          metadata_prefix, metadata_suffix = metadata.split(course_name_marker, 1)",
              "          if \"character.is_ascii_punctuation()\" not in metadata_suffix:",
              "              raise SystemExit('course title punctuation cleanup not found')",
              "          metadata_suffix = metadata_suffix.replace(",
              "              \"character.is_ascii_punctuation()\",",
              "              \"(character.is_ascii_punctuation() && !matches!(character, '[' | ']'))\",",
              "              1,",
              "          )",
              "          metadata = metadata_prefix + course_name_marker + metadata_suffix",
              "",
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          rm .github/workflows/fix-dense-parser-patcher.yml
      - name: Commit patcher correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: make dense parser patcher robust"
          git push origin HEAD:spike/rust-native-ocr
