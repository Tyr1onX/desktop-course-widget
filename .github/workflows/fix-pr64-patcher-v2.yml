name: Fix PR 64 patch matcher v2

on:
  push:
    branches:
      - feat/time-replay-demo

permissions:
  contents: write

jobs:
  fix-matcher:
    if: "${{ github.event.head_commit.message != 'chore: replace coordinate matcher structurally' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Replace matcher by label boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr64-coordinate-space-fix.yml')
          text = path.read_text(encoding='utf-8')
          label = "'stage-relative wipe coordinates'"
          label_pos = text.index(label)
          start = text.rfind('          replace_exact(', 0, label_pos)
          if start < 0:
              raise SystemExit('replace_exact start not found')
          end = text.index('\n          )', label_pos) + len('\n          )')
          replacement = '''          replace_regex(
              'src/widget-page.ts',
              r"(Object\\.assign\\(wipe\\.style, \\{\\s*left: `\\$\\{)targetRect\\.left(\\}px`,\\s*top: `\\$\\{)targetRect\\.top(\\}px`)",
              r"\\1targetRect.left - stageRect.left\\2targetRect.top - stageRect.top\\3",
              'stage-relative wipe coordinates',
              re.S,
          )'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit matcher replacement
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr64-coordinate-space-fix.yml
          git commit -m "chore: replace coordinate matcher structurally"
          git push origin HEAD:feat/time-replay-demo
