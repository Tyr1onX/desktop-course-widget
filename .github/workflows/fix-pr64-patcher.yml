name: Fix PR 64 patch matcher

on:
  push:
    branches:
      - feat/time-replay-demo

permissions:
  contents: write

jobs:
  fix-matcher:
    if: "${{ github.event.head_commit.message != 'chore: fix coordinate workflow matcher' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Replace strict wipe matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr64-coordinate-space-fix.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          replace_exact(
              'src/widget-page.ts',
              """      left: `${targetRect.left}px`,
              top: `${targetRect.top}px`,""",
              """      left: `${targetRect.left - stageRect.left}px`,
              top: `${targetRect.top - stageRect.top}px`,""",
              'stage-relative wipe coordinates',
          )'''
          new = '''          replace_regex(
              'src/widget-page.ts',
              r"(wipe\\.style, \\{\\s*left: `\\$\\{)targetRect\\.left(\\}px`,\\s*top: `\\$\\{)targetRect\\.top(\\}px`)",
              r"\\1targetRect.left - stageRect.left\\2targetRect.top - stageRect.top\\3",
              'stage-relative wipe coordinates',
              re.S,
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected strict wipe matcher once, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit matcher fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr64-coordinate-space-fix.yml
          git commit -m "chore: fix coordinate workflow matcher"
          git push origin HEAD:feat/time-replay-demo
