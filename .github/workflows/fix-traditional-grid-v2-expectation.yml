name: Correct traditional grid v2 expectation

on:
  push:
    branches:
      - fix/weekday-header-row-detection
    paths:
      - scripts/fix_traditional_grid_v2_expectation.py
      - .github/workflows/fix-traditional-grid-v2-expectation.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/weekday-header-row-detection
          fetch-depth: 0

      - name: Correct expectation
        run: python scripts/fix_traditional_grid_v2_expectation.py

      - name: Commit corrected patch script
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_traditional_grid_v2.py
          git diff --cached --check
          git commit -m "test: correct disjoint week union expectation"
          git push origin HEAD:fix/weekday-header-row-detection
