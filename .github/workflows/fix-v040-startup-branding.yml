name: Apply v0.4.0 startup and branding fix

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'fix/v0.4.0-release-startup-branding' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove unconfigured updater and refresh tray branding
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          updater_block = "    #[cfg(not(debug_assertions))]\n    let builder = builder.plugin(tauri_plugin_updater::Builder::new().build());\n\n"
          if updater_block not in text:
              raise SystemExit("updater initialization block not found")

          text = text.replace(updater_block, "", 1)
          text = text.replace('.tooltip("桌面课表组件")', '.tooltip("课刻")', 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Commit fix
        shell: pwsh
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git commit -m "fix: keep v0.4.0 release startup stable"
          git push origin HEAD:${{ github.head_ref }}
