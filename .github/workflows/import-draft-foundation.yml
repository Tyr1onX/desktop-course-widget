name: Import draft foundation

on:
  push:
    branches:
      - feat/import-draft-foundation
    paths:
      - scripts/apply_import_draft_foundation.py
      - .github/workflows/import-draft-foundation.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_import_draft_foundation.py
      - .github/workflows/import-draft-foundation.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/import-draft-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply import draft foundation
        shell: pwsh
        run: |
          python scripts/apply_import_draft_foundation.py *>&1 | Tee-Object migration.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-draft-migration-log
          path: migration.log

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        shell: pwsh
        run: |
          npm run check:version
          npm run check:time-flow
          npm run web:build

      - name: Select stable Rust
        run: rustup default stable

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/import-draft.ts src/settings.ts src-tauri/src/import_draft.rs src-tauri/src/lib.rs src-tauri/src/excel_import/converter.rs src-tauri/src/schedule_catalog.rs
          git commit -m "refactor: introduce shared import draft"
          git push origin HEAD:feat/import-draft-foundation
