name: Import review screen

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_import_review_screen.py
      - src/import-review.ts
      - .github/workflows/import-review-screen.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/import-review-screen
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply import review implementation
        shell: pwsh
        run: |
          python scripts/apply_import_review_screen.py *>&1 | Tee-Object import-review-migration.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-review-migration-log
          path: import-review-migration.log

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        shell: pwsh
        run: |
          npm run check:version
          npm run check:time-flow
          npm run web:build

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/settings.ts src/settings.css
          git commit -m "feat: add import review screen"
          git push origin HEAD:feat/import-review-screen
