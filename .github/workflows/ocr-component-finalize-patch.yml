name: Apply OCR component finalization fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-ocr-component-foundation
          fetch-depth: 0

      - name: Patch component build finalization
        shell: python
        run: |
          from pathlib import Path

          build = Path('scripts/build-ocr-component.ps1')
          text = build.read_text(encoding='utf-8')
          replacements = [
              (
                  "      $env:PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK = '0'",
                  "      Remove-Item Env:PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK -ErrorAction SilentlyContinue",
              ),
              (
                  "  $totalBytes = ($files | Measure-Object -Property size -Sum).Sum",
                  "  [int64]$totalBytes = 0\n  foreach ($file in $files) {\n    $totalBytes += [int64]$file['size']\n  }",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing build patch anchor: {old!r}')
              text = text.replace(old, new, 1)
          build.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ocr-component-release-smoke.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "          $bytes = ($manifest.files | Measure-Object -Property size -Sum).Sum"
          new = "          [int64]$bytes = 0\n          foreach ($file in $manifest.files) { $bytes += [int64]$file.size }"
          if old not in text:
              raise SystemExit('missing workflow byte-count anchor')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/ocr-component-finalize-patch.yml').unlink()

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize portable OCR component manifest"
          git push origin HEAD:feat/release-ocr-component-foundation
