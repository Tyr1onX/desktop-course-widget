name: Apply immutable OCR runtime fix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ocr-component-release-smoke.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ocr-runtime-isolation-and-diagnostics
          fetch-depth: 0

      - name: Add command-line bytecode protection and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          rust = Path("src-tauri/src/ocr_component.rs")
          replace_exact(
              rust,
              '        .arg("-I")\n        .arg("-c")',
              '        .arg("-I")\n        .arg("-B")\n        .arg("-c")',
              1,
              "Rust isolated Python flags",
          )
          rust_text = rust.read_text(encoding="utf-8")
          marker = '''    #[test]
              fn bootstrap_explicitly_inserts_module_root_under_isolated_mode() {
          '''
          test = '''    #[test]
              fn isolated_command_disables_bytecode_writes_at_cli_level() {
                  let root = env::temp_dir().join(format!(
                      "course-widget-ocr-no-bytecode-test-{}",
                      std::process::id()
                  ));
                  let _ = fs::remove_dir_all(&root);
                  let runtime = test_runtime(&root);
                  let command = isolated_python_command_with_model_access(
                      &runtime,
                      "experiments.screenshot_import.bootstrap_probe",
                      false,
                  )
                  .unwrap();
                  let args = command
                      .get_args()
                      .map(|argument| argument.to_string_lossy().into_owned())
                      .collect::<Vec<_>>();
                  assert_eq!(args.get(0).map(String::as_str), Some("-I"));
                  assert_eq!(args.get(1).map(String::as_str), Some("-B"));
                  let _ = fs::remove_dir_all(root);
              }

          '''
          if rust_text.count(marker) != 1:
              raise SystemExit("Rust bytecode regression test insertion point changed")
          rust.write_text(rust_text.replace(marker, test + marker, 1), encoding="utf-8")

          app_smoke = Path("scripts/test-ocr-app-runtime.ps1")
          replace_exact(
              app_smoke,
              "$arguments = @('-I', $SmokeScript, '--output', $Output)",
              "$arguments = @('-I', '-B', $SmokeScript, '--output', $Output)",
              1,
              "application smoke Python flags",
          )

          installer_smoke = Path("scripts/test-ocr-enabled-installer.ps1")
          replace_exact(
              installer_smoke,
              "    '-I', $smokeScript,",
              "    '-I', '-B', $smokeScript,",
              1,
              "installer smoke Python flags",
          )

          development = Path("scripts/test-ocr-development-bootstrap.ps1")
          replace_exact(
              development,
              "& $venvPython -I -m experiments.screenshot_import.bootstrap_probe",
              "& $venvPython -I -B -m experiments.screenshot_import.bootstrap_probe",
              1,
              "development bootstrap precondition flags",
          )
          replace_exact(
              development,
              "& $venvPython -I -c $bootstrap $repoRoot experiments.screenshot_import.bootstrap_probe",
              "& $venvPython -I -B -c $bootstrap $repoRoot experiments.screenshot_import.bootstrap_probe",
              1,
              "development bootstrap flags",
          )
          replace_exact(
              development,
              "Normal venv + python -I works through the explicit absolute-path bootstrap.",
              "Normal venv + python -I -B works through the explicit absolute-path bootstrap.",
              1,
              "development bootstrap result",
          )

          build = Path("scripts/build-ocr-component.ps1")
          replace_exact(
              build,
              "      '-I', $SmokeScript,",
              "      '-I', '-B', $SmokeScript,",
              3,
              "component build Python flags",
          )
          build_text = build.read_text(encoding="utf-8")
          manifest_marker = '''  $files = @(
          '''
          purge = '''  # -I intentionally ignores PYTHON* environment variables, including
            # PYTHONDONTWRITEBYTECODE. Every runtime invocation therefore uses -B, and this final
            # purge guarantees that no interpreter-generated bytecode enters the signed manifest.
            Get-ChildItem -LiteralPath $OutputRoot -Recurse -Directory -Filter '__pycache__' |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -LiteralPath $OutputRoot -Recurse -File -Include '*.pyc', '*.pyo' |
              Remove-Item -Force -ErrorAction SilentlyContinue

          '''
          if build_text.count(manifest_marker) != 1:
              raise SystemExit("component manifest insertion point changed")
          build.write_text(
              build_text.replace(manifest_marker, purge + manifest_marker, 1),
              encoding="utf-8",
          )
          '@ | Set-Content -LiteralPath apply_no_bytecode.py -Encoding utf8

          python apply_no_bytecode.py
          Remove-Item apply_no_bytecode.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          ./scripts/test-ocr-development-bootstrap.ps1 -Python python
          foreach ($script in @(
            'scripts/build-ocr-component.ps1',
            'scripts/test-ocr-app-runtime.ps1',
            'scripts/test-ocr-development-bootstrap.ps1',
            'scripts/test-ocr-enabled-installer.ps1'
          )) {
            [scriptblock]::Create((Get-Content -LiteralPath $script -Raw)) | Out-Null
          }

          $remaining = git grep -n -- "'-I', `$SmokeScript" -- '*.ps1'
          if ($LASTEXITCODE -eq 0 -and $remaining) {
            throw "Portable Python smoke still lacks explicit -B protection:`n$remaining"
          }
          $rustFlags = Select-String -LiteralPath src-tauri/src/ocr_component.rs -Pattern '.arg("-I")' -SimpleMatch
          $rustBytecodeFlags = Select-String -LiteralPath src-tauri/src/ocr_component.rs -Pattern '.arg("-B")' -SimpleMatch
          if ($rustFlags.Count -ne 1 -or $rustBytecodeFlags.Count -ne 1) {
            throw 'Rust isolated Python command does not contain exactly one -I/-B flag pair.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src-tauri/src/ocr_component.rs \
            scripts/build-ocr-component.ps1 \
            scripts/test-ocr-app-runtime.ps1 \
            scripts/test-ocr-development-bootstrap.ps1 \
            scripts/test-ocr-enabled-installer.ps1
          git commit -m 'fix: prevent isolated OCR runtime from rewriting bytecode'
          git push origin HEAD:fix/ocr-runtime-isolation-and-diagnostics
