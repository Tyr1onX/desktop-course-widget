name: Validate release OCR component

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ocr-component-release-smoke.yml'
      - 'scripts/build-ocr-component.ps1'
      - 'scripts/ocr-component-smoke.py'
      - 'experiments/screenshot_import/requirements-ocr-component.txt'
      - 'experiments/screenshot_import/**'
      - 'src-tauri/src/ocr_component.rs'
      - 'src-tauri/src/screenshot_import.rs'
      - 'src-tauri/tauri.conf.json'

permissions:
  contents: read

concurrency:
  group: release-ocr-component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-component:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: experiments/screenshot_import/requirements-ocr-component.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build portable OCR component and warm models
        shell: pwsh
        run: ./scripts/build-ocr-component.ps1 -WarmModels

      - name: Inspect generated component
        shell: pwsh
        run: |
          $manifestPath = 'src-tauri/resources/ocr-component/component.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.available -ne $true) { throw 'Generated OCR component is not available' }
          if ($manifest.platform -ne 'windows-x86_64') { throw 'Generated OCR component platform is incorrect' }
          if ($manifest.files.Count -lt 100) { throw "Generated OCR component contains too few files: $($manifest.files.Count)" }
          if (-not (Test-Path 'src-tauri/resources/ocr-component/python/python.exe')) { throw 'Portable Python is missing' }
          if (-not (Test-Path 'src-tauri/resources/ocr-component/models')) { throw 'Bundled model cache is missing' }
          $bytes = ($manifest.files | Measure-Object -Property size -Sum).Sum
          "component_version=$($manifest.componentVersion)" >> $env:GITHUB_STEP_SUMMARY
          "component_files=$($manifest.files.Count)" >> $env:GITHUB_STEP_SUMMARY
          "component_bytes=$bytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Run Rust component tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib ocr_component

      - name: Build installer with bundled OCR component
        run: npm run tauri:build

      - name: Upload component manifest
        uses: actions/upload-artifact@v4
        with:
          name: ocr-component-manifest-${{ github.sha }}
          path: src-tauri/resources/ocr-component/component.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload OCR-enabled Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-ocr-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
