name: Finish Paddle ASCII model path fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ocr-runtime-isolation-and-diagnostics
          fetch-depth: 0

      - name: Complete source edits and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          rust_path = Path("src-tauri/src/ocr_component.rs")
          rust = rust_path.read_text(encoding="utf-8")
          rust = replace_once(
              rust,
              '''            component_version: None,
                          source: "configured".into(),
                      }))
          ''',
              '''            component_version: None,
                          source: "configured".into(),
                          model_files: Vec::new(),
                          model_fingerprint: None,
                      }))
          ''',
              "configured runtime fields",
          )
          rust = rust.replace(
              "Err(error) if verify_runtime_model_cache(target, &runtime.model_files).is_ok() => {",
              "Err(_error) if verify_runtime_model_cache(target, &runtime.model_files).is_ok() => {",
              1,
          )
          rust_path.write_text(rust, encoding="utf-8")

          ps_path = Path("scripts/test-ocr-app-runtime.ps1")
          ps = ps_path.read_text(encoding="utf-8")
          ps = replace_once(
              ps,
              '''    [Parameter(Mandatory = $true)][string]$SmokeScript,
                  [Parameter(Mandatory = $true)][string]$Output
                )
          ''',
              '''    [Parameter(Mandatory = $true)][string]$SmokeScript,
                  [Parameter(Mandatory = $true)][string]$Output,
                  [switch]$GenerateSampleOnly
                )
          ''',
              "PowerShell smoke parameters",
          )
          ps = replace_once(
              ps,
              '''  foreach ($argument in @('-I', $SmokeScript, '--output', $Output, '--inference')) {
                  [void]$startInfo.ArgumentList.Add($argument)
                }
          ''',
              '''  $arguments = @('-I', $SmokeScript, '--output', $Output)
                if ($GenerateSampleOnly) {
                  $arguments += '--generate-sample'
                } else {
                  $arguments += '--inference'
                }
                foreach ($argument in $arguments) {
                  [void]$startInfo.ArgumentList.Add($argument)
                }
          ''',
              "PowerShell smoke arguments",
          )
          ps = replace_once(
              ps,
              '''  Invoke-IsolatedPortableSmoke -Python $portablePython -ModelsRoot $modelsRoot -SmokeScript $smokeScript -Output $directSmokeRoot
                $directReport = Get-Content -LiteralPath (Join-Path $directSmokeRoot 'portable-ocr-smoke.json') -Raw | ConvertFrom-Json
                if ($directReport.tokenCount -lt 4 -or $directReport.productionCliCourseCount -lt 1) {
                  throw 'Direct isolated portable Python smoke did not produce a valid OCR draft.'
                }
                $sampleImage = [IO.Path]::GetFullPath([string]$directReport.sampleImage)
          ''',
              '''  Invoke-IsolatedPortableSmoke -Python $portablePython -ModelsRoot $modelsRoot -SmokeScript $smokeScript -Output $directSmokeRoot -GenerateSampleOnly
                $directReport = Get-Content -LiteralPath (Join-Path $directSmokeRoot 'portable-ocr-smoke.json') -Raw | ConvertFrom-Json
                $sampleImage = [IO.Path]::GetFullPath([string]$directReport.sampleImage)
                if (-not (Test-Path -LiteralPath $sampleImage -PathType Leaf)) {
                  throw 'Installed portable Python did not generate the Unicode-path OCR fixture.'
                }
          ''',
              "PowerShell app fixture",
          )
          ps_path.write_text(ps, encoding="utf-8")
          '@ | Set-Content -LiteralPath finish_fix.py -Encoding utf8
          python finish_fix.py
          Remove-Item finish_fix.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/ocr_component.rs scripts/test-ocr-app-runtime.ps1
          git commit -m 'test: cover Paddle model aliases through the installed app'
          git push origin HEAD:fix/ocr-runtime-isolation-and-diagnostics
