              rust = rust.replace(
                  '''        let isolated = build_isolated_environment(&runtime, &inherited).unwrap();
          ''',
                  '''        let isolated =
                      build_isolated_environment(&runtime, &runtime.model_cache, &inherited).unwrap();
          ''',
                  1,
              )
              test_insert = r'''
              #[test]
              fn model_manifest_fingerprint_is_stable_and_sensitive() {
                  let first = RuntimeModelFile {
                      relative_path: PathBuf::from("paddlex/model/inference.json"),
                      size: 12,
                      sha256: "a".repeat(64),
                  };
                  let mut changed = first.clone();
                  changed.sha256 = "b".repeat(64);
                  assert_eq!(
                      runtime_model_fingerprint(std::slice::from_ref(&first)),
                      runtime_model_fingerprint(std::slice::from_ref(&first))
                  );
                  assert_ne!(
                      runtime_model_fingerprint(std::slice::from_ref(&first)),
                      runtime_model_fingerprint(std::slice::from_ref(&changed))
                  );
              }

          '''
              rust = replace_once(
                  rust,
                  '''    #[test]
              fn bootstrap_explicitly_inserts_module_root_under_isolated_mode() {
          ''',
                  test_insert + '''    #[test]
              fn bootstrap_explicitly_inserts_module_root_under_isolated_mode() {
          ''',
                  "model fingerprint test",
              )
              rust_path.write_text(rust, encoding="utf-8")

          ps_path = Path("scripts/test-ocr-app-runtime.ps1")
          ps = ps_path.read_text(encoding="utf-8")
          if "GenerateSampleOnly" not in ps:
              ps = replace_once(
                  ps,
