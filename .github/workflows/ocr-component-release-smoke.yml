name: Apply OCR runtime isolation patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ocr-runtime-isolation-and-diagnostics
          fetch-depth: 0

      - name: Apply verified payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          root = Path('.').resolve()
          parts_root = root / '.ocr-fix-payload'
          encoded = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(parts_root.glob('part*'))
          )
          raw = base64.b64decode(encoded, validate=True)
          expected_payload_hash = '32d0e98db88d204b2944cb1e86d75bd48f4b4d857fe79787413e2a1b5d797cd6'
          actual_payload_hash = hashlib.sha256(raw).hexdigest()
          if actual_payload_hash != expected_payload_hash:
              raise SystemExit(f'payload sha mismatch: {actual_payload_hash}')

          expected_file_hashes = {
              'src-tauri/src/ocr_component.rs': '0ad21f6eecb0a4dd3db5b82e3ae333e78270115c2b0660211ef0bf269534a5dc',
              'src-tauri/src/screenshot_import.rs': '9bd47efdecc8b4524db7dce34c382241f57359fd186a0762bcd5fc3a60d76414',
              'src-tauri/src/lib.rs': '084b358984d848451544759b01520883ae2cab82a9816579ffe5d0eb985c4e86',
              'scripts/test-ocr-app-runtime.ps1': '535fd9a3893a08a1afa448802dd2e7eb1b448b7b9f900025fe5a92851a5c43ec',
              'scripts/test-ocr-development-bootstrap.ps1': 'd57ba09252fef50cc64496b5e8bfac45c34214da7d343cb4752f47c9b03a464c',
              '.github/workflows/ocr-component-release-smoke.yml': 'faaac3990ce50429e41cada8a3000f3b1b9629576a06e0b47174ab04e19bbec6',
          }
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != set(expected_file_hashes):
                  raise SystemExit(f'unexpected payload paths: {sorted(names)}')
              for member in members:
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'unsafe payload target: {member.name}')
              archive.extractall(root, filter='data')

          for relative, expected in expected_file_hashes.items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'extracted file sha mismatch: {relative}: {actual}')

          for path in parts_root.glob('part*'):
              path.unlink()
          parts_root.rmdir()
          (root / '.github/workflows/apply-ocr-fix-payload.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src-tauri/src/ocr_component.rs \
            src-tauri/src/screenshot_import.rs \
            src-tauri/src/lib.rs \
            scripts/test-ocr-app-runtime.ps1 \
            scripts/test-ocr-development-bootstrap.ps1 \
            .github/workflows/ocr-component-release-smoke.yml \
            .ocr-fix-payload/part00 \
            .ocr-fix-payload/part01 \
            .ocr-fix-payload/part02 \
            .ocr-fix-payload/part03 \
            .ocr-fix-payload/part04 \
            .github/workflows/apply-ocr-fix-payload.yml
          git commit -m 'fix: isolate OCR runtime and add app diagnostics'
          git push origin HEAD:fix/ocr-runtime-isolation-and-diagnostics
