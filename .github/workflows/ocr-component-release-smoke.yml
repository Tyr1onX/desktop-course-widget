name: Validate release OCR component

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ocr-component-release-smoke.yml'
      - 'settings.html'
      - 'scripts/build-ocr-component.ps1'
      - 'scripts/copy-ocr-runtime.py'
      - 'scripts/ocr-component-smoke.py'
      - 'scripts/screenshot-import-dom.test.html'
      - 'scripts/screenshot-import-dom.test.ts'
      - 'scripts/test-ocr-app-runtime.ps1'
      - 'scripts/test-ocr-development-bootstrap.ps1'
      - 'scripts/test-ocr-enabled-installer.ps1'
      - 'scripts/verify-ocr-component-lock.py'
      - 'scripts/write-ocr-third-party-notices.py'
      - 'experiments/screenshot_import/requirements-ocr-component.txt'
      - 'experiments/screenshot_import/**'
      - 'src/screenshot-import-controller.ts'
      - 'src/screenshot-import-policy.ts'
      - 'src/screenshot-ocr-events.ts'
      - 'src/settings.css'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/src/ocr_component.rs'
      - 'src-tauri/src/ocr_diagnostics.rs'
      - 'src-tauri/src/ocr_worker.rs'
      - 'src-tauri/src/screenshot_import.rs'
      - 'src-tauri/tauri.conf.json'

permissions:
  contents: read

concurrency:
  group: release-ocr-component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-component:
    runs-on: windows-latest
    timeout-minutes: 140

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: experiments/screenshot_import/requirements-ocr-component.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Test isolated development bootstrap
        shell: pwsh
        run: ./scripts/test-ocr-development-bootstrap.ps1 -Python python

      - name: Build pruned portable OCR component and warm mobile models
        shell: pwsh
        run: ./scripts/build-ocr-component.ps1 -WarmModels

      - name: Inspect generated production component
        shell: pwsh
        run: |
          $root = 'src-tauri/resources/ocr-component'
          $runtime = Join-Path $root 'app/experiments/screenshot_import'
          $manifestPath = Join-Path $root 'component.json'
          $noticePath = Join-Path $root 'THIRD_PARTY_NOTICES.txt'
          $inventoryPath = Join-Path $root 'third-party-packages.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.available -ne $true) { throw 'Generated OCR component is not available' }
          if ($manifest.platform -ne 'windows-x86_64') { throw 'Generated OCR component platform is incorrect' }
          if ($manifest.componentVersion -notmatch 'mobile-worker') { throw "Unexpected component version: $($manifest.componentVersion)" }
          if ($manifest.files.Count -lt 100) { throw "Generated OCR component contains too few files: $($manifest.files.Count)" }
          if (-not (Test-Path (Join-Path $root 'python/python.exe'))) { throw 'Portable Python is missing' }
          if (-not (Test-Path (Join-Path $root 'models'))) { throw 'Bundled model cache is missing' }
          foreach ($required in @('worker.py', 'runtime_probe.py', 'bootstrap_probe.py', 'paddle_cpu.py', 'ocr_first_pipeline.py')) {
            if (-not (Test-Path (Join-Path $runtime $required) -PathType Leaf)) {
              throw "Production OCR runtime is missing $required"
            }
          }
          foreach ($unused in @('cli.py', 'corpus.py', 'corpus_benchmark.py', 'synthetic.py', 'synthetic_chinese_corpus.py', 'pipeline.py')) {
            if (Test-Path (Join-Path $runtime $unused)) {
              throw "Development-only OCR module leaked into the installer: $unused"
            }
          }
          if (-not (Test-Path $noticePath -PathType Leaf)) { throw 'Third-party notices are missing' }
          if (-not (Test-Path $inventoryPath -PathType Leaf)) { throw 'Third-party package inventory is missing' }

          $inventory = Get-Content $inventoryPath -Raw | ConvertFrom-Json
          if ($inventory.packageCount -ne 66) {
            throw "Expected 66 exactly locked packages, got $($inventory.packageCount)"
          }
          $packageNames = @($inventory.packages | ForEach-Object { $_.normalizedName })
          foreach ($required in @('numpy', 'opencv-contrib-python', 'paddleocr', 'paddlepaddle')) {
            if ($required -notin $packageNames) { throw "Third-party inventory is missing $required" }
          }

          [int64]$bytes = 0
          foreach ($file in $manifest.files) { $bytes += [int64]$file.size }
          "component_version=$($manifest.componentVersion)" >> $env:GITHUB_STEP_SUMMARY
          "component_files=$($manifest.files.Count)" >> $env:GITHUB_STEP_SUMMARY
          "component_bytes=$bytes" >> $env:GITHUB_STEP_SUMMARY
          "runtime_python_files=$((Get-ChildItem $runtime -Recurse -File -Filter '*.py').Count)" >> $env:GITHUB_STEP_SUMMARY
          "third_party_packages=$($inventory.packageCount)" >> $env:GITHUB_STEP_SUMMARY

      - name: Run frontend busy-state and Rust OCR tests
        shell: pwsh
        run: |
          npm run build
          npm run check:screenshot-import
          npm run check:screenshot-import-dom
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installer with bundled OCR component
        run: npm run tauri:build

      - name: Install app and validate reusable Tauri OCR worker
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'OCR-enabled NSIS installer was not produced' }
          ./scripts/test-ocr-app-runtime.ps1 -Installer $installer.FullName

      - name: Upload component metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-component-metadata-${{ github.sha }}
          path: |
            src-tauri/resources/ocr-component/component.json
            src-tauri/resources/ocr-component/THIRD_PARTY_NOTICES.txt
            src-tauri/resources/ocr-component/third-party-packages.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload OCR-enabled Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-ocr-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
