name: Commit verified immutable OCR fix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ocr-component-release-smoke.yml'

permissions:
  contents: write

jobs:
  commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ocr-runtime-isolation-and-diagnostics
          fetch-depth: 0

      - name: Reapply previously verified source changes and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          def change(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          change(
              "src-tauri/src/ocr_component.rs",
              '        .arg("-I")\n        .arg("-c")',
              '        .arg("-I")\n        .arg("-B")\n        .arg("-c")',
          )
          rust = Path("src-tauri/src/ocr_component.rs")
          text = rust.read_text(encoding="utf-8")
          marker = """    #[test]
              fn bootstrap_explicitly_inserts_module_root_under_isolated_mode() {
          """
          regression = """    #[test]
              fn isolated_command_disables_bytecode_writes_at_cli_level() {
                  let root = env::temp_dir().join(format!(
                      "course-widget-ocr-no-bytecode-test-{}",
                      std::process::id()
                  ));
                  let _ = fs::remove_dir_all(&root);
                  let runtime = test_runtime(&root);
                  let command = isolated_python_command_with_model_access(
                      &runtime,
                      "experiments.screenshot_import.bootstrap_probe",
                      false,
                  )
                  .unwrap();
                  let args = command
                      .get_args()
                      .map(|argument| argument.to_string_lossy().into_owned())
                      .collect::<Vec<_>>();
                  assert_eq!(args.get(0).map(String::as_str), Some("-I"));
                  assert_eq!(args.get(1).map(String::as_str), Some("-B"));
                  let _ = fs::remove_dir_all(root);
              }

          """
          if text.count(marker) != 1:
              raise SystemExit("Rust regression insertion point changed")
          rust.write_text(text.replace(marker, regression + marker, 1), encoding="utf-8")

          change(
              "scripts/test-ocr-app-runtime.ps1",
              "$arguments = @('-I', $SmokeScript, '--output', $Output)",
              "$arguments = @('-I', '-B', $SmokeScript, '--output', $Output)",
          )
          change(
              "scripts/test-ocr-enabled-installer.ps1",
              "    '-I', $smokeScript,",
              "    '-I', '-B', $smokeScript,",
          )
          change(
              "scripts/test-ocr-development-bootstrap.ps1",
              "& $venvPython -I -m experiments.screenshot_import.bootstrap_probe",
              "& $venvPython -I -B -m experiments.screenshot_import.bootstrap_probe",
          )
          change(
              "scripts/test-ocr-development-bootstrap.ps1",
              "& $venvPython -I -c $bootstrap $repoRoot experiments.screenshot_import.bootstrap_probe",
              "& $venvPython -I -B -c $bootstrap $repoRoot experiments.screenshot_import.bootstrap_probe",
          )
          change(
              "scripts/test-ocr-development-bootstrap.ps1",
              "Normal venv + python -I works through the explicit absolute-path bootstrap.",
              "Normal venv + python -I -B works through the explicit absolute-path bootstrap.",
          )
          change(
              "scripts/build-ocr-component.ps1",
              "      '-I', $SmokeScript,",
              "      '-I', '-B', $SmokeScript,",
              3,
          )
          build = Path("scripts/build-ocr-component.ps1")
          text = build.read_text(encoding="utf-8")
          marker = """  $files = @(
          """
          purge = """  # -I ignores PYTHON* environment variables, including PYTHONDONTWRITEBYTECODE.
            # Runtime calls therefore use -B, and this purge keeps generated bytecode out of the manifest.
            Get-ChildItem -LiteralPath $OutputRoot -Recurse -Directory -Filter '__pycache__' |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -LiteralPath $OutputRoot -Recurse -File -Include '*.pyc', '*.pyo' |
              Remove-Item -Force -ErrorAction SilentlyContinue

          """
          if text.count(marker) != 1:
              raise SystemExit("component manifest insertion point changed")
          build.write_text(text.replace(marker, purge + marker, 1), encoding="utf-8")
          '@ | Set-Content -LiteralPath commit_verified_fix.py -Encoding utf8

          python commit_verified_fix.py
          Remove-Item commit_verified_fix.py
          cargo fmt --manifest-path src-tauri/Cargo.toml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/src/ocr_component.rs scripts/build-ocr-component.ps1 scripts/test-ocr-app-runtime.ps1 scripts/test-ocr-development-bootstrap.ps1 scripts/test-ocr-enabled-installer.ps1
          git commit -m 'fix: prevent isolated OCR runtime from rewriting bytecode'
          git push origin HEAD:fix/ocr-runtime-isolation-and-diagnostics
