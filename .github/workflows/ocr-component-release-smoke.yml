name: Diagnose installed OCR runtime

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ocr-component-release-smoke.yml'
      - 'scripts/test-ocr-app-runtime.ps1'

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-installed-ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@v4
        with:
          ref: fix/ocr-runtime-isolation-and-diagnostics

      - name: Download existing OCR installer
        uses: actions/download-artifact@v4
        with:
          name: course-widget-ocr-windows-7542746fa81b61978e8bc4b6e97969e14ce781b7
          path: candidate
          repository: Tyr1onX/desktop-course-widget
          run-id: 30812271594
          github-token: ${{ github.token }}

      - name: Re-run installed application path with retained diagnostics
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath candidate -Recurse -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Downloaded OCR artifact did not contain an installer.' }
          ./scripts/test-ocr-app-runtime.ps1 -Installer $installer.FullName
