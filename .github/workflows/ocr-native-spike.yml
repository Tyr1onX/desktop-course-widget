name: Validate Rust-native OCR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ocr-native-spike.yml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/bin/ocr_native_spike.rs'
      - 'src-tauri/src/native_ocr.rs'
      - 'src-tauri/src/screenshot_import.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/tauri.conf.json'
      - 'src/screenshot-import-controller.ts'
      - 'src/settings.css'
      - 'scripts/screenshot-import-dom.test.ts'
      - 'scripts/download-native-ocr-models.ps1'
      - 'scripts/test-native-ocr-installer.ps1'
      - 'src-tauri/resources/ocr-native/**'
      - 'experiments/screenshot_import/synthetic_chinese_corpus.py'
      - 'docs/ocr-local-deployment-decision.md'

permissions:
  contents: read

concurrency:
  group: rust-native-ocr-${{ github.ref }}
  cancel-in-progress: true

env:
  OCR_MODEL_COMMIT: 705052d551ac254f4b2925075f5a9695910305e9

jobs:
  windows-native-runtime:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install web dependencies
        run: npm ci

      - name: Generate deterministic Chinese timetable image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pillow numpy
          @'
          from experiments.screenshot_import.synthetic_chinese_corpus import generate_chinese_timetable_sample
          generated = generate_chinese_timetable_sample('.tmp/native-ocr-input', 'mobile_cards_12')
          print(generated['image'])
          '@ | python -
          if (-not (Test-Path '.tmp/native-ocr-input/mobile_cards_12.png')) {
            throw 'Chinese timetable fixture was not generated.'
          }

      - name: Prepare hash-pinned native models
        shell: pwsh
        run: |
          ./scripts/download-native-ocr-models.ps1 -OutputRoot '.tmp/native-ocr-models'
          ./scripts/download-native-ocr-models.ps1

      - name: Build isolated in-process OCR CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --manifest-path src-tauri/Cargo.toml --release --features ocr-native-spike --bin ocr-native-spike

      - name: Run cold and warm OCR gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = [IO.Path]::GetFullPath('src-tauri/target/release/ocr-native-spike.exe')
          $image = [IO.Path]::GetFullPath('.tmp/native-ocr-input/mobile_cards_12.png')
          $models = [IO.Path]::GetFullPath('.tmp/native-ocr-models')
          $reportPath = [IO.Path]::GetFullPath('.tmp/native-ocr-report.json')
          $stderrPath = [IO.Path]::GetFullPath('.tmp/native-ocr-stderr.log')

          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $binary
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $arguments = @(
            '--image', $image,
            '--image', $image,
            '--det-model', (Join-Path $models 'PP-OCRv5_mobile_det_fp16.mnn'),
            '--rec-model', (Join-Path $models 'PP-OCRv5_mobile_rec_fp16.mnn'),
            '--charset', (Join-Path $models 'ppocr_keys_v5.txt'),
            '--max-side', '1600',
            '--max-cold-seconds', '30',
            '--max-warm-seconds', '15',
            '--minimum-expectations', '2',
            '--expect', '通信原理',
            '--expect', '数字信号处理',
            '--expect', '单片机原理',
            '--expect', '通信与网络'
          )
          foreach ($argument in $arguments) {
            [void]$startInfo.ArgumentList.Add([string]$argument)
          }

          $process = [Diagnostics.Process]::Start($startInfo)
          if (-not $process) { throw 'Could not start native OCR spike.' }
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          $process.WaitForExit()
          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          [IO.File]::WriteAllText($reportPath, $stdout, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($stderrPath, $stderr, [Text.UTF8Encoding]::new($false))
          if ($stderr.Trim()) {
            Write-Host 'Native OCR runtime diagnostics:'
            Write-Host $stderr.Trim()
          }
          if ($process.ExitCode -ne 0) {
            throw "Native OCR spike exited with code $($process.ExitCode)."
          }

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8").lstrip()
          report, end = json.JSONDecoder().raw_decode(text)
          trailing = text[end:].strip()
          path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if trailing:
              print("Native OCR stdout diagnostics:")
              print(trailing)
          '@ | python - $reportPath
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.allGatesPassed) { throw 'Native OCR gate did not pass.' }
          if ($report.externalProcesses -ne 0) { throw 'Native OCR unexpectedly used an external process.' }
          if ($report.runs.Count -ne 2) { throw 'Expected exactly two OCR runs in one process.' }
          "engine_initialization_ms=$($report.engineInitializationMs)" >> $env:GITHUB_STEP_SUMMARY
          "cold_total_ms=$($report.coldTotalMs)" >> $env:GITHUB_STEP_SUMMARY
          "warm_total_ms=$($report.runs[1].runTotalMs)" >> $env:GITHUB_STEP_SUMMARY
          "first_items=$($report.runs[0].itemCount)" >> $env:GITHUB_STEP_SUMMARY
          "matched_terms=$($report.runs[0].matchedExpectedTerms -join ', ')" >> $env:GITHUB_STEP_SUMMARY

      - name: Build integrated web application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path '.tmp' | Out-Null
          npm run build 2>&1 | Tee-Object -FilePath '.tmp/integrated-web-build.log'

      - name: Run screenshot import controller tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check:screenshot-import 2>&1 | Tee-Object -FilePath '.tmp/screenshot-import-controller-tests.log'

      - name: Run screenshot import DOM tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check:screenshot-import-dom 2>&1 | Tee-Object -FilePath '.tmp/screenshot-import-dom-tests.log'

      - name: Run integrated Rust tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | Tee-Object -FilePath '.tmp/integrated-rust-tests.log'

      - name: Verify native OCR dependency boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tree = cargo tree --manifest-path src-tauri/Cargo.toml --invert ocr-rs --depth 1 2>&1 | Tee-Object -FilePath '.tmp/cargo-tree.log'
          if (-not ($tree | Select-String -Quiet -Pattern '^ocr-rs v2\.4\.0$')) {
            throw 'Normal application dependency tree does not contain the pinned native OCR engine.'
          }

      - name: Build normal NSIS installer with native OCR
        run: npm run tauri:build

      - name: Inspect packaged native OCR boundary
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Native OCR NSIS installer was not produced.' }
          $models = @(Get-ChildItem 'src-tauri/resources/ocr-native' -File)
          foreach ($required in @('PP-OCRv5_mobile_det_fp16.mnn', 'PP-OCRv5_mobile_rec_fp16.mnn', 'ppocr_keys_v5.txt', 'manifest.json')) {
            if ($required -notin $models.Name) { throw "Packaged OCR resource is missing: $required" }
          }
          if (Get-ChildItem 'src-tauri/resources' -Recurse -File | Where-Object { $_.Name -match '^python(w)?\.exe$|paddle' }) {
            throw 'Native OCR resources unexpectedly contain Python or Paddle runtime files.'
          }
          "installer_bytes=$($installer.Length)" >> $env:GITHUB_STEP_SUMMARY
          "native_model_bytes=$((($models | Measure-Object Length -Sum).Sum))" >> $env:GITHUB_STEP_SUMMARY

      - name: Install and run OCR through the actual Tauri application
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Native OCR NSIS installer was not produced.' }
          ./scripts/test-native-ocr-installer.ps1 `
            -Installer $installer.FullName `
            -Image '.tmp/native-ocr-input/mobile_cards_12.png' `
            -WorkingRoot '.tmp/native-ocr-installed'

      - name: Upload native OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-native-ocr-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            .tmp/native-ocr-report.json
            .tmp/native-ocr-stderr.log
            .tmp/integrated-web-build.log
            .tmp/screenshot-import-controller-tests.log
            .tmp/screenshot-import-dom-tests.log
            .tmp/integrated-rust-tests.log
            .tmp/cargo-tree.log
            src-tauri/resources/ocr-native/manifest.json
            .tmp/native-ocr-input/mobile_cards_12.png
            .tmp/native-ocr-installed/原生识别结果.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
