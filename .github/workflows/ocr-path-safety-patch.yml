name: Apply strict OCR manifest path validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-ocr-component-foundation
          fetch-depth: 0

      - name: Patch lexical path validation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/ocr_component.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn validate_relative_path(value: &str) -> Result<(), String> {
    if value.trim().is_empty() {
        return Err("本地识别组件清单包含空路径".into());
    }
    let path = Path::new(value);
'''
          new = '''fn validate_relative_path(value: &str) -> Result<(), String> {
    if value.trim().is_empty() {
        return Err("本地识别组件清单包含空路径".into());
    }
    if value
        .split(['/', '\\\\'])
        .any(|segment| segment.is_empty() || matches!(segment, "." | ".."))
    {
        return Err(format!("本地识别组件路径不安全：{value}"));
    }
    let path = Path::new(value);
'''
          if old not in text:
              raise SystemExit('missing validate_relative_path anchor')
          text = text.replace(old, new, 1)

          old_test = '''        assert!(validate_relative_path("../python.exe").is_err());
        assert!(validate_relative_path("C:\\\\python.exe").is_err());
        assert!(validate_relative_path("python/./python.exe").is_err());
'''
          new_test = '''        assert!(validate_relative_path("../python.exe").is_err());
        assert!(validate_relative_path("C:\\\\python.exe").is_err());
        assert!(validate_relative_path("python/./python.exe").is_err());
        assert!(validate_relative_path("python//python.exe").is_err());
        assert!(validate_relative_path("python\\\\..\\\\python.exe").is_err());
        assert!(validate_relative_path(".").is_err());
        assert!(validate_relative_path("..").is_err());
'''
          if old_test not in text:
              raise SystemExit('missing path safety test anchor')
          path.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')

      - name: Commit path validation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/ocr_component.rs
          git commit -m "fix: reject ambiguous OCR manifest paths"
          git push origin HEAD:feat/release-ocr-component-foundation
