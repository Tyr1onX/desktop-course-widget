name: Paced replay Windows test build

on:
  push:
    branches:
      - feat/time-replay-demo
    paths:
      - .github/workflows/paced-replay-windows-build.yml
      - src/presentation-events.ts
      - src/presentation-page.ts
      - src/widget-page.ts
      - src/widget-page.css
      - scripts/check-presentation-clock.mjs

permissions:
  contents: read

concurrency:
  group: paced-replay-windows-test
  cancel-in-progress: true

jobs:
  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select stable Rust
        run: rustup default stable

      - name: Run presentation checks
        run: npm run check:presentation-clock

      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: keke-paced-replay-windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
