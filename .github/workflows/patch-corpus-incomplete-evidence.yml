name: Patch corpus incomplete evidence

on:
  push:
    branches:
      - feat/timetable-corpus-benchmark

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'feat/timetable-corpus-benchmark'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/timetable-corpus-benchmark
          fetch-depth: 0

      - name: Tighten incomplete evidence gate
        shell: python
        run: |
          from pathlib import Path

          benchmark = Path('experiments/screenshot_import/corpus_benchmark.py')
          text = benchmark.read_text(encoding='utf-8')
          old = '''    warnings = report.get("warnings")
              warning_count = len(warnings) if isinstance(warnings, list) else 0
              recognized = bool(report.get("success")) and course_count > 0
              reviewable = (
                  status_counts["review"] > 0
                  or status_counts["missing"] > 0
                  or warning_count > 0
              )
          '''.replace('              ', '')
          new = '''    warnings = report.get("warnings")
              warning_values = (
                  [str(warning) for warning in warnings]
                  if isinstance(warnings, list)
                  else []
              )
              warning_count = len(warning_values)
              incomplete_warning_count = sum(
                  _is_incomplete_warning(warning) for warning in warning_values
              )
              recognized = bool(report.get("success")) and course_count > 0
              reviewable = (
                  status_counts["review"] > 0
                  or status_counts["missing"] > 0
                  or incomplete_warning_count > 0
              )
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('expected benchmark warning block was not found')
          text = text.replace(old, new, 1)

          marker = '\n\ndef classify_failure(error: Exception | str) -> str:\n'
          helper = '''

          _INCOMPLETE_WARNING_HINTS = (
              "裁切",
              "不完整",
              "截断",
              "图片边缘",
              "缺少星期表头",
              "缺少节次标签",
              "cropped",
              "incomplete",
              "truncated",
              "cut off",
              "missing weekday header",
              "missing section label",
          )


          def _is_incomplete_warning(value: str) -> bool:
              normalized = value.casefold()
              return any(hint in normalized for hint in _INCOMPLETE_WARNING_HINTS)
          '''.replace('          ', '')
          if marker not in text:
              raise SystemExit('classify_failure marker was not found')
          text = text.replace(marker, helper + marker, 1)

          record_old = '''        "warningCount": warning_count,
          '''.replace('          ', '')
          record_new = '''        "warningCount": warning_count,
              "incompleteWarningCount": incomplete_warning_count,
          '''.replace('              ', '')
          if record_old not in text:
              raise SystemExit('warningCount record field was not found')
          text = text.replace(record_old, record_new, 1)
          benchmark.write_text(text, encoding='utf-8')

          tests = Path('experiments/screenshot_import/tests/test_corpus_benchmark.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = r'''


def test_generic_warning_does_not_satisfy_strict_incomplete(tmp_path: Path) -> None:
    corpus, manifest = _prepare_corpus(tmp_path)

    def generic_warning(_path: Path, _output: Path) -> dict:
        report = _recognized(review=0, missing=0)
        report["warnings"] = ["网格辅助不可用：网格横线不足"]
        return report

    report = run_corpus_benchmark(
        corpus,
        tmp_path / "strict-generic-warning",
        generic_warning,
        manifest_path=manifest,
        sample_ids=["positive-sample"],
        include_originals=False,
        strict_incomplete=True,
    )
    case = report["cases"][0]
    assert report["gatePassed"] is False
    assert case["outcome"] == "silent-incomplete-recognition"
    assert case["warningCount"] == 1
    assert case["incompleteWarningCount"] == 0


def test_explicit_incomplete_warning_satisfies_strict_incomplete(tmp_path: Path) -> None:
    corpus, manifest = _prepare_corpus(tmp_path)

    def incomplete_warning(_path: Path, _output: Path) -> dict:
        report = _recognized(review=0, missing=0)
        report["warnings"] = ["截图底部可能被裁切，课表内容可能不完整"]
        return report

    report = run_corpus_benchmark(
        corpus,
        tmp_path / "strict-incomplete-warning",
        incomplete_warning,
        manifest_path=manifest,
        sample_ids=["positive-sample"],
        include_originals=False,
        strict_incomplete=True,
    )
    case = report["cases"][0]
    assert report["gatePassed"] is True
    assert case["outcome"] == "incomplete-reviewable"
    assert case["incompleteWarningCount"] == 1
'''
          if 'test_generic_warning_does_not_satisfy_strict_incomplete' in test_text:
              raise SystemExit('strict incomplete regression tests already exist')
          tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')

          Path('.github/workflows/patch-corpus-incomplete-evidence.yml').unlink()

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/screenshot_import/corpus_benchmark.py
          git add experiments/screenshot_import/tests/test_corpus_benchmark.py
          git add .github/workflows/patch-corpus-incomplete-evidence.yml
          git commit -m "test: require actionable incomplete screenshot evidence"
          git push origin HEAD:feat/timetable-corpus-benchmark
