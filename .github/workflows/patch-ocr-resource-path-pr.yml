name: Apply installed OCR resource path fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/patch-ocr-resource-path-pr.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src-tauri/src/ocr_component.rs'
          $text = Get-Content -LiteralPath $path -Raw
          $text = $text.Replace(@'
          fn resource_root(app: &AppHandle) -> Result<PathBuf, String> {
              if let Some(path) = env::var_os(OCR_RESOURCE_ROOT_ENV) {
                  return Ok(PathBuf::from(path));
              }
              Ok(app
                  .path()
                  .resource_dir()
                  .map_err(|error| format!("无法定位安装包资源目录：{error}"))?
                  .join(COMPONENT_RESOURCE_DIR))
          }
          '@, @'
          fn resource_root(app: &AppHandle) -> Result<PathBuf, String> {
              if let Some(path) = env::var_os(OCR_RESOURCE_ROOT_ENV) {
                  return Ok(PathBuf::from(path));
              }
              let base = app
                  .path()
                  .resource_dir()
                  .map_err(|error| format!("无法定位安装包资源目录：{error}"))?;
              resolve_resource_root_from_base(&base)
          }

          fn resolve_resource_root_from_base(base: &Path) -> Result<PathBuf, String> {
              [
                  base.join(COMPONENT_RESOURCE_DIR),
                  base.join("resources").join(COMPONENT_RESOURCE_DIR),
              ]
              .into_iter()
              .find(|candidate| candidate.join(COMPONENT_MANIFEST_FILE).is_file())
              .ok_or_else(|| {
                  "当前安装包中未找到本地识别组件清单，请重新下载安装课刻。".to_owned()
              })
          }
          '@)
          if ($text -notmatch 'resolve_resource_root_from_base') { throw 'Rust resource resolver replacement failed' }
          $marker = @'
              fn install_copies_only_manifest_files_and_detects_tampering() {
          '@
          $test = @'
              #[test]
              fn resolves_both_tauri_resource_layouts() {
                  let root = env::temp_dir().join(format!(
                      "course-widget-ocr-resource-layout-test-{}",
                      std::process::id()
                  ));
                  let _ = fs::remove_dir_all(&root);
                  let direct = root.join(COMPONENT_RESOURCE_DIR);
                  fs::create_dir_all(&direct).unwrap();
                  fs::write(direct.join(COMPONENT_MANIFEST_FILE), b"{}").unwrap();
                  assert_eq!(resolve_resource_root_from_base(&root).unwrap(), direct);
                  fs::remove_dir_all(root.join(COMPONENT_RESOURCE_DIR)).unwrap();
                  let nested = root.join("resources").join(COMPONENT_RESOURCE_DIR);
                  fs::create_dir_all(&nested).unwrap();
                  fs::write(nested.join(COMPONENT_MANIFEST_FILE), b"{}").unwrap();
                  assert_eq!(resolve_resource_root_from_base(&root).unwrap(), nested);
                  fs::remove_dir_all(&nested).unwrap();
                  assert!(resolve_resource_root_from_base(&root).is_err());
                  let _ = fs::remove_dir_all(root);
              }

              #[test]
              fn install_copies_only_manifest_files_and_detects_tampering() {
          '@
          if (-not $text.Contains($marker)) { throw 'Rust test insertion point not found' }
          $text = $text.Replace($marker, $test)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM

          $smokePath = 'scripts/test-ocr-enabled-installer.ps1'
          $smoke = Get-Content -LiteralPath $smokePath -Raw
          $old = @'
            $ResourceRoot = $manifestFile.Directory.FullName
            $manifest = Get-Content -LiteralPath $manifestFile.FullName -Raw | ConvertFrom-Json
          '@
          $new = @'
            $ResourceRoot = $manifestFile.Directory.FullName
            $expectedResourceRoot = Join-Path $InstallRoot 'resources/ocr-component'
            if (-not [IO.Path]::GetFullPath($ResourceRoot).Equals(
              [IO.Path]::GetFullPath($expectedResourceRoot),
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Installed OCR component used an unexpected resource layout: $ResourceRoot"
            }
            $manifest = Get-Content -LiteralPath $manifestFile.FullName -Raw | ConvertFrom-Json
          '@
          if (-not $smoke.Contains($old)) { throw 'Installer smoke insertion point not found' }
          $smoke = $smoke.Replace($old, $new)
          Set-Content -LiteralPath $smokePath -Value $smoke -Encoding utf8NoBOM

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/ocr_component.rs scripts/test-ocr-enabled-installer.ps1
          git commit -m 'fix: resolve installed OCR resource layout'
          git push origin HEAD:${{ github.head_ref }}
