name: Patch PR 64 line reveal handoff

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-line-reveal-handoff:
    if: github.event.pull_request.number == 64 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Patch shared time and line reveals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          duration_path = Path('src/duration.ts')
          duration_path.write_text("""export function formatMinutesDuration(totalMinutes: number): string {
            const minutes = Math.max(0, Math.round(totalMinutes))
            if (minutes < 60) return `${minutes} 分钟`
            const hours = Math.floor(minutes / 60)
            const remainingMinutes = minutes % 60
            return remainingMinutes > 0
              ? `${hours} 小时 ${remainingMinutes} 分钟`
              : `${hours} 小时`
          }
          """, encoding='utf-8')

          widget_path = Path('src/widget.ts')
          widget = widget_path.read_text(encoding='utf-8')
          if "from './duration'" not in widget:
              widget = "import { formatMinutesDuration } from './duration'\n" + widget
          widget, count = re.subn(
              r'\$\{([^{}\n]+)\}\s*分钟后开始',
              r'${formatMinutesDuration(\1)}后开始',
              widget,
          )
          if count != 1:
              matches = [line for line in widget.splitlines() if '分钟后开始' in line]
              raise SystemExit(f'upcoming duration: expected one replacement, found {count}; lines={matches}')
          widget_path.write_text(widget, encoding='utf-8')

          flow_path = Path('src/time-flow.ts')
          flow = flow_path.read_text(encoding='utf-8')
          if "from './duration'" not in flow:
              flow = "import { formatMinutesDuration } from './duration'\n" + flow
          flow, count = re.subn(
              r"countdown\.textContent\s*=\s*`还剩\s*\$\{Math\.max\(0,\s*minutesUntilEnd\)\}\s*分钟`",
              "countdown.textContent = `还剩 ${formatMinutesDuration(minutesUntilEnd)}`",
              flow,
          )
          if count != 1:
              matches = [line for line in flow.splitlines() if '还剩' in line]
              raise SystemExit(f'current duration: expected one replacement, found {count}; lines={matches}')
          flow_path.write_text(flow, encoding='utf-8')

          page_path = Path('src/widget-page.ts')
          page = page_path.read_text(encoding='utf-8')
          page = replace_once(
              page,
              """const COURSE_SHARED_TEXT_MOVE_MS = 980
          const COURSE_CARD_FORM_MS = 980
          const COURSE_TEXT_HANDOFF_MS = 110""",
              """const COURSE_SHARED_TEXT_MOVE_MS = 1120
          const COURSE_CARD_FORM_MS = 1120
          const COURSE_LINE_REVEAL_MS = 820
          const COURSE_TEXT_HANDOFF_MS = 90""",
              'transition timing',
          )

          helper_marker = "function elementText(root: ParentNode | null, selector: string) {"
          helper = """function prepareLineReveal(element: HTMLElement) {
            const copy = document.createElement('span')
            copy.className = 'course-line-reveal-copy'
            copy.textContent = element.textContent ?? ''
            const stroke = document.createElement('span')
            stroke.className = 'course-line-reveal-stroke'
            element.replaceChildren(stroke, copy)
            element.classList.add('course-line-reveal')
            return { root: element, stroke, copy }
          }

          """
          page = replace_once(page, helper_marker, helper + helper_marker, 'line reveal helper')

          page = replace_once(
              page,
              """  const sourceTitle = sharedSource.querySelector<HTMLElement>('strong')
          const sourceLocation = sharedSource.querySelector<HTMLElement>('small')
          const targetTitle = targetPrimary.querySelector<HTMLElement>('h2')
          const targetLocation = targetPrimary.querySelector<HTMLElement>('.course-location')
          const titleMotion = sharedTextMotion(sourceTitle, targetTitle)
          const locationMotion = sharedTextMotion(sourceLocation, targetLocation)
          const sharedMotions = [titleMotion, locationMotion].filter((motion): motion is NonNullable<typeof motion> => Boolean(motion))""",
              """  const sourceTitle = sharedSource.querySelector<HTMLElement>('strong')
          const sourceLocation = sharedSource.querySelector<HTMLElement>('small')
          const sourceTime = sharedSource.querySelector<HTMLElement>('time')
          const targetTitle = targetPrimary.querySelector<HTMLElement>('h2')
          const targetLocation = targetPrimary.querySelector<HTMLElement>('.course-location')
          const targetTime = targetPrimary.querySelector<HTMLElement>('.course-time')
          const titleMotion = sharedTextMotion(sourceTitle, targetTitle)
          const locationMotion = sharedTextMotion(sourceLocation, targetLocation)
          const timeMotion = sharedTextMotion(sourceTime, targetTime)
          const sharedMotions = [titleMotion, locationMotion, timeMotion]
            .filter((motion): motion is NonNullable<typeof motion> => Boolean(motion))""",
              'shared semantic elements',
          )

          page = replace_once(
              page,
              """  const targetCopies = Array.from(targetLayer.querySelectorAll<HTMLElement>('h2, .course-location'))
          targetCopies.forEach((copy) => copy.classList.add('is-shared-copy-hidden'))
          const targetRevealParts = Array.from(targetLayer.querySelectorAll<HTMLElement>(
            '.focus-kicker, .course-date, .course-time, .countdown, .course-flow',
          ))
          targetRevealParts.forEach((part) => {
            part.style.opacity = '0'
            part.style.transform = 'translateY(8px)'
            part.style.filter = 'blur(2px)'
          })""",
              """  const targetTitleCopy = targetLayer.querySelector<HTMLElement>('h2')
          const targetLocationCopy = targetLayer.querySelector<HTMLElement>('.course-location')
          const targetTimeCopy = targetLayer.querySelector<HTMLElement>('.course-time')
          const fullTargetTime = targetTimeCopy?.textContent?.trim() ?? ''
          const [targetStartTime = '', ...targetEndParts] = fullTargetTime.split(/[–-]/)
          const targetEndTime = targetEndParts.join('–').trim()
          let targetTimePrefix: HTMLElement | null = null
          let targetTimeExtension: HTMLElement | null = null
          if (targetTimeCopy && targetStartTime) {
            targetTimePrefix = document.createElement('span')
            targetTimePrefix.className = 'course-time-shared-prefix is-shared-copy-hidden'
            targetTimePrefix.textContent = targetStartTime.trim()
            targetTimeExtension = document.createElement('span')
            targetTimeExtension.className = 'course-time-extension'
            targetTimeExtension.textContent = targetEndTime ? `–${targetEndTime}` : ''
            targetTimeCopy.replaceChildren(targetTimePrefix, targetTimeExtension)
          }
          const targetCopies = [targetTitleCopy, targetLocationCopy, targetTimePrefix]
            .filter((copy): copy is HTMLElement => Boolean(copy))
          targetCopies.forEach((copy) => copy.classList.add('is-shared-copy-hidden'))
          const lineRevealParts = Array.from(targetLayer.querySelectorAll<HTMLElement>('.focus-kicker, .countdown'))
            .map(prepareLineReveal)
          const softRevealParts = Array.from(targetLayer.querySelectorAll<HTMLElement>('.course-date, .course-flow'))
          lineRevealParts.forEach(({ stroke, copy }) => {
            stroke.style.opacity = '.28'
            stroke.style.transform = 'scaleX(.08)'
            copy.style.opacity = '0'
            copy.style.clipPath = 'inset(0 100% 0 0)'
          })
          softRevealParts.forEach((part) => {
            part.style.opacity = '0'
            part.style.clipPath = 'inset(0 100% 0 0)'
            part.style.transform = 'translateY(5px)'
          })
          if (targetTimeExtension) {
            targetTimeExtension.style.opacity = '0'
            targetTimeExtension.style.clipPath = 'inset(0 100% 0 0)'
          }""",
              'target reveal structure',
          )

          old_parallel = """    ...targetRevealParts.map((part, index) => animateElement(part, [
              { opacity: 0, transform: 'translateY(8px)', filter: 'blur(2px)' },
              { offset: .28, opacity: 0, transform: 'translateY(7px)', filter: 'blur(1.8px)' },
              { opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' },
            ], {
              duration: Math.max(520, COURSE_CARD_FORM_MS - index * 35),
              delay: 120 + index * 45,
              easing: 'cubic-bezier(.16, 1, .3, 1)',
              fill: 'both',
            })),"""
          new_parallel = """    ...(targetTimeExtension ? [animateElement(targetTimeExtension, [
              { opacity: .08, clipPath: 'inset(0 100% 0 0)', transform: 'translateX(-2px)' },
              { offset: .48, opacity: .45, clipPath: 'inset(0 42% 0 0)', transform: 'translateX(-1px)' },
              { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateX(0)' },
            ], {
              duration: COURSE_LINE_REVEAL_MS,
              delay: 230,
              easing: 'cubic-bezier(.16, 1, .3, 1)',
              fill: 'both',
            })] : []),
            ...lineRevealParts.flatMap(({ stroke, copy }, index) => [
              animateElement(stroke, [
                { opacity: .22, transform: 'scaleX(.08)' },
                { offset: .58, opacity: .56, transform: 'scaleX(1)' },
                { opacity: 0, transform: 'scaleX(1)' },
              ], {
                duration: COURSE_LINE_REVEAL_MS,
                delay: 180 + index * 80,
                easing: 'cubic-bezier(.22, 1, .36, 1)',
                fill: 'both',
              }),
              animateElement(copy, [
                { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateY(2px)' },
                { offset: .34, opacity: .14, clipPath: 'inset(0 76% 0 0)', transform: 'translateY(1px)' },
                { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateY(0)' },
              ], {
                duration: COURSE_LINE_REVEAL_MS,
                delay: 250 + index * 80,
                easing: 'cubic-bezier(.16, 1, .3, 1)',
                fill: 'both',
              }),
            ]),
            ...softRevealParts.map((part, index) => animateElement(part, [
              { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateY(5px)' },
              { offset: .4, opacity: .22, clipPath: 'inset(0 64% 0 0)', transform: 'translateY(3px)' },
              { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateY(0)' },
            ], {
              duration: COURSE_LINE_REVEAL_MS,
              delay: 300 + index * 70,
              easing: 'cubic-bezier(.16, 1, .3, 1)',
              fill: 'both',
            })),"""
          page = replace_once(page, old_parallel, new_parallel, 'parallel line reveals')

          page = replace_once(
              page,
              """  targetRevealParts.forEach((part) => {
            clearElementAnimations(part)
            part.style.removeProperty('opacity')
            part.style.removeProperty('transform')
            part.style.removeProperty('filter')
          })""",
              """  lineRevealParts.forEach(({ root, stroke, copy }) => {
            clearElementAnimations(stroke)
            clearElementAnimations(copy)
            root.classList.remove('course-line-reveal')
            root.textContent = copy.textContent ?? ''
          })
          softRevealParts.forEach((part) => {
            clearElementAnimations(part)
            part.style.removeProperty('opacity')
            part.style.removeProperty('clip-path')
            part.style.removeProperty('transform')
          })
          if (targetTimeExtension) clearElementAnimations(targetTimeExtension)
          if (targetTimeCopy) targetTimeCopy.textContent = fullTargetTime""",
              'line reveal cleanup',
          )
          page_path.write_text(page, encoding='utf-8')

          css_path = Path('src/widget-page.css')
          css = css_path.read_text(encoding='utf-8')
          css = replace_once(
              css,
              """.following.is-promoting-course .timeline::before,
          .following.is-promoting-course .is-promoting-source::after,
          .following.is-promoting-course .is-promoting-source > time {
            opacity: 0;
          }""",
              """.following.is-promoting-course .timeline::before,
          .following.is-promoting-course .is-promoting-source::after {
            opacity: 0;
          }""",
              'preserve shared start time',
          )
          css = replace_once(
              css,
              """.is-promoting-source strong,
          .is-promoting-source small {""",
              """.is-promoting-source strong,
          .is-promoting-source small,
          .is-promoting-source > time {""",
              'shared source styles',
          )
          css_marker = ".is-course-transitioning .focus-course,"
          css_insert = """.course-time-shared-prefix,
          .course-time-extension {
            display: inline-block;
            transform-origin: left center;
          }

          .course-time-extension {
            will-change: clip-path, opacity, transform;
          }

          .course-line-reveal {
            position: relative;
            display: block;
            overflow: hidden;
          }

          .course-line-reveal-stroke,
          .course-line-reveal-copy {
            display: block;
          }

          .course-line-reveal-stroke {
            position: absolute;
            inset: 50% 0 auto;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, currentColor, rgba(var(--identity-accent-rgb), .18));
            transform-origin: left center;
            pointer-events: none;
            will-change: transform, opacity;
          }

          .course-line-reveal-copy {
            will-change: clip-path, opacity, transform;
          }

          """
          css = replace_once(css, css_marker, css_insert + css_marker, 'line reveal css')
          css_path.write_text(css, encoding='utf-8')

          check_path = Path('scripts/check-presentation-clock.mjs')
          check = check_path.read_text(encoding='utf-8')
          check = "import { formatMinutesDuration } from '../src/duration.ts'\n" + check
          check = replace_once(
              check,
              "assert.equal(snapshot.date.getMinutes(), 5)\n\nconst widgetSource",
              """assert.equal(snapshot.date.getMinutes(), 5)

          assert.equal(formatMinutesDuration(19), '19 分钟')
          assert.equal(formatMinutesDuration(60), '1 小时')
          assert.equal(formatMinutesDuration(96), '1 小时 36 分钟')
          assert.equal(formatMinutesDuration(120), '2 小时')

          const widgetSource""",
              'duration tests',
          )
          check = check.replace("COURSE_SHARED_TEXT_MOVE_MS = 980", "COURSE_SHARED_TEXT_MOVE_MS = 1120")
          check = check.replace("COURSE_CARD_FORM_MS = 980", "COURSE_CARD_FORM_MS = 1120")
          check = check.replace("COURSE_TEXT_HANDOFF_MS = 110", "COURSE_LINE_REVEAL_MS = 820/)\nassert.match(widgetPageSource, /COURSE_TEXT_HANDOFF_MS = 90")
          check = check.replace("assert.match(widgetPageSource, /targetRevealParts/)", """assert.match(widgetPageSource, /const sourceTime = sharedSource\\.querySelector<HTMLElement>\\('time'\\)/)
          assert.match(widgetPageSource, /const targetTime = targetPrimary\\.querySelector<HTMLElement>\\('\\.course-time'\\)/)
          assert.match(widgetPageSource, /course-time-extension/)
          assert.match(widgetPageSource, /prepareLineReveal/)
          assert.match(widgetPageSource, /lineRevealParts/)
          assert.match(widgetPageSource, /COURSE_LINE_REVEAL_MS/)""")
          check = check.replace("assert.match(widgetPageCss, /is-promoting-source > time/)", """assert.match(widgetPageCss, /is-promoting-source > time/)
          assert.match(widgetPageCss, /\\.course-time-extension/)
          assert.match(widgetPageCss, /\\.course-line-reveal-stroke/)
          assert.match(widgetPageCss, /will-change: clip-path, opacity, transform/)""")
          check = check.replace(
              "presentation clock, continuous semantic final-card handoff",
              "presentation clock, shared start-time growth and line-reveal final-card handoff",
          )
          check_path.write_text(check, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check line reveal handoff
        run: npm run check:presentation-clock

      - name: Build web interface
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/duration.ts src/widget.ts src/time-flow.ts src/widget-page.ts src/widget-page.css scripts/check-presentation-clock.mjs
          git diff --cached --check
          git commit -m "fix: reveal course details through shared line growth"
          git push origin HEAD:feat/time-replay-demo
