name: Patch PR 64 sequential course morph

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-sequential-course-morph:
    if: github.event.pull_request.number == 64 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Patch sequential course morph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          page_path = Path('src/widget-page.ts')
          page = page_path.read_text(encoding='utf-8')
          page = replace_once(
              page,
              """const COURSE_EXIT_MS = 1350
          const COURSE_MORPH_DELAY_MS = 320
          const COURSE_MORPH_TRAVEL_MS = 1750
          const COURSE_MORPH_CROSSFADE_MS = 780
          const COURSE_RESIZE_MS = 1000
          const COURSE_TRANSITION_SETTLE_MS = 420""",
              """const COURSE_EXIT_MS = 1100
          const COURSE_EXIT_GAP_MS = 140
          const COURSE_PREVIEW_MOVE_MS = 760
          const COURSE_SHELL_EXPAND_MS = 620
          const COURSE_PREVIEW_FADE_MS = 260
          const COURSE_CARD_REVEAL_MS = 440
          const COURSE_RESIZE_MS = 1000
          const COURSE_TRANSITION_SETTLE_MS = 420""",
              'transition constants',
          )
          page = replace_once(
              page,
              """function nextAnimationFrame() {
            return new Promise<void>((resolve) => window.requestAnimationFrame(() => resolve()))
          }

          function elementText""",
              """function nextAnimationFrame() {
            return new Promise<void>((resolve) => window.requestAnimationFrame(() => resolve()))
          }

          function transitionDelay(milliseconds: number) {
            return new Promise<void>((resolve) => window.setTimeout(resolve, milliseconds))
          }

          function elementText""",
              'transition delay helper',
          )

          start_marker = "  if (sharedSource && targetPrimary?.classList.contains('focus-course')) {"
          end_marker = "  } else {"
          start = page.index(start_marker)
          end = page.index(end_marker, start)
          shared_block = """  if (sharedSource && targetPrimary?.classList.contains('focus-course')) {
            await animateElement(outgoingPrimary, [
              { opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0)' },
              { offset: .48, opacity: .84, transform: 'translateY(-13px) scale(.993)', filter: 'blur(.8px)' },
              { opacity: 0, transform: 'translateY(-54px) scale(.968)', filter: 'blur(5px)' },
            ], { duration: COURSE_EXIT_MS, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'both' })
            if (token !== transitionToken) return

            await transitionDelay(COURSE_EXIT_GAP_MS)
            if (token !== transitionToken) return

            const stageRect = stage.getBoundingClientRect()
            const sourceRect = sharedSource.getBoundingClientRect()
            const targetRect = targetPrimary.getBoundingClientRect()
            const targetStyle = getComputedStyle(targetPrimary)
            const targetInsetX = Number.parseFloat(targetStyle.paddingLeft) || 0
            const targetInsetY = Number.parseFloat(targetStyle.paddingTop) || 0
            const morph = document.createElement('div')
            morph.className = 'course-shared-morph'
            morph.style.left = `${sourceRect.left - stageRect.left}px`
            morph.style.top = `${sourceRect.top - stageRect.top}px`
            morph.style.width = `${sourceRect.width}px`
            morph.style.height = `${sourceRect.height}px`
            morph.style.borderRadius = '8px'
            morph.style.opacity = '1'

            const surface = targetPrimary.cloneNode(false) as HTMLElement
            surface.classList.add('course-morph-surface')
            surface.style.opacity = '0'
            const sourceLayer = document.createElement('ol')
            sourceLayer.className = 'timeline course-morph-source'
            sourceLayer.style.width = `${sourceRect.width}px`
            sourceLayer.style.height = `${sourceRect.height}px`
            sourceLayer.style.opacity = '1'
            sourceLayer.append(sharedSource.cloneNode(true))
            const targetLayer = targetPrimary.cloneNode(true) as HTMLElement
            targetLayer.classList.add('course-morph-target')
            targetLayer.style.opacity = '0'
            morph.append(surface, sourceLayer, targetLayer)

            sharedSource.classList.add('is-shared-course-source')
            stage.append(morph)

            const deltaX = targetRect.left - sourceRect.left
            const deltaY = targetRect.top - sourceRect.top
            const targetRadius = getComputedStyle(targetPrimary).borderRadius

            await Promise.all([
              animateElement(morph, [
                { transform: 'translate3d(0, 0, 0)' },
                { offset: .18, transform: 'translate3d(0, -4px, 0)' },
                { transform: `translate3d(${deltaX}px, ${deltaY}px, 0)` },
              ], { duration: COURSE_PREVIEW_MOVE_MS, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'both' }),
              animateElement(outgoingSecondary, [
                { opacity: 1, transform: 'translateY(0)' },
                { offset: .35, opacity: .9, transform: 'translateY(-2px)' },
                { opacity: 0, transform: 'translateY(-12px)' },
              ], { duration: COURSE_PREVIEW_MOVE_MS - 80, delay: 80, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'both' }),
            ])
            if (token !== transitionToken) return

            await Promise.all([
              animateElement(morph, [
                {
                  transform: `translate3d(${deltaX}px, ${deltaY}px, 0)`,
                  width: `${sourceRect.width}px`,
                  height: `${sourceRect.height}px`,
                  borderRadius: '8px',
                },
                {
                  offset: .48,
                  transform: `translate3d(${deltaX}px, ${deltaY}px, 0)`,
                  width: `${targetRect.width}px`,
                  height: `${sourceRect.height}px`,
                  borderRadius: targetRadius,
                },
                {
                  transform: `translate3d(${deltaX}px, ${deltaY}px, 0)`,
                  width: `${targetRect.width}px`,
                  height: `${targetRect.height}px`,
                  borderRadius: targetRadius,
                },
              ], { duration: COURSE_SHELL_EXPAND_MS, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'both' }),
              animateElement(surface, [
                { opacity: 0 },
                { offset: .42, opacity: 0 },
                { offset: .72, opacity: .55 },
                { opacity: 1 },
              ], { duration: COURSE_SHELL_EXPAND_MS, easing: 'ease-out', fill: 'both' }),
              animateElement(sourceLayer, [
                { transform: 'translate3d(0, 0, 0)' },
                { transform: `translate3d(${targetInsetX}px, ${targetInsetY}px, 0)` },
              ], { duration: COURSE_SHELL_EXPAND_MS, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'both' }),
            ])
            if (token !== transitionToken) return

            await animateElement(sourceLayer, [
              { opacity: 1, transform: `translate3d(${targetInsetX}px, ${targetInsetY}px, 0)`, filter: 'blur(0)' },
              { opacity: 0, transform: `translate3d(${targetInsetX}px, ${targetInsetY - 4}px, 0)`, filter: 'blur(1.8px)' },
            ], { duration: COURSE_PREVIEW_FADE_MS, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'both' })
            if (token !== transitionToken) return

            await animateElement(targetLayer, [
              { opacity: 0, transform: 'translateY(8px) scale(.985)', filter: 'blur(2.4px)' },
              { offset: .4, opacity: .28, transform: 'translateY(5px) scale(.99)', filter: 'blur(1.4px)' },
              { opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0)' },
            ], { duration: COURSE_CARD_REVEAL_MS, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' })
            if (token !== transitionToken) return
          """
          page = page[:start] + shared_block + page[end:]
          page_path.write_text(page, encoding='utf-8')

          check_path = Path('scripts/check-presentation-clock.mjs')
          check = check_path.read_text(encoding='utf-8')
          check = replace_once(
              check,
              """assert.match(widgetPageSource, /COURSE_EXIT_MS = 1350/)
          assert.match(widgetPageSource, /COURSE_MORPH_DELAY_MS = 320/)
          assert.match(widgetPageSource, /COURSE_MORPH_TRAVEL_MS = 1750/)
          assert.match(widgetPageSource, /COURSE_MORPH_CROSSFADE_MS = 780/)
          assert.doesNotMatch(widgetPageSource, /COURSE_MORPH_MS =/)""",
              """assert.match(widgetPageSource, /COURSE_EXIT_MS = 1100/)
          assert.match(widgetPageSource, /COURSE_EXIT_GAP_MS = 140/)
          assert.match(widgetPageSource, /COURSE_PREVIEW_MOVE_MS = 760/)
          assert.match(widgetPageSource, /COURSE_SHELL_EXPAND_MS = 620/)
          assert.match(widgetPageSource, /COURSE_PREVIEW_FADE_MS = 260/)
          assert.match(widgetPageSource, /COURSE_CARD_REVEAL_MS = 440/)
          assert.doesNotMatch(widgetPageSource, /COURSE_MORPH_(?:DELAY|TRAVEL|CROSSFADE|MS)/)""",
              'timing assertions',
          )
          check = replace_once(
              check,
              """assert.match(widgetPageSource, /animateElement\\(morph,[\\s\\S]*duration: COURSE_MORPH_TRAVEL_MS/)
          assert.match(widgetPageSource, /animateElement\\(sourceLayer,[\\s\\S]*duration: COURSE_MORPH_CROSSFADE_MS/)
          assert.match(widgetPageSource, /animateElement\\(targetLayer,[\\s\\S]*duration: COURSE_MORPH_CROSSFADE_MS/)""",
              """assert.match(widgetPageSource, /await animateElement\\(outgoingPrimary,[\\s\\S]*duration: COURSE_EXIT_MS[\\s\\S]*await transitionDelay\\(COURSE_EXIT_GAP_MS\\)[\\s\\S]*const stageRect/)
          assert.match(widgetPageSource, /animateElement\\(morph,[\\s\\S]*duration: COURSE_PREVIEW_MOVE_MS/)
          assert.match(widgetPageSource, /animateElement\\(morph,[\\s\\S]*width: `\\$\\{targetRect\\.width\\}px`[\\s\\S]*duration: COURSE_SHELL_EXPAND_MS/)
          assert.match(widgetPageSource, /await animateElement\\(sourceLayer,[\\s\\S]*duration: COURSE_PREVIEW_FADE_MS[\\s\\S]*await animateElement\\(targetLayer,[\\s\\S]*duration: COURSE_CARD_REVEAL_MS/)
          assert.match(widgetPageSource, /targetInsetX/)
          assert.match(widgetPageSource, /targetInsetY/)""",
              'sequential phase assertions',
          )
          check = check.replace(
              'continuous two-stage shared-course morphs',
              'sequential three-stage shared-course morphs',
          )
          check_path.write_text(check, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check sequential course morph
        run: npm run check:presentation-clock

      - name: Build web interface
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/widget-page.ts scripts/check-presentation-clock.mjs
          git diff --cached --check
          git commit -m "fix: sequence preview promotion after course exit"
          git push origin HEAD:feat/time-replay-demo
