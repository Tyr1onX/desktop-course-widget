name: Patch PR 64 stable shell handoff

on:
  push:
    branches: [feat/time-replay-demo]

permissions:
  contents: write

jobs:
  patch-stable-shell-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Apply single-shell handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          widget_path = Path('src/widget.ts')
          widget = widget_path.read_text(encoding='utf-8')
          if '<div class="widget-body">' not in widget:
              widget = widget.replace(
                  '    </header>\n',
                  '    </header>\n    <div class="widget-body">\n',
                  1,
              )
              closing = '    ${followingMarkup(visibleFollowing, model.following.length)}\n  `'
              if closing not in widget:
                  raise SystemExit('widget body closing anchor missing')
              widget = widget.replace(
                  closing,
                  '    ${followingMarkup(visibleFollowing, model.following.length)}\n    </div>\n  `',
                  1,
              )
          widget_path.write_text(widget, encoding='utf-8')

          page_path = Path('src/widget-page.ts')
          source = page_path.read_text(encoding='utf-8')
          source = source.replace(
              'const COURSE_EXIT_MS = 2400\nconst COURSE_OVERLAP_DELAY_MS = 760\nconst COURSE_ENTER_MS = 2600\nconst COURSE_TRANSITION_SETTLE_MS = 700',
              'const COURSE_EXIT_MS = 2400\nconst COURSE_OVERLAP_DELAY_MS = 760\nconst COURSE_ENTER_MS = 2600\nconst COURSE_RESIZE_MS = 1100\nconst COURSE_TRANSITION_SETTLE_MS = 500',
              1,
          )
          source = source.replace(
              "function transitionPrimary(widget: HTMLElement | null) {\n  return widget?.querySelector<HTMLElement>('.focus-course, .state-label, .empty-state, .opening-date') ?? null\n}\n\nfunction transitionSecondary(widget: HTMLElement | null) {\n  return widget?.querySelector<HTMLElement>('.following') ?? null\n}",
              "function transitionPrimary(root: ParentNode | null) {\n  return root?.querySelector<HTMLElement>('.focus-course, .state-label, .empty-state, .opening-date') ?? null\n}\n\nfunction transitionSecondary(root: ParentNode | null) {\n  return root?.querySelector<HTMLElement>('.following') ?? null\n}",
              1,
          )

          helper_start = source.index('function resetHandoffWidget(')
          helper_end = source.index('\nfunction clearCourseTransition()', helper_start)
          helpers = '''function resetHandoffBody(body: HTMLElement) {
            body.classList.remove('is-handoff-outgoing', 'is-handoff-incoming')
            resetPreparedElement(transitionPrimary(body))
            resetPreparedElement(transitionSecondary(body))
          }

          function collapseHandoffStage() {
            const stage = app.querySelector<HTMLElement>('.widget-body-handoff')
            if (!stage) return
            const incoming = stage.querySelector<HTMLElement>('.widget-body.is-handoff-incoming')
            const outgoing = stage.querySelector<HTMLElement>('.widget-body.is-handoff-outgoing')
            const keeper = incoming ?? outgoing
            if (!keeper) {
              stage.remove()
              return
            }
            resetHandoffBody(keeper)
            stage.replaceWith(keeper)
          }
          '''
          source = source[:helper_start] + helpers + source[helper_end:]
          source = source.replace('  collapseHandoffLayers()\n', '  collapseHandoffStage()\n', 1)

          handoff_start = source.index('async function runCourseHandoff(')
          handoff_end = source.index('\nfunction renderWidget', handoff_start)
          handoff = '''async function runCourseHandoff(
            token: number,
            currentWidget: HTMLElement,
            nextWidget: HTMLElement,
            resumeAfterTransition: boolean,
          ) {
            const currentBody = currentWidget.querySelector<HTMLElement>('.widget-body')
            const nextBody = nextWidget.querySelector<HTMLElement>('.widget-body')
            if (!currentBody || !nextBody) {
              syncStableWidget(currentWidget, nextWidget)
              finishCourseTransition(token, resumeAfterTransition)
              return
            }

            const currentHeight = currentBody.getBoundingClientRect().height
            const stage = document.createElement('div')
            stage.className = 'widget-body-handoff'
            stage.style.height = `${currentHeight}px`

            const outgoingPrimary = transitionPrimary(currentBody)
            const outgoingSecondary = transitionSecondary(currentBody)
            const incomingPrimary = transitionPrimary(nextBody)
            const incomingSecondary = transitionSecondary(nextBody)

            prepareIncomingElement(incomingPrimary)
            prepareIncomingElement(incomingSecondary, true)
            currentBody.classList.add('is-handoff-outgoing')
            nextBody.classList.add('is-handoff-incoming')
            currentBody.replaceWith(stage)
            stage.append(currentBody, nextBody)

            await Promise.all([
              animateElement(outgoingPrimary, [
                { offset: 0, opacity: 1, transform: 'translateY(0) translateZ(0) scale(1)', filter: 'blur(0) brightness(1) saturate(1)' },
                { offset: .24, opacity: .98, transform: 'translateY(-2px) translateZ(-8px) scale(.992)', filter: 'blur(.3px) brightness(.99) saturate(.99)' },
                { offset: .66, opacity: .48, transform: 'translateY(-23px) translateZ(-62px) scale(.91)', filter: 'blur(4px) brightness(.82) saturate(.88)' },
                { offset: 1, opacity: 0, transform: 'translateY(-52px) translateZ(-128px) scale(.8)', filter: 'blur(12px) brightness(.6) saturate(.7)' },
              ], { duration: COURSE_EXIT_MS, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'both' }),
              animateElement(outgoingSecondary, [
                { offset: 0, opacity: 1, transform: 'translateY(0) translateZ(0) scale(1)', filter: 'blur(0) brightness(1)' },
                { offset: .28, opacity: .96, transform: 'translateY(-2px) translateZ(-6px) scale(.99)', filter: 'blur(.2px) brightness(.99)' },
                { offset: 1, opacity: 0, transform: 'translateY(-30px) translateZ(-86px) scale(.88)', filter: 'blur(9px) brightness(.68)' },
              ], { duration: COURSE_EXIT_MS - 180, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'both' }),
              animateElement(incomingPrimary, [
                { offset: 0, opacity: 0, transform: 'translateY(46px) translateZ(-120px) scale(.78)', filter: 'blur(13px) brightness(.58) saturate(.72)' },
                { offset: .22, opacity: .16, transform: 'translateY(36px) translateZ(-86px) scale(.84)', filter: 'blur(10px) brightness(.68) saturate(.8)' },
                { offset: .62, opacity: .8, transform: 'translateY(8px) translateZ(-10px) scale(1.02)', filter: 'blur(2px) brightness(1.04) saturate(1.02)' },
                { offset: .84, opacity: 1, transform: 'translateY(-2px) translateZ(2px) scale(1.012)', filter: 'blur(0) brightness(1.015) saturate(1)' },
                { offset: 1, opacity: 1, transform: 'translateY(0) translateZ(0) scale(1)', filter: 'blur(0) brightness(1) saturate(1)' },
              ], { duration: COURSE_ENTER_MS, delay: COURSE_OVERLAP_DELAY_MS, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' }),
              animateElement(incomingSecondary, [
                { offset: 0, opacity: 0, transform: 'translateY(26px) translateZ(-70px) scale(.93)', filter: 'blur(8px) brightness(.74)' },
                { offset: .58, opacity: .74, transform: 'translateY(5px) translateZ(-4px) scale(1.01)', filter: 'blur(1.5px) brightness(1.02)' },
                { offset: 1, opacity: 1, transform: 'translateY(0) translateZ(0) scale(1)', filter: 'blur(0) brightness(1)' },
              ], { duration: COURSE_ENTER_MS - 320, delay: COURSE_OVERLAP_DELAY_MS + 180, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' }),
            ])
            if (token !== transitionToken) return

            currentBody.remove()
            resetHandoffBody(nextBody)
            stage.replaceChildren(nextBody)
            stage.classList.add('is-size-settling')

            const currentHeader = currentWidget.querySelector<HTMLElement>('.widget-header')
            const nextHeader = nextWidget.querySelector<HTMLElement>('.widget-header')
            if (currentHeader && nextHeader) syncNode(currentHeader, nextHeader)

            const targetHeight = nextBody.getBoundingClientRect().height
            await animateElement(stage, [
              { height: `${currentHeight}px` },
              { height: `${targetHeight}px` },
            ], {
              duration: COURSE_RESIZE_MS,
              easing: 'cubic-bezier(.22, 1, .36, 1)',
              fill: 'both',
            })
            if (token !== transitionToken) return

            stage.style.removeProperty('height')
            stage.replaceWith(nextBody)
            finishCourseTransition(token, resumeAfterTransition)
          }
          '''
          source = source[:handoff_start] + handoff + source[handoff_end:]
          source = source.replace(
              '    app.replaceChildren(nextWidget)\n    finishCourseTransition(token, resumeAfterTransition)',
              '    collapseHandoffStage()\n    syncStableWidget(currentWidget, nextWidget)\n    finishCourseTransition(token, resumeAfterTransition)',
              1,
          )
          page_path.write_text(source, encoding='utf-8')

          css_path = Path('src/widget-page.css')
          css = css_path.read_text(encoding='utf-8')
          css_start = css.index('.is-presentation-replay .course-widget {')
          css_end = css.index('.is-course-transitioning .focus-course,', css_start)
          shell_css = '''.widget-body {
            display: flow-root;
          }

          .is-course-transitioning .course-widget {
            overflow: hidden;
            pointer-events: none;
            transform-style: preserve-3d;
          }

          .widget-body-handoff {
            position: relative;
            inline-size: 100%;
            overflow: hidden;
          }

          .widget-body-handoff > .widget-body {
            position: absolute;
            inset: 0 0 auto;
            inline-size: 100%;
          }

          .widget-body-handoff > .widget-body.is-handoff-incoming { z-index: 1; }
          .widget-body-handoff > .widget-body.is-handoff-outgoing { z-index: 2; }

          .widget-body-handoff.is-size-settling > .widget-body {
            position: relative;
            inset: auto;
            z-index: auto;
          }

          '''
          css = css[:css_start] + shell_css + css[css_end:]
          css_path.write_text(css, encoding='utf-8')

          check_path = Path('scripts/check-presentation-clock.mjs')
          check = check_path.read_text(encoding='utf-8')
          if '/<div class=\\"widget-body\\">/' not in check:
              anchor = "assert.match(widgetSource, /const today = startOfDay\\(options\\.now \\?\\? new Date\\(\\)\\)/)"
              check = check.replace(anchor, anchor + '\nassert.match(widgetSource, /<div class=\\"widget-body\\">/)', 1)

          block_start = check.index('assert.match(widgetPageSource, /COURSE_EXIT_MS = 2400/)')
          block_end = check.index('assert.doesNotMatch(widgetPageSource, /startViewTransition/)', block_start)
          page_checks = '''assert.match(widgetPageSource, /COURSE_EXIT_MS = 2400/)
          assert.match(widgetPageSource, /COURSE_OVERLAP_DELAY_MS = 760/)
          assert.match(widgetPageSource, /COURSE_ENTER_MS = 2600/)
          assert.match(widgetPageSource, /COURSE_RESIZE_MS = 1100/)
          assert.match(widgetPageSource, /COURSE_TRANSITION_SETTLE_MS = 500/)
          assert.match(widgetPageSource, /function courseIdentityKey/)
          assert.doesNotMatch(widgetPageSource, /const phase =/)
          assert.match(widgetPageSource, /if \\(currentWidget && !courseChanged\\)/)
          assert.match(widgetPageSource, /currentBody\\.replaceWith\\(stage\\)/)
          assert.match(widgetPageSource, /stage\\.append\\(currentBody, nextBody\\)/)
          assert.match(widgetPageSource, /stage\\.classList\\.add\\('is-size-settling'\\)/)
          assert.match(widgetPageSource, /height: `\\$\\{targetHeight\\}px`/)
          assert.match(widgetPageSource, /stage\\.replaceWith\\(nextBody\\)/)
          assert.doesNotMatch(widgetPageSource, /app\\.append\\(nextWidget\\)/)
          '''
          check = check[:block_start] + page_checks + check[block_end:]

          css_start = check.index('assert.match(widgetPageCss, /perspective: 1000px/)')
          css_end = check.index('assert.doesNotMatch(widgetPageCss, /::view-transition/)', css_start)
          css_checks = '''assert.match(widgetPageCss, /perspective: 1000px/)
          assert.match(widgetPageCss, /\\.widget-body \\{[\\s\\S]*display: flow-root/)
          assert.match(widgetPageCss, /\\.widget-body-handoff/)
          assert.match(widgetPageCss, /position: absolute/)
          assert.match(widgetPageCss, /is-size-settling/)
          assert.match(widgetPageCss, /animation: none !important/)
          assert.match(widgetPageCss, /will-change: opacity, transform, filter/)
          assert.doesNotMatch(widgetPageCss, /0 18px 55px/)
          assert.doesNotMatch(widgetPageCss, /background: transparent !important/)
          '''
          check = check[:css_start] + css_checks + check[css_end:]
          check_path.write_text(check, encoding='utf-8')
          PY

      - name: Commit application patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/widget.ts src/widget-page.ts src/widget-page.css scripts/check-presentation-clock.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep widget shell stable during course handoff"
          git push origin HEAD:feat/time-replay-demo
