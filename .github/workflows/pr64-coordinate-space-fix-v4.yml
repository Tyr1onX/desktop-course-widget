name: Apply and build PR 64 coordinate-space fix v4

on:
  push:
    branches:
      - feat/time-replay-demo

permissions:
  contents: write

jobs:
  patch-and-check:
    if: "${{ github.event.head_commit.message != 'fix: keep course handoff in one coordinate space' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Correct wipe replacement and apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_pr64_coordinate_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '        r"\\1targetRect.left - stageRect.left\\2targetRect.top - stageRect.top\\3",'
          new = '''        """Object.assign(wipe.style, {
                left: `${targetRect.left - stageRect.left}px`,
                top: `${targetRect.top - stageRect.top}px`""",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected broken replacement once, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python scripts/apply_pr64_coordinate_fix.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:presentation-clock
      - run: npm run check:time-flow
      - run: npm run check:version
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit targeted fix
        id: commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/widget-page.ts src/widget-page.css src/desktop-shell.ts scripts/check-presentation-clock.mjs
          git commit -m "fix: keep course handoff in one coordinate space"
          git push origin HEAD:feat/time-replay-demo
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: patch-and-check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch-and-check.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:presentation-clock
      - run: npm run check:time-flow
      - run: npm run tauri:build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-coordinate-space-fix
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
