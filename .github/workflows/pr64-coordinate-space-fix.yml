name: Fix and build PR 64 coordinate-space handoff

on:
  push:
    branches:
      - feat/time-replay-demo

permissions:
  contents: write

jobs:
  patch-and-check:
    if: "${{ github.event.head_commit.message != 'fix: keep course handoff in one coordinate space' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Apply coordinate-space and native resize fix
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, label: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              print(f'[patch] {label}: {count}')
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} replacement(s), found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          def replace_regex(path: str, pattern: str, replacement: str, label: str, flags: int = 0) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, lambda _: replacement, text, flags=flags)
              print(f'[patch] {label}: {count}')
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, found {count}')
              file.write_text(updated, encoding='utf-8')

          replace_regex(
              'src/widget-page.ts',
              r"function createCourseTransitionOverlay\(\) \{.*?\n\}",
              """function createCourseTransitionOverlay(stage: HTMLElement) {
            removeCourseTransitionOverlay()
            const overlay = document.createElement('div')
            overlay.className = 'course-transition-overlay'
            stage.append(overlay)
            return overlay
          }""",
              'stage-local overlay factory',
              re.S,
          )

          replace_exact(
              'src/widget-page.ts',
              """  const sourceRect = source.getBoundingClientRect()
            const targetRect = target.getBoundingClientRect()
            const sourceStyle = getComputedStyle(source)""",
              """  const sourceRect = source.getBoundingClientRect()
            const targetRect = target.getBoundingClientRect()
            const overlayRect = overlay.getBoundingClientRect()
            const sourceStyle = getComputedStyle(source)""",
              'overlay coordinate origin',
          )

          replace_exact(
              'src/widget-page.ts',
              """    left: `${sourceRect.left}px`,
              top: `${sourceRect.top}px`,""",
              """    left: `${sourceRect.left - overlayRect.left}px`,
              top: `${sourceRect.top - overlayRect.top}px`,""",
              'stage-relative shared text coordinates',
          )

          page = Path('src/widget-page.ts')
          text = page.read_text(encoding='utf-8')
          old_release = "document.documentElement.classList.remove('is-course-transitioning')"
          release_count = text.count(old_release)
          print(f'[patch] transition release calls: {release_count}')
          if release_count != 2:
              raise SystemExit(f'transition release calls: expected 2, found {release_count}')
          text = text.replace(old_release, 'releaseCourseTransitionWindow()')
          marker = 'function clearCourseTransition() {'
          if text.count(marker) != 1:
              raise SystemExit('clearCourseTransition marker missing')
          text = text.replace(marker, """function releaseCourseTransitionWindow() {
            document.documentElement.classList.remove('is-course-transitioning')
            window.dispatchEvent(new Event('course-transition:complete'))
          }

          function clearCourseTransition() {""")
          page.write_text(text, encoding='utf-8')

          replace_exact(
              'src/widget-page.ts',
              'let resizedDuringSharedHandoff = false',
              'let sharedHandoffCompleted = false',
              'shared handoff state name',
          )
          replace_exact(
              'src/widget-page.ts',
              'createCourseTransitionOverlay()',
              'createCourseTransitionOverlay(stage)',
              'stage-local overlay call',
          )
          replace_exact(
              'src/widget-page.ts',
              """      left: `${targetRect.left}px`,
              top: `${targetRect.top}px`,""",
              """      left: `${targetRect.left - stageRect.left}px`,
              top: `${targetRect.top - stageRect.top}px`,""",
              'stage-relative wipe coordinates',
          )

          replace_regex(
              'src/widget-page.ts',
              r"    await Promise\.all\(sharedMotions\.map\(\(motion\) => animateElement\(motion\.element, motion\.keyframes, \{.*?    resizedDuringSharedHandoff = true",
              """    await Promise.all([
              ...sharedMotions.map((motion) => animateElement(motion.element, motion.keyframes, {
                duration: COURSE_SHARED_MOVE_MS,
                easing: 'cubic-bezier(.2, .62, .18, 1)',
                fill: 'both',
              })),
              animateElement(surface, [
                { opacity: 0, clipPath: `inset(0 48% ${compactBottomInset}% 0 round ${targetStyle.borderRadius})` },
                { offset: .36, opacity: .24, clipPath: `inset(0 28% ${compactBottomInset * .7}% 0 round ${targetStyle.borderRadius})` },
                { opacity: 1, clipPath: `inset(0 0 0 0 round ${targetStyle.borderRadius})` },
              ], {
                duration: COURSE_SHELL_REVEAL_MS,
                easing: 'cubic-bezier(.22, 1, .36, 1)',
                fill: 'both',
              }),
            ])
            if (token !== transitionToken) return""",
              'move text and reveal shell in one stage-local phase',
              re.S,
          )

          replace_exact(
              'src/widget-page.ts',
              """    morph.remove()
            } else {""",
              """    morph.remove()
              sharedHandoffCompleted = true
            } else {""",
              'mark shared handoff complete',
          )
          replace_exact(
              'src/widget-page.ts',
              'if (resizedDuringSharedHandoff && nextFollowing)',
              'if (sharedHandoffCompleted && nextFollowing)',
              'following reveal condition',
          )

          replace_regex(
              'src/widget-page.ts',
              r"  if \(resizedDuringSharedHandoff\) \{.*?\n  \}\n\n  stage\.style\.removeProperty\('height'\)",
              """  await Promise.all([
            animateElement(stage, [
              { height: `${currentHeight}px` },
              { height: `${targetHeight}px` },
            ], {
              duration: COURSE_RESIZE_MS,
              easing: 'cubic-bezier(.22, 1, .36, 1)',
              fill: 'both',
            }),
            animateElement(nextFollowing, [
              {
                opacity: 0,
                transform: `translateY(${sharedHandoffCompleted ? 10 : 14}px)`,
              },
              { opacity: 1, transform: 'translateY(0)' },
            ], {
              duration: sharedHandoffCompleted ? 560 : 720,
              delay: sharedHandoffCompleted ? 80 : 140,
              easing: 'cubic-bezier(.16, 1, .3, 1)',
              fill: 'both',
            }),
          ])
            if (token !== transitionToken) return
            if (nextFollowing) {
              clearElementAnimations(nextFollowing)
              nextFollowing.style.removeProperty('opacity')
              nextFollowing.style.removeProperty('transform')
            }

            stage.style.removeProperty('height')""",
              'single post-handoff stage resize',
              re.S,
          )

          replace_regex(
              'src/widget-page.css',
              r"\.widget-body-handoff\.is-live-resizing \{ will-change: height; \}\n\n\.course-transition-overlay \{.*?\n\}",
              """.course-transition-overlay {
            position: absolute;
            z-index: 4;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
          }""",
              'stage-local clipped overlay CSS',
              re.S,
          )

          replace_exact(
              'src/desktop-shell.ts',
              """  let resizeFrame: number | undefined
            let sizePump: Promise<void> | undefined""",
              """  let resizeFrame: number | undefined
            let sizePump: Promise<void> | undefined
            let resizeDeferredForTransition = false""",
              'native resize deferral state',
          )
          replace_exact(
              'src/desktop-shell.ts',
              """  const applyHeight = async (height: number) => {
              if (lastAppliedHeight !== undefined && Math.abs(lastAppliedHeight - height) < 0.5) return""",
              """  const applyHeight = async (height: number) => {
              if (document.documentElement.classList.contains('is-course-transitioning')) {
                resizeDeferredForTransition = true
                return
              }
              if (lastAppliedHeight !== undefined && Math.abs(lastAppliedHeight - height) < 0.5) return""",
              'guard queued native resize',
          )
          replace_exact(
              'src/desktop-shell.ts',
              """  const queueSize = () => {
              if (resizeFrame !== undefined) cancelAnimationFrame(resizeFrame)""",
              """  const queueSize = () => {
              if (document.documentElement.classList.contains('is-course-transitioning')) {
                resizeDeferredForTransition = true
                return
              }
              if (resizeFrame !== undefined) cancelAnimationFrame(resizeFrame)""",
              'guard observed native resize',
          )
          replace_exact(
              'src/desktop-shell.ts',
              '  const observer = new ResizeObserver(queueSize)',
              """  const applyDeferredTransitionSize = () => {
              if (!resizeDeferredForTransition) return
              resizeDeferredForTransition = false
              queueSize()
            }

            window.addEventListener('course-transition:complete', applyDeferredTransitionSize)
            const observer = new ResizeObserver(queueSize)""",
              'one-shot post-transition resize listener',
          )
          replace_exact(
              'src/desktop-shell.ts',
              "window.addEventListener('beforeunload', () => { observer.disconnect(); unlistenScale() }, { once: true })",
              """window.addEventListener('beforeunload', () => {
              observer.disconnect()
              window.removeEventListener('course-transition:complete', applyDeferredTransitionSize)
              unlistenScale()
            }, { once: true })""",
              'resize listener cleanup',
          )

          replace_regex(
              'scripts/check-presentation-clock.mjs',
              r"assert\.match\(widgetPageSource, /function createCourseTransitionOverlay/\).*?assert\.match\(widgetPageSource, /type SharedTextMotion/\)",
              """assert.match(widgetPageSource, /function createCourseTransitionOverlay\(stage: HTMLElement\)/)
          assert.match(widgetPageSource, /function removeCourseTransitionOverlay/)
          assert.match(widgetPageSource, /stage\.append\(overlay\)/)
          assert.match(widgetPageSource, /const overlayRect = overlay\.getBoundingClientRect\(\)/)
          assert.match(widgetPageSource, /sourceRect\.left - overlayRect\.left/)
          assert.match(widgetPageSource, /sourceRect\.top - overlayRect\.top/)
          assert.match(widgetPageSource, /type SharedTextMotion/)""",
              'test stage-local overlay',
              re.S,
          )

          replace_regex(
              'scripts/check-presentation-clock.mjs',
              r"assert\.match\(widgetPageSource, /sharedTextMotion\\\(sourceTime, targetTimePrefix, overlay\\\)/\).*?'shared text must finish moving before the stage starts resizing',\n\)",
              """assert.match(widgetPageSource, /sharedTextMotion\(sourceTime, targetTimePrefix, overlay\)/)
          assert.match(widgetPageSource, /createCourseTransitionOverlay\(stage\)/)
          assert.match(widgetPageSource, /targetRect\.left - stageRect\.left/)
          assert.match(widgetPageSource, /targetRect\.top - stageRect\.top/)
          assert.match(widgetPageSource, /duration: COURSE_SHARED_MOVE_MS/)
          assert.match(widgetPageSource, /await Promise\.all\(\[\s*\.\.\.sharedMotions\.map[\s\S]*animateElement\(surface/)
          assert.doesNotMatch(widgetPageSource, /is-live-resizing/)
          assert.ok(
            widgetPageSource.lastIndexOf('removeCourseTransitionOverlay()') <
              widgetPageSource.indexOf("stage.classList.add('is-size-settling')"),
            'overlay text and final card must complete before the stage height changes',
          )""",
              'test corrected handoff order',
              re.S,
          )

          replace_exact(
              'scripts/check-presentation-clock.mjs',
              "assert.match(widgetPageSource, /removeCourseTransitionOverlay\\(\\)/)",
              """assert.match(widgetPageSource, /removeCourseTransitionOverlay\(\)/)
          assert.match(widgetPageSource, /window\.dispatchEvent\(new Event\('course-transition:complete'\)\)/)""",
              'test transition completion event',
          )

          replace_regex(
              'scripts/check-presentation-clock.mjs',
              r"assert\.match\(desktopShellSource, /let pendingHeight: number \\| undefined/\).*?assert\.match\(desktopShellSource, /await appWindow\\\.setSize/\)",
              """assert.match(desktopShellSource, /let pendingHeight: number \| undefined/)
          assert.match(desktopShellSource, /while \(pendingHeight !== undefined\)/)
          assert.match(desktopShellSource, /resizeDeferredForTransition/)
          assert.match(desktopShellSource, /classList\.contains\('is-course-transitioning'\)/)
          assert.match(desktopShellSource, /course-transition:complete/)
          assert.match(desktopShellSource, /applyDeferredTransitionSize/)
          assert.match(desktopShellSource, /await appWindow\.setSize/)""",
              'test native resize deferral',
              re.S,
          )

          replace_regex(
              'scripts/check-presentation-clock.mjs',
              r"assert\.match\(widgetPageCss, /\\\.course-transition-overlay/\)\nassert\.match\(widgetPageCss, /position: fixed/\)\nassert\.match\(widgetPageCss, /z-index: 2147483000/\)",
              """assert.match(widgetPageCss, /\.course-transition-overlay/)
          const transitionOverlayRule = /\.course-transition-overlay\s*\{([^}]*)\}/.exec(widgetPageCss)?.[1] ?? ''
          assert.match(transitionOverlayRule, /position: absolute/)
          assert.match(transitionOverlayRule, /overflow: hidden/)
          assert.doesNotMatch(transitionOverlayRule, /position: fixed|overflow: visible/)
          assert.match(transitionOverlayRule, /z-index: 4/)""",
              'test clipped overlay CSS',
          )

          replace_exact(
              'scripts/check-presentation-clock.mjs',
              "console.log('presentation clock, exact shared-time alignment, sequential shared-text then resize handoff, visible beam wipe reveal, duration formatting, controller, and widget wiring checks passed')",
              "console.log('presentation clock, stage-local shared text and shell handoff, deferred native window resize, visible beam wipe reveal, duration formatting, controller, and widget wiring checks passed')",
              'test summary',
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check presentation handoff
        run: npm run check:presentation-clock

      - name: Check time-flow model
        run: npm run check:time-flow

      - name: Check release version
        run: npm run check:version

      - name: Build web interface
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit targeted fix
        id: commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/widget-page.ts src/widget-page.css src/desktop-shell.ts scripts/check-presentation-clock.mjs
          git commit -m "fix: keep course handoff in one coordinate space"
          git push origin HEAD:feat/time-replay-demo
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: patch-and-check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out patched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch-and-check.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check presentation handoff
        run: npm run check:presentation-clock

      - name: Check time-flow model
        run: npm run check:time-flow

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-coordinate-space-fix
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
