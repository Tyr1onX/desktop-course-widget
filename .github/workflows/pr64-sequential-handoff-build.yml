name: Build PR 64 sequential handoff

on:
  push:
    branches:
      - feat/time-replay-demo

permissions:
  contents: write

jobs:
  patch-and-check:
    if: "${{ github.event.head_commit.message != 'fix: sequence shared text before course resize' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Apply sequential handoff cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/widget-page.ts',
              """const COURSE_SHARED_MOVE_MS = 2500
          const COURSE_SHELL_REVEAL_DELAY_MS = 1050
          const COURSE_SHELL_REVEAL_MS = 1050
          const COURSE_FINAL_WIPE_MS = 640
          const COURSE_FINAL_REVEAL_MS = 420
          const COURSE_TEXT_HANDOFF_MS = 420
          const COURSE_RESIZE_MS = 2500""",
              """const COURSE_SHARED_MOVE_MS = 2100
          const COURSE_SHELL_REVEAL_MS = 900
          const COURSE_FINAL_WIPE_MS = 760
          const COURSE_FINAL_REVEAL_MS = 420
          const COURSE_TEXT_HANDOFF_MS = 420
          const COURSE_RESIZE_MS = 1150""",
          )

          replace_once(
              'src/widget-page.ts',
              """    overlay.append(wipe)

              stage.classList.add('is-live-resizing')
              await Promise.all([
                ...sharedMotions.map((motion) => animateElement(motion.element, motion.keyframes, {
                  duration: COURSE_SHARED_MOVE_MS,
                  easing: 'cubic-bezier(.2, .62, .18, 1)',
                  fill: 'both',
                })),
                animateElement(stage, [
                  { height: `${currentHeight}px` },
                  { offset: .18, height: `${currentHeight}px` },
                  { height: `${targetBodyHeight}px` },
                ], {
                  duration: COURSE_RESIZE_MS,
                  easing: 'cubic-bezier(.2, .62, .18, 1)',
                  fill: 'both',
                }),
                (async () => {
                  await transitionDelay(COURSE_SHELL_REVEAL_DELAY_MS)
                  await animateElement(surface, [
                    { opacity: 0, clipPath: `inset(0 48% ${compactBottomInset}% 0 round ${targetStyle.borderRadius})` },
                    { offset: .36, opacity: .24, clipPath: `inset(0 28% ${compactBottomInset * .7}% 0 round ${targetStyle.borderRadius})` },
                    { opacity: 1, clipPath: `inset(0 0 0 0 round ${targetStyle.borderRadius})` },
                  ], {
                    duration: COURSE_SHELL_REVEAL_MS,
                    easing: 'cubic-bezier(.22, 1, .36, 1)',
                    fill: 'both',
                  })
                })(),
              ])
              if (token !== transitionToken) return
              resizedDuringSharedHandoff = true""",
              """    const wipeBeam = document.createElement('div')
              wipeBeam.className = 'course-final-wipe-beam'
              wipe.append(wipeBeam)
              overlay.append(wipe)

              await Promise.all(sharedMotions.map((motion) => animateElement(motion.element, motion.keyframes, {
                duration: COURSE_SHARED_MOVE_MS,
                easing: 'cubic-bezier(.2, .62, .18, 1)',
                fill: 'both',
              })))
              if (token !== transitionToken) return

              stage.classList.add('is-live-resizing')
              await Promise.all([
                animateElement(stage, [
                  { height: `${currentHeight}px` },
                  { height: `${targetBodyHeight}px` },
                ], {
                  duration: COURSE_RESIZE_MS,
                  easing: 'cubic-bezier(.2, .62, .18, 1)',
                  fill: 'both',
                }),
                animateElement(surface, [
                  { opacity: 0, clipPath: `inset(0 48% ${compactBottomInset}% 0 round ${targetStyle.borderRadius})` },
                  { offset: .36, opacity: .24, clipPath: `inset(0 28% ${compactBottomInset * .7}% 0 round ${targetStyle.borderRadius})` },
                  { opacity: 1, clipPath: `inset(0 0 0 0 round ${targetStyle.borderRadius})` },
                ], {
                  duration: COURSE_SHELL_REVEAL_MS,
                  easing: 'cubic-bezier(.22, 1, .36, 1)',
                  fill: 'both',
                }),
              ])
              if (token !== transitionToken) return
              resizedDuringSharedHandoff = true""",
          )

          replace_once(
              'src/widget-page.ts',
              """      animateElement(wipe, [
                  { opacity: 0, transform: 'translate3d(0, 0, 0) skewX(-12deg)' },
                  { offset: .1, opacity: .92, transform: 'translate3d(18%, 0, 0) skewX(-12deg)' },
                  { offset: .78, opacity: .9, transform: 'translate3d(250%, 0, 0) skewX(-12deg)' },
                  { opacity: 0, transform: 'translate3d(286%, 0, 0) skewX(-12deg)' },
                ], {
                  duration: COURSE_FINAL_WIPE_MS,
                  easing: 'cubic-bezier(.4, 0, .2, 1)',
                  fill: 'both',
                }),""",
              """      animateElement(wipe, [
                  { opacity: 0 },
                  { offset: .08, opacity: 1 },
                  { offset: .88, opacity: 1 },
                  { opacity: 0 },
                ], {
                  duration: COURSE_FINAL_WIPE_MS,
                  easing: 'linear',
                  fill: 'both',
                }),
                animateElement(wipeBeam, [
                  { transform: 'translate3d(-120%, 0, 0) skewX(-12deg)' },
                  { transform: 'translate3d(245%, 0, 0) skewX(-12deg)' },
                ], {
                  duration: COURSE_FINAL_WIPE_MS,
                  easing: 'cubic-bezier(.4, 0, .2, 1)',
                  fill: 'both',
                }),""",
          )

          replace_once(
              'src/widget-page.css',
              """.course-final-wipe::before {""",
              """.course-final-wipe-beam {""",
          )

          replace_once(
              'src/widget-page.css',
              """.course-final-wipe-beam {
            position: absolute;
            inset: -12% auto -12% -58%;""",
              """.course-final-wipe-beam {
            position: absolute;
            inset: -12% auto -12% 0;""",
          )

          replace_once(
              'src/widget-page.css',
              """  );
            content: '';
            filter: blur(.6px);
            mix-blend-mode: screen;
            pointer-events: none;
          }

          .is-course-transitioning .focus-course,""",
              """  );
            filter: blur(.6px);
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
          }

          .is-course-transitioning .focus-course,""",
          )

          replace_once(
              'scripts/check-presentation-clock.mjs',
              """assert.match(widgetPageSource, /COURSE_SHARED_MOVE_MS = 2500/)
          assert.match(widgetPageSource, /COURSE_SHELL_REVEAL_DELAY_MS = 1050/)
          assert.match(widgetPageSource, /COURSE_SHELL_REVEAL_MS = 1050/)
          assert.match(widgetPageSource, /COURSE_FINAL_WIPE_MS = 640/)
          assert.match(widgetPageSource, /COURSE_FINAL_REVEAL_MS = 420/)
          assert.match(widgetPageSource, /COURSE_TEXT_HANDOFF_MS = 420/)
          assert.match(widgetPageSource, /COURSE_RESIZE_MS = 2500/)""",
              """assert.match(widgetPageSource, /COURSE_SHARED_MOVE_MS = 2100/)
          assert.match(widgetPageSource, /COURSE_SHELL_REVEAL_MS = 900/)
          assert.match(widgetPageSource, /COURSE_FINAL_WIPE_MS = 760/)
          assert.match(widgetPageSource, /COURSE_FINAL_REVEAL_MS = 420/)
          assert.match(widgetPageSource, /COURSE_TEXT_HANDOFF_MS = 420/)
          assert.match(widgetPageSource, /COURSE_RESIZE_MS = 1150/)
          assert.doesNotMatch(widgetPageSource, /COURSE_SHELL_REVEAL_DELAY_MS/)""",
          )

          replace_once(
              'scripts/check-presentation-clock.mjs',
              """assert.match(widgetPageSource, /COURSE_SHELL_REVEAL_DELAY_MS/)
          assert.match(widgetPageSource, /duration: COURSE_SHARED_MOVE_MS/)
          assert.match(widgetPageSource, /offset: \\.18, height: `\\$\\{currentHeight\\}px`/)
          assert.match(widgetPageSource, /wipe\\.className = 'course-final-wipe'/)
          assert.match(widgetPageSource, /overlay\\.append\\(wipe\\)/)""",
              """assert.match(widgetPageSource, /duration: COURSE_SHARED_MOVE_MS/)
          assert.match(widgetPageSource, /stage\\.classList\\.add\\('is-live-resizing'\\)/)
          assert.ok(
            widgetPageSource.indexOf("Promise.all(sharedMotions.map") <
              widgetPageSource.indexOf("stage.classList.add('is-live-resizing')"),
            'shared text must finish moving before the stage starts resizing',
          )
          assert.match(widgetPageSource, /wipe\\.className = 'course-final-wipe'/)
          assert.match(widgetPageSource, /wipeBeam\\.className = 'course-final-wipe-beam'/)
          assert.match(widgetPageSource, /wipe\\.append\\(wipeBeam\\)/)
          assert.match(widgetPageSource, /animateElement\\(wipeBeam/)
          assert.match(widgetPageSource, /overlay\\.append\\(wipe\\)/)""",
          )

          replace_once(
              'scripts/check-presentation-clock.mjs',
              """assert.match(widgetPageCss, /\\.course-final-wipe/)
          assert.match(widgetPageCss, /mix-blend-mode: screen/)""",
              """assert.match(widgetPageCss, /\\.course-final-wipe/)
          assert.match(widgetPageCss, /\\.course-final-wipe-beam/)
          assert.doesNotMatch(widgetPageCss, /\\.course-final-wipe::before/)
          assert.match(widgetPageCss, /mix-blend-mode: screen/)""",
          )

          replace_once(
              'scripts/check-presentation-clock.mjs',
              """console.log('presentation clock, exact shared-time alignment, always-visible floating shared-text reflow, synchronized window resizing, immediate final-card wipe reveal, duration formatting, controller, and widget wiring checks passed')""",
              """console.log('presentation clock, exact shared-time alignment, sequential shared-text then resize handoff, visible beam wipe reveal, duration formatting, controller, and widget wiring checks passed')""",
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run presentation checks
        run: npm run check:presentation-clock

      - name: Run time-flow checks
        run: npm run check:time-flow

      - name: Build web interface
        run: npm run build

      - name: Commit sequential handoff
        id: commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/widget-page.ts src/widget-page.css scripts/check-presentation-clock.mjs
          git commit -m "fix: sequence shared text before course resize"
          git push origin HEAD:feat/time-replay-demo
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: patch-and-check
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out patched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch-and-check.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-sequential-handoff
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
