name: Patch and build PR64 single-owner text handoff v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.event.pull_request.number == 64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Apply structural ownership patch
        id: patch
        shell: bash
        run: |
          if grep -q "function transferSharedTextOwnership" src/widget-page.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          page_path = Path('src/widget-page.ts')
          check_path = Path('scripts/check-presentation-clock.mjs')
          page = page_path.read_text(encoding='utf-8')
          check = check_path.read_text(encoding='utf-8')

          type_anchor = """type SharedTextMotion = {
            element: HTMLElement
            source: HTMLElement
            keyframes: Keyframe[]
          }

          """
          helper = """type SharedTextMotion = {
            element: HTMLElement
            source: HTMLElement
            keyframes: Keyframe[]
          }

          function transferSharedTextOwnership(sharedMotions: SharedTextMotion[], targetCopies: HTMLElement[]) {
            sharedMotions.forEach((motion) => {
              clearElementAnimations(motion.element)
              motion.element.style.visibility = 'hidden'
            })
            targetCopies.forEach((copy) => {
              copy.classList.remove('is-shared-copy-hidden')
              copy.style.removeProperty('opacity')
            })
          }

          """
          if page.count(type_anchor) != 1:
            raise SystemExit('SharedTextMotion insertion anchor mismatch')
          page = page.replace(type_anchor, helper, 1)

          wipe_creation = page.index("    const wipe = document.createElement('div')")
          handoff_start = page.index("    targetCopies.forEach((copy) => {", wipe_creation)
          handoff_end = page.index("    removeCourseTransitionOverlay()", handoff_start)
          new_handoff = """    const wipeAndSupportingReveal = Promise.all([
              animateElement(wipe, [
                { opacity: 0 },
                { offset: .08, opacity: 1 },
                { offset: .88, opacity: 1 },
                { opacity: 0 },
              ], {
                duration: COURSE_FINAL_WIPE_MS,
                easing: 'linear',
                fill: 'both',
              }),
              animateElement(wipeBeam, [
                { transform: 'translate3d(-120%, 0, 0) skewX(-12deg)' },
                { transform: 'translate3d(245%, 0, 0) skewX(-12deg)' },
              ], {
                duration: COURSE_FINAL_WIPE_MS,
                easing: 'cubic-bezier(.4, 0, .2, 1)',
                fill: 'both',
              }),
              ...finalRevealParts.map((part, index) => animateElement(part, [
                { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateY(3px)' },
                { offset: .22, opacity: .16, clipPath: 'inset(0 76% 0 0)', transform: 'translateY(2px)' },
                { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'translateY(0)' },
              ], {
                duration: COURSE_FINAL_REVEAL_MS,
                delay: 52 + index * 12,
                easing: 'cubic-bezier(.16, 1, .3, 1)',
                fill: 'both',
              })),
            ])

            await Promise.all(sharedMotions.map((motion) => animateElement(motion.element, [
              { opacity: 1 },
              { offset: .52, opacity: .96 },
              { opacity: 0 },
            ], {
              duration: COURSE_TEXT_HANDOFF_MS,
              delay: 92,
              easing: 'cubic-bezier(.4, 0, .7, .2)',
              fill: 'both',
            })))
            if (token !== transitionToken) return

            transferSharedTextOwnership(sharedMotions, targetCopies)
            await wipeAndSupportingReveal
            if (token !== transitionToken) return

          """
          page = page[:handoff_start] + new_handoff + page[handoff_end:]

          check_anchor = "assert.ok(finalBodySwap < transitionFinish, 'presentation clock may resume only after the final body and height transition complete')\n"
          ownership_checks = """assert.ok(finalBodySwap < transitionFinish, 'presentation clock may resume only after the final body and height transition complete')
          assert.match(widgetPageSource, /function transferSharedTextOwnership\(sharedMotions: SharedTextMotion\[], targetCopies: HTMLElement\[]\)/)
          assert.doesNotMatch(widgetPageSource, /targetCopies\.map\(\(copy\) => animateElement/)
          assert.equal((widgetPageSource.match(/copy\.classList\.remove\('is-shared-copy-hidden'\)/g) ?? []).length, 1)
          const ownershipHelper = widgetPageSource.indexOf('function transferSharedTextOwnership')
          const movingCopyHidden = widgetPageSource.indexOf("motion.element.style.visibility = 'hidden'", ownershipHelper)
          const targetCopyRevealed = widgetPageSource.indexOf("copy.classList.remove('is-shared-copy-hidden')", ownershipHelper)
          assert.ok(
            ownershipHelper >= 0 && movingCopyHidden > ownershipHelper && movingCopyHidden < targetCopyRevealed,
            'moving copies must be fully hidden before target copies become visible',
          )
          const wipeRevealStart = widgetPageSource.indexOf('const wipeAndSupportingReveal = Promise.all([')
          const movingCopyFade = widgetPageSource.lastIndexOf('await Promise.all(sharedMotions.map')
          const ownershipTransfer = widgetPageSource.indexOf('transferSharedTextOwnership(sharedMotions, targetCopies)', movingCopyFade)
          const wipeRevealAwait = widgetPageSource.indexOf('await wipeAndSupportingReveal', ownershipTransfer)
          assert.ok(
            wipeRevealStart >= 0
              && wipeRevealStart < movingCopyFade
              && movingCopyFade < ownershipTransfer
              && ownershipTransfer < wipeRevealAwait
              && wipeRevealAwait < overlayRemoval,
            'target text ownership must switch only after moving copies finish fading and before overlay removal',
          )
          """
          if check.count(check_anchor) != 1:
            raise SystemExit('presentation check insertion anchor mismatch')
          check = check.replace(check_anchor, ownership_checks, 1)

          old_log = "console.log('presentation clock, cascade-safe morph positioning, visible shared-text overlay, non-blended wipe beam, ordered DOM handoff, deferred native resize, duration formatting, controller, and widget wiring checks passed')"
          new_log = "console.log('presentation clock, single-owner shared-text handoff, cascade-safe morph positioning, visible overlay, non-blended wipe beam, ordered DOM handoff, deferred native resize, duration formatting, controller, and widget wiring checks passed')"
          if old_log not in check:
            raise SystemExit('presentation check log anchor mismatch')
          check = check.replace(old_log, new_log, 1)

          page_path.write_text(page, encoding='utf-8')
          check_path.write_text(check, encoding='utf-8')
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required web checks
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock
          npm run build

      - name: Commit targeted fix
        id: commit
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/widget-page.ts scripts/check-presentation-clock.mjs
          git commit -m "fix: enforce single-owner shared text handoff"
          git push origin HEAD:feat/time-replay-demo
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows-nsis:
    needs: patch-and-check
    if: needs.patch-and-check.outputs.commit_sha != ''
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact patched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch-and-check.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Re-run targeted checks
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-pr64-single-owner-text-handoff
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
