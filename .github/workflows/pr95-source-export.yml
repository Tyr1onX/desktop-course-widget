name: PR95 Final Regression Patch

on:
  push:
    branches:
      - fix/weekday-header-row-detection

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/weekday-header-row-detection

      - name: Select stable Rust
        run: rustup default stable

      - name: Apply final scoped OCR regression fix
        run: python .github/pr95-final-fix.py

      - name: Format only touched OCR Rust files
        run: rustfmt --edition 2021 src-tauri/src/native_ocr/metadata.rs src-tauri/src/native_ocr/generalization_regression_tests.rs

      - name: Verify patch diff
        run: git diff --check

      - name: Run Rust library tests before push
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Push final scoped fix and remove temporary diagnostics
        shell: pwsh
        run: |
          git rm .github/pr95-final-fix.py .github/workflows/pr95-source-export.yml .github/workflows/pr95-rust-test-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/native_ocr/metadata.rs src-tauri/src/native_ocr/generalization_regression_tests.rs
          git commit -m "fix: require strong sports venue prefix evidence"
          git push origin HEAD:fix/weekday-header-row-detection
