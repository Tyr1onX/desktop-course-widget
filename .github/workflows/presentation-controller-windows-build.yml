name: Presentation controller Windows test build

on:
  pull_request:
    branches:
      - main
    paths:
      - presentation.html
      - src/presentation-*.ts
      - src/presentation-*.css
      - src/widget-page.ts
      - src/widget-page.css
      - src-tauri/tauri.conf.json
      - src-tauri/capabilities/default.json
      - vite.config.ts
      - .github/workflows/presentation-controller-windows-build.yml

permissions:
  contents: read

concurrency:
  group: presentation-controller-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select stable Rust
        run: rustup default stable

      - name: Run presentation checks
        run: npm run check:presentation-clock

      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: keke-presentation-controller-windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
