name: Presentation window integration

on:
  push:
    branches:
      - feat/time-replay-demo
    paths:
      - scripts/apply_presentation_window.py
      - .github/workflows/presentation-window.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/time-replay-demo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply presentation window integration
        run: python scripts/apply_presentation_window.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        shell: pwsh
        run: |
          npm run check:version
          npm run check:time-flow
          npm run check:import-review
          npm run check:presentation-clock
          npm run web:build

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/widget.ts vite.config.ts src-tauri/tauri.conf.json src-tauri/capabilities/default.json src-tauri/src/lib.rs
          git commit -m "feat: move replay controls into dedicated window"
          git push origin HEAD:feat/time-replay-demo
