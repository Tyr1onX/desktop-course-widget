name: Promo video ribbon proof

on:
  workflow_dispatch:
  push:
    branches:
      - feat/remotion-png-ribbon-mesh
    paths:
      - 'promo-video/**'
      - '.github/workflows/promo-video-proof.yml'
  pull_request:
    paths:
      - 'promo-video/**'
      - '.github/workflows/promo-video-proof.yml'

permissions:
  contents: read

concurrency:
  group: promo-ribbon-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ribbon-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: promo-video

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Remotion project
        run: npm run check

      - name: Render and compare final ribbon frame
        run: npm run verify:ribbon-final

      - name: Render three-second ribbon proof
        run: npm run render:ribbon

      - name: Upload ribbon proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ribbon-mesh-proof
          path: |
            promo-video/out/ribbon-mesh-final.png
            promo-video/out/ribbon-mesh-proof.mp4
          if-no-files-found: warn
          retention-days: 7
