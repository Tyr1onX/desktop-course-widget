name: Real PaddleOCR Complete Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/real-ocr-benchmark-complete.yml

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real-ocr-complete]')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install target Paddle environment
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .tmp/real-ocr | Out-Null
          New-Item -ItemType Directory -Force -Path .tmp/real-ocr/wheel | Out-Null
          $started = [DateTimeOffset]::UtcNow
          python -m pip download --no-deps --only-binary=:all: `
            --index-url https://pypi.org/simple `
            --dest .tmp/real-ocr/wheel paddlepaddle==3.3.1 `
            *>&1 | Tee-Object -FilePath .tmp/real-ocr/wheel-download.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem .tmp/real-ocr/wheel -Filter '*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'PaddlePaddle wheel missing' }
          $venv = Join-Path $env:RUNNER_TEMP 'paddleocr-complete-venv'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --no-cache-dir --upgrade pip
          & $python -m pip install --no-cache-dir $wheel.FullName `
            *>&1 | Tee-Object -FilePath .tmp/real-ocr/install-paddlepaddle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-cache-dir --index-url https://pypi.org/simple `
            paddleocr==3.7.0 psutil `
            *>&1 | Tee-Object -FilePath .tmp/real-ocr/install-paddleocr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ended = [DateTimeOffset]::UtcNow
          & $python -m pip freeze | Out-File -Encoding utf8 .tmp/real-ocr/pip-freeze.txt
          $versions = & $python -c "import json,platform,sys,sysconfig; from importlib import metadata; print(json.dumps({'pythonVersion':sys.version,'pipVersion':metadata.version('pip'),'paddlepaddleVersion':metadata.version('paddlepaddle'),'paddleocrVersion':metadata.version('paddleocr'),'machine':platform.machine(),'platform':platform.platform(),'sysconfigPlatform':sysconfig.get_platform()}))" | ConvertFrom-Json
          $wheelInfo = & $python -c "import json,pathlib; from packaging.utils import parse_wheel_filename; p=pathlib.Path(r'''$($wheel.FullName)'''); _,_,_,tags=parse_wheel_filename(p.name); print(json.dumps({'wheelName':p.name,'wheelBytes':p.stat().st_size,'wheelTags':sorted(str(t) for t in tags)}))" | ConvertFrom-Json
          $venvBytes = (Get-ChildItem $venv -Recurse -File | Measure-Object Length -Sum).Sum
          [ordered]@{
            operatingSystem = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            pythonVersion = $versions.pythonVersion
            pythonSelected = '3.13'
            pipVersion = $versions.pipVersion
            paddlepaddleVersion = $versions.paddlepaddleVersion
            paddleocrVersion = $versions.paddleocrVersion
            machine = $versions.machine
            platform = $versions.platform
            sysconfigPlatform = $versions.sysconfigPlatform
            paddleWheelSource = 'https://pypi.org/simple'
            paddleWheel = $wheelInfo
            installStarted = $started.ToString('o')
            installEnded = $ended.ToString('o')
            installSeconds = ($ended - $started).TotalSeconds
            venvPath = $venv
            venvBytes = $venvBytes
            cpuBackend = 'paddle-no-mkldnn'
            enableMkldnn = $false
            defaultBackendFailureRun = 30507847471
            rustTimeoutEvidenceRun = 30509439915
          } | ConvertTo-Json -Depth 8 | Out-File -Encoding utf8 .tmp/real-ocr/install-metadata.json
          "python=$python" >> $env:GITHUB_OUTPUT

      - name: Select stable Rust
        run: rustup default stable

      - name: Prebuild ImportDraft validator outside OCR timings
        run: cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Clear model cache
        shell: pwsh
        run: |
          Remove-Item "$HOME\.paddlex" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$HOME\.paddleocr" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Bootstrap models and first prediction
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.real_benchmark_entry bootstrap `
            --output .tmp/real-ocr/bootstrap `
            *>&1 | Tee-Object -FilePath .tmp/real-ocr/bootstrap.log
          $code = $LASTEXITCODE
          exit $code

      - name: Run all cold and hot block/full measurements
        id: measure
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.real_benchmark_entry benchmark `
            --output .tmp/real-ocr/results `
            --repo-root . `
            --install-metadata .tmp/real-ocr/install-metadata.json `
            *>&1 | Tee-Object -FilePath .tmp/real-ocr/benchmark.log
          $code = $LASTEXITCODE
          exit $code

      - name: Merge bootstrap and benchmark metrics
        id: finalize
        if: steps.measure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -c "from pathlib import Path; from experiments.screenshot_import.benchmark_io import finalize_benchmark; from experiments.screenshot_import.real_benchmark import _markdown; p=finalize_benchmark(r'.tmp/real-ocr/results/benchmark.json', r'.tmp/real-ocr/bootstrap/model-bootstrap.json'); Path(r'.tmp/real-ocr/results/REAL_OCR_BENCHMARK.md').write_text(_markdown(p), encoding='utf-8')"
          $code = $LASTEXITCODE
          exit $code

      - name: Upload sanitized benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-paddleocr-complete-${{ github.sha }}
          path: |
            .tmp/real-ocr/*.log
            .tmp/real-ocr/install-metadata.json
            .tmp/real-ocr/pip-freeze.txt
            .tmp/real-ocr/bootstrap/model-bootstrap.json
            .tmp/real-ocr/results/benchmark.json
            .tmp/real-ocr/results/REAL_OCR_BENCHMARK.md
            .tmp/real-ocr/results/runs/**/report.json
            .tmp/real-ocr/results/runs/**/draft.json
            .tmp/real-ocr/results/runs/**/ocr.json
            .tmp/real-ocr/results/runs/**/grid.json
          if-no-files-found: warn
          retention-days: 7

      - name: Post result receipt
        if: always()
        uses: actions/github-script@v7
        env:
          BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          MEASURE: ${{ steps.measure.outcome }}
          FINALIZE: ${{ steps.finalize.outcome }}
        with:
          script: |
            const fs = require('fs');
            const lines = [
              '### Real Windows CPU PaddleOCR complete benchmark',
              '',
              `- Run ID: \`${context.runId}\``,
              `- HEAD: \`${context.sha}\``,
              `- Model bootstrap: \`${process.env.BOOTSTRAP}\``,
              `- Measurements: \`${process.env.MEASURE}\``,
              `- Finalization: \`${process.env.FINALIZE}\``,
              `- Default MKLDNN failure evidence: Run \`30507847471\``,
              `- Rust prebuild correction evidence: Run \`30509439915\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ];
            const path = '.tmp/real-ocr/results/benchmark.json';
            if (fs.existsSync(path)) {
              const p = JSON.parse(fs.readFileSync(path, 'utf8'));
              lines.push('', `- Python: \`${p.environment.pythonVersion}\``);
              lines.push(`- PaddlePaddle: \`${p.environment.paddlepaddleVersion}\``);
              lines.push(`- PaddleOCR: \`${p.environment.paddleocrVersion}\``);
              lines.push(`- Model cache: \`${p.model.cacheBytes}\` bytes`);
              lines.push(`- Model download: \`${p.model.modelDownloadSeconds}\` s`);
              lines.push('', '| Sample | Mode | Calls | Cold OCR s | Avg hot OCR s | Wrong-confirmed rate |');
              lines.push('|---|---|---:|---:|---:|---:|');
              for (const item of p.comparisons) {
                lines.push(`| ${item.sample} | ${item.ocrMode} | ${item.predictCallCount} | ${item.coldInferenceSeconds} | ${item.averageHotInferenceSeconds} | ${item.fieldEvaluation.wrongConfirmedRate} |`);
              }
            } else {
              lines.push('', 'No complete benchmark JSON was produced; sanitized failure logs are in the artifact.');
            }
            lines.push('', 'The artifact excludes images, model files, caches, virtual environments, and user data.');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 72, body: lines.join('\n')});

      - name: Fail unless the complete benchmark succeeded
        if: always() && (steps.bootstrap.outcome != 'success' || steps.measure.outcome != 'success' || steps.finalize.outcome != 'success')
        shell: pwsh
        run: exit 1
