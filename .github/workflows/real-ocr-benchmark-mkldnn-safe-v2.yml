name: Real PaddleOCR Benchmark (oneDNN safe v2)

on:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/real-ocr-benchmark-mkldnn-safe-v2.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated locked environment
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .tmp/real-ocr-safe-v2/wheels | Out-Null
          $venv = Join-Path $env:RUNNER_TEMP 'paddleocr-safe-benchmark-v2-venv'
          $started = [DateTimeOffset]::UtcNow
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --no-cache-dir --upgrade pip
          & $python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest .tmp/real-ocr-safe-v2/wheels paddlepaddle==3.3.1 *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe-v2/install-paddle-wheel.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem .tmp/real-ocr-safe-v2/wheels -Filter 'paddlepaddle-*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'Official PaddlePaddle wheel was not downloaded' }
          & $python -m pip install --no-cache-dir $wheel.FullName *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe-v2/install-paddlepaddle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-cache-dir --index-url https://pypi.org/simple paddleocr==3.7.0 psutil *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe-v2/install-paddleocr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ended = [DateTimeOffset]::UtcNow
          & $python -m pip freeze | Out-File -Encoding utf8 .tmp/real-ocr-safe-v2/pip-freeze.txt
          & $python -m pip debug --verbose | Out-File -Encoding utf8 .tmp/real-ocr-safe-v2/pip-debug.txt
          $pythonInfo = (& $python -c "import json,platform,sys,sysconfig; print(json.dumps({'pythonVersion':sys.version,'machine':platform.machine(),'platform':platform.platform(),'sysconfigPlatform':sysconfig.get_platform()}))") | ConvertFrom-Json
          $versions = (& $python -c "import json; from importlib import metadata; print(json.dumps({'pipVersion':metadata.version('pip'),'paddlepaddleVersion':metadata.version('paddlepaddle'),'paddleocrVersion':metadata.version('paddleocr')}))") | ConvertFrom-Json
          $wheelInfo = (& $python -c "import json,pathlib; from packaging.utils import parse_wheel_filename; p=pathlib.Path(r'''$($wheel.FullName)'''); n,v,b,t=parse_wheel_filename(p.name); print(json.dumps({'wheelName':p.name,'wheelBytes':p.stat().st_size,'wheelTags':sorted(str(x) for x in t)}))") | ConvertFrom-Json
          $venvBytes = (Get-ChildItem $venv -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $metadata = [ordered]@{
            operatingSystem = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            pythonVersion = $pythonInfo.pythonVersion
            pythonSelected = '3.13'
            machine = $pythonInfo.machine
            platform = $pythonInfo.platform
            sysconfigPlatform = $pythonInfo.sysconfigPlatform
            pipVersion = $versions.pipVersion
            paddlepaddleVersion = $versions.paddlepaddleVersion
            paddleocrVersion = $versions.paddleocrVersion
            paddleWheelSource = 'https://pypi.org/simple'
            paddleWheel = $wheelInfo
            installStarted = $started.ToString('o')
            installEnded = $ended.ToString('o')
            installSeconds = ($ended - $started).TotalSeconds
            venvPath = $venv
            venvBytes = $venvBytes
            mkldnnDisabled = $true
            commands = @(
              'python -m venv <RUNNER_TEMP>/paddleocr-safe-benchmark-v2-venv',
              'python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple paddlepaddle==3.3.1',
              'python -m pip install --no-cache-dir <official cp313 win_amd64 wheel>',
              'python -m pip install --no-cache-dir --index-url https://pypi.org/simple paddleocr==3.7.0 psutil'
            )
          }
          $metadata | ConvertTo-Json -Depth 8 | Out-File -Encoding utf8 .tmp/real-ocr-safe-v2/install-metadata.json
          "python=$python" >> $env:GITHUB_OUTPUT

      - name: Prebuild Rust ImportDraft validator outside benchmark timing
        shell: pwsh
        run: |
          rustup default stable
          cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Bootstrap models without oneDNN
        shell: pwsh
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          FLAGS_use_mkldnn: '0'
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.paddle_runtime `
            experiments.screenshot_import.model_bootstrap `
            --output .tmp/real-ocr-safe-v2/bootstrap *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe-v2/model-bootstrap-console.log
          exit $LASTEXITCODE

      - name: Run block and full-image real OCR benchmark
        shell: pwsh
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          FLAGS_use_mkldnn: '0'
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.paddle_runtime `
            experiments.screenshot_import.real_benchmark `
            --output .tmp/real-ocr-safe-v2/results `
            --repo-root . `
            --install-metadata .tmp/real-ocr-safe-v2/install-metadata.json *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe-v2/benchmark-console.log
          exit $LASTEXITCODE

      - name: Merge model bootstrap metrics
        shell: pwsh
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -c "from pathlib import Path; from experiments.screenshot_import.benchmark_io import finalize_benchmark; from experiments.screenshot_import.real_benchmark import _markdown; p=finalize_benchmark(r'.tmp/real-ocr-safe-v2/results/benchmark.json', r'.tmp/real-ocr-safe-v2/bootstrap/model-bootstrap.json'); Path(r'.tmp/real-ocr-safe-v2/results/REAL_OCR_BENCHMARK.md').write_text(_markdown(p), encoding='utf-8')"

      - name: Upload sanitized benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-paddleocr-mkldnn-safe-v2-${{ github.sha }}
          path: |
            .tmp/real-ocr-safe-v2/install-*.log
            .tmp/real-ocr-safe-v2/install-metadata.json
            .tmp/real-ocr-safe-v2/pip-debug.txt
            .tmp/real-ocr-safe-v2/pip-freeze.txt
            .tmp/real-ocr-safe-v2/model-bootstrap-console.log
            .tmp/real-ocr-safe-v2/bootstrap/model-bootstrap.json
            .tmp/real-ocr-safe-v2/benchmark-console.log
            .tmp/real-ocr-safe-v2/results/benchmark.json
            .tmp/real-ocr-safe-v2/results/REAL_OCR_BENCHMARK.md
            .tmp/real-ocr-safe-v2/results/runs/**/report.json
            .tmp/real-ocr-safe-v2/results/runs/**/draft.json
            .tmp/real-ocr-safe-v2/results/runs/**/ocr.json
            .tmp/real-ocr-safe-v2/results/runs/**/grid.json
          if-no-files-found: warn
          retention-days: 7
