name: Real PaddleOCR Safe CPU Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/real-ocr-benchmark-retry.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: real-paddleocr-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real-ocr-safe-retry]')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated target environment
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .tmp/real-ocr-safe | Out-Null
          New-Item -ItemType Directory -Force -Path .tmp/real-ocr-safe/wheel | Out-Null
          $started = [DateTimeOffset]::UtcNow
          python -m pip download `
            --no-deps `
            --only-binary=:all: `
            --index-url https://pypi.org/simple `
            --dest .tmp/real-ocr-safe/wheel `
            paddlepaddle==3.3.1 *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe/paddle-wheel-download.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem .tmp/real-ocr-safe/wheel -Filter '*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'PaddlePaddle wheel was not downloaded' }

          $venv = Join-Path $env:RUNNER_TEMP 'paddleocr-safe-benchmark-venv'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --no-cache-dir --upgrade pip
          & $python -m pip install --no-cache-dir $wheel.FullName *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe/install-paddlepaddle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-cache-dir --index-url https://pypi.org/simple paddleocr==3.7.0 psutil *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe/install-paddleocr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ended = [DateTimeOffset]::UtcNow

          & $python -m pip freeze | Out-File -Encoding utf8 .tmp/real-ocr-safe/pip-freeze.txt
          & $python -m pip debug --verbose | Out-File -Encoding utf8 .tmp/real-ocr-safe/pip-debug.txt
          $versions = & $python -c "import json, platform, sys, sysconfig; from importlib import metadata; print(json.dumps({'pythonVersion':sys.version,'pipVersion':metadata.version('pip'),'paddlepaddleVersion':metadata.version('paddlepaddle'),'paddleocrVersion':metadata.version('paddleocr'),'machine':platform.machine(),'platform':platform.platform(),'sysconfigPlatform':sysconfig.get_platform()}))" | ConvertFrom-Json
          $wheelInfo = & $python -c "import json, pathlib; from packaging.utils import parse_wheel_filename; p=pathlib.Path(r'''$($wheel.FullName)'''); _,_,_,tags=parse_wheel_filename(p.name); print(json.dumps({'wheelName':p.name,'wheelBytes':p.stat().st_size,'wheelTags':sorted(str(t) for t in tags)}))" | ConvertFrom-Json
          $venvBytes = (Get-ChildItem $venv -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $metadata = [ordered]@{
            operatingSystem = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            pythonVersion = $versions.pythonVersion
            pythonSelected = '3.13'
            pipVersion = $versions.pipVersion
            paddlepaddleVersion = $versions.paddlepaddleVersion
            paddleocrVersion = $versions.paddleocrVersion
            machine = $versions.machine
            platform = $versions.platform
            sysconfigPlatform = $versions.sysconfigPlatform
            paddleWheelSource = 'https://pypi.org/simple'
            paddleWheel = $wheelInfo
            installStarted = $started.ToString('o')
            installEnded = $ended.ToString('o')
            installSeconds = ($ended - $started).TotalSeconds
            venvPath = $venv
            venvBytes = $venvBytes
            cpuBackend = 'paddle-no-mkldnn'
            enableMkldnn = $false
            defaultBackendFailureRun = 30507847471
            defaultBackendFailure = 'ConvertPirAttribute2RuntimeAttribute does not support ArrayAttribute<DoubleAttribute> in oneDNN'
            commands = @(
              'python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest <wheel-dir> paddlepaddle==3.3.1',
              'python -m venv <RUNNER_TEMP>/paddleocr-safe-benchmark-venv',
              'python -m pip install --no-cache-dir <paddlepaddle cp313 win_amd64 wheel>',
              'python -m pip install --no-cache-dir --index-url https://pypi.org/simple paddleocr==3.7.0 psutil'
            )
          }
          $metadata | ConvertTo-Json -Depth 8 | Out-File -Encoding utf8 .tmp/real-ocr-safe/install-metadata.json
          "python=$python" >> $env:GITHUB_OUTPUT
          "venv=$venv" >> $env:GITHUB_OUTPUT

      - name: Clear model caches before bootstrap
        shell: pwsh
        run: |
          Remove-Item "$HOME\.paddlex" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$HOME\.paddleocr" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Bootstrap models with safe CPU backend
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.real_benchmark_entry bootstrap `
            --output .tmp/real-ocr-safe/bootstrap *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe/bootstrap-console.log
          exit $LASTEXITCODE

      - name: Run block and full-image benchmark
        id: benchmark
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.real_benchmark_entry benchmark `
            --output .tmp/real-ocr-safe/results `
            --repo-root . `
            --install-metadata .tmp/real-ocr-safe/install-metadata.json *>&1 | Tee-Object -FilePath .tmp/real-ocr-safe/benchmark-console.log
          exit $LASTEXITCODE

      - name: Finalize benchmark metrics
        id: finalize
        if: steps.benchmark.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -c "from pathlib import Path; from experiments.screenshot_import.benchmark_io import finalize_benchmark; from experiments.screenshot_import.real_benchmark import _markdown; p=finalize_benchmark(r'.tmp/real-ocr-safe/results/benchmark.json', r'.tmp/real-ocr-safe/bootstrap/model-bootstrap.json'); Path(r'.tmp/real-ocr-safe/results/REAL_OCR_BENCHMARK.md').write_text(_markdown(p), encoding='utf-8')"
          exit $LASTEXITCODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-paddleocr-safe-benchmark-${{ github.sha }}
          path: |
            .tmp/real-ocr-safe/*.log
            .tmp/real-ocr-safe/install-metadata.json
            .tmp/real-ocr-safe/pip-freeze.txt
            .tmp/real-ocr-safe/pip-debug.txt
            .tmp/real-ocr-safe/bootstrap/model-bootstrap.json
            .tmp/real-ocr-safe/results/benchmark.json
            .tmp/real-ocr-safe/results/REAL_OCR_BENCHMARK.md
            .tmp/real-ocr-safe/results/runs/**/report.json
            .tmp/real-ocr-safe/results/runs/**/draft.json
            .tmp/real-ocr-safe/results/runs/**/ocr.json
            .tmp/real-ocr-safe/results/runs/**/grid.json
          if-no-files-found: warn
          retention-days: 7

      - name: Post benchmark receipt
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        with:
          script: |
            const fs = require('fs');
            const lines = [
              '### Real Windows CPU PaddleOCR safe-backend benchmark',
              '',
              `- Run ID: \`${context.runId}\``,
              `- HEAD: \`${context.sha}\``,
              `- Install: \`${process.env.INSTALL_OUTCOME}\``,
              `- Model bootstrap: \`${process.env.BOOTSTRAP_OUTCOME}\``,
              `- Benchmark: \`${process.env.BENCHMARK_OUTCOME}\``,
              `- Finalization: \`${process.env.FINALIZE_OUTCOME}\``,
              `- Default oneDNN failure evidence: Run \`30507847471\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ];
            const path = '.tmp/real-ocr-safe/results/benchmark.json';
            if (fs.existsSync(path)) {
              const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
              lines.push('', `- Python: \`${payload.environment.pythonVersion}\``);
              lines.push(`- PaddlePaddle: \`${payload.environment.paddlepaddleVersion}\``);
              lines.push(`- PaddleOCR: \`${payload.environment.paddleocrVersion}\``);
              lines.push(`- CPU backend: \`${payload.environment.cpuBackend}\``);
              lines.push(`- Model cache: \`${payload.model.cacheBytes}\` bytes`);
              lines.push(`- Model download: \`${payload.model.modelDownloadSeconds}\` s`);
              lines.push('', '| Sample | Mode | Calls | Cold OCR s | Average hot OCR s | Wrong-confirmed rate |');
              lines.push('|---|---|---:|---:|---:|---:|');
              for (const item of payload.comparisons) {
                lines.push(`| ${item.sample} | ${item.ocrMode} | ${item.predictCallCount} | ${item.coldInferenceSeconds} | ${item.averageHotInferenceSeconds} | ${item.fieldEvaluation.wrongConfirmedRate} |`);
              }
            } else {
              lines.push('', 'No benchmark JSON was produced; exact sanitized logs are retained in the workflow artifact.');
            }
            lines.push('', 'No generated image, model, cache, virtual environment, or user screenshot is included in the artifact.');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 72,
              body: lines.join('\n'),
            });

      - name: Fail when benchmark did not complete
        if: always() && (steps.bootstrap.outcome != 'success' || steps.benchmark.outcome != 'success' || steps.finalize.outcome != 'success')
        shell: pwsh
        run: exit 1
