name: Real PaddleOCR Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/real-ocr-benchmark.yml

permissions:
  actions: read
  contents: read
  issues: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  FLAGS_use_mkldnn: '0'
  PADDLE_PDX_MODEL_SOURCE: BOS
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked isolated environment
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .tmp/real-ocr/wheels | Out-Null
          $venv = Join-Path $env:RUNNER_TEMP 'paddleocr-real-benchmark'
          $started = [DateTimeOffset]::UtcNow
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --no-cache-dir --upgrade pip
          & $python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest .tmp/real-ocr/wheels paddlepaddle==3.3.1 *>&1 | Tee-Object .tmp/real-ocr/install-wheel.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem .tmp/real-ocr/wheels -Filter 'paddlepaddle-*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'Official PaddlePaddle wheel was not downloaded' }
          & $python -m pip install --no-cache-dir $wheel.FullName *>&1 | Tee-Object .tmp/real-ocr/install-paddlepaddle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-cache-dir --index-url https://pypi.org/simple paddleocr==3.7.0 psutil *>&1 | Tee-Object .tmp/real-ocr/install-paddleocr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ended = [DateTimeOffset]::UtcNow
          & $python -m pip freeze | Out-File -Encoding utf8 .tmp/real-ocr/pip-freeze.txt
          & $python -m pip debug --verbose | Out-File -Encoding utf8 .tmp/real-ocr/pip-debug.txt
          $pythonInfo = (& $python -c "import json,platform,sys,sysconfig; print(json.dumps({'pythonVersion':sys.version,'machine':platform.machine(),'platform':platform.platform(),'sysconfigPlatform':sysconfig.get_platform()}))") | ConvertFrom-Json
          $versions = (& $python -c "import json; from importlib import metadata; print(json.dumps({'pipVersion':metadata.version('pip'),'paddlepaddleVersion':metadata.version('paddlepaddle'),'paddleocrVersion':metadata.version('paddleocr')}))") | ConvertFrom-Json
          $wheelInfo = (& $python -c "import json,pathlib; from packaging.utils import parse_wheel_filename; p=pathlib.Path(r'''$($wheel.FullName)'''); n,v,b,t=parse_wheel_filename(p.name); print(json.dumps({'wheelName':p.name,'wheelBytes':p.stat().st_size,'wheelTags':sorted(str(x) for x in t)}))") | ConvertFrom-Json
          $venvBytes = (Get-ChildItem $venv -Recurse -File | Measure-Object -Property Length -Sum).Sum
          [ordered]@{
            operatingSystem = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            pythonVersion = $pythonInfo.pythonVersion
            pythonSelected = '3.13'
            machine = $pythonInfo.machine
            platform = $pythonInfo.platform
            sysconfigPlatform = $pythonInfo.sysconfigPlatform
            pipVersion = $versions.pipVersion
            paddlepaddleVersion = $versions.paddlepaddleVersion
            paddleocrVersion = $versions.paddleocrVersion
            paddleWheelSource = 'https://pypi.org/simple'
            paddleWheel = $wheelInfo
            installStarted = $started.ToString('o')
            installEnded = $ended.ToString('o')
            installSeconds = ($ended - $started).TotalSeconds
            venvPath = $venv
            venvBytes = $venvBytes
            mkldnnDisabled = $true
            commands = @(
              'python -m venv <RUNNER_TEMP>/paddleocr-real-benchmark',
              'python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple paddlepaddle==3.3.1',
              'python -m pip install --no-cache-dir <official cp313 win_amd64 wheel>',
              'python -m pip install --no-cache-dir --index-url https://pypi.org/simple paddleocr==3.7.0 psutil'
            )
          } | ConvertTo-Json -Depth 8 | Out-File -Encoding utf8 .tmp/real-ocr/install-metadata.json
          "python=$python" >> $env:GITHUB_OUTPUT

      - name: Prebuild Rust validator outside benchmark timing
        run: |
          rustup default stable
          cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Bootstrap and measure official models
        shell: pwsh
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.real_benchmark_entry bootstrap --output .tmp/real-ocr/bootstrap *>&1 | Tee-Object .tmp/real-ocr/model-bootstrap-console.log
          exit $LASTEXITCODE

      - name: Run real block and full-image benchmark
        shell: pwsh
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -m experiments.screenshot_import.real_benchmark_entry benchmark --output .tmp/real-ocr/results --repo-root . --install-metadata .tmp/real-ocr/install-metadata.json *>&1 | Tee-Object .tmp/real-ocr/benchmark-console.log
          exit $LASTEXITCODE

      - name: Merge bootstrap metrics
        shell: pwsh
        run: |
          $python = '${{ steps.install.outputs.python }}'
          & $python -c "from pathlib import Path; from experiments.screenshot_import.benchmark_io import finalize_benchmark; from experiments.screenshot_import.real_benchmark import _markdown; p=finalize_benchmark(r'.tmp/real-ocr/results/benchmark.json', r'.tmp/real-ocr/bootstrap/model-bootstrap.json'); Path(r'.tmp/real-ocr/results/REAL_OCR_BENCHMARK.md').write_text(_markdown(p), encoding='utf-8')"

      - name: Upload sanitized benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-paddleocr-benchmark-${{ github.sha }}
          path: |
            .tmp/real-ocr/install-*.log
            .tmp/real-ocr/install-metadata.json
            .tmp/real-ocr/pip-debug.txt
            .tmp/real-ocr/pip-freeze.txt
            .tmp/real-ocr/model-bootstrap-console.log
            .tmp/real-ocr/bootstrap/model-bootstrap.json
            .tmp/real-ocr/benchmark-console.log
            .tmp/real-ocr/results/benchmark.json
            .tmp/real-ocr/results/REAL_OCR_BENCHMARK.md
            .tmp/real-ocr/results/runs/**/report.json
            .tmp/real-ocr/results/runs/**/draft.json
            .tmp/real-ocr/results/runs/**/ocr.json
            .tmp/real-ocr/results/runs/**/grid.json
          if-no-files-found: error
          retention-days: 7

      - name: Record canonical benchmark receipt
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedName = `real-paddleocr-benchmark-${context.sha}`;
            let artifact = null;
            for (let attempt = 0; attempt < 20 && !artifact; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              artifact = response.data.artifacts.find(item => item.name === expectedName);
              if (!artifact) await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!artifact) {
              core.setFailed(`Artifact ${expectedName} was not visible after upload`);
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 72,
              body: [
                '### Canonical real PaddleOCR benchmark receipt',
                '',
                `- Run ID: \`${context.runId}\``,
                `- Run HEAD: \`${context.sha}\``,
                `- Artifact ID: \`${artifact.id}\``,
                `- Artifact: \`${artifact.name}\``,
                `- Artifact digest: \`${artifact.digest}\``,
                `- Artifact bytes: \`${artifact.size_in_bytes}\``,
                `- Expires: \`${artifact.expires_at}\``,
                '',
                'The benchmark, bootstrap merge, and artifact upload completed successfully before this receipt was posted.',
              ].join('\n'),
            });