name: Real OCR Run Observer

on:
  push:
    branches:
      - feat/screenshot-recognition-spike
    paths:
      - .github/workflows/real-ocr-run-observer.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report recent safe real OCR benchmark runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          command = [
              "gh", "run", "list",
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--workflow", "Real PaddleOCR Safe CPU Benchmark",
              "--branch", "feat/screenshot-recognition-spike",
              "--limit", "5",
              "--json", "databaseId,status,conclusion,headSha,url,createdAt,event",
          ]
          completed = subprocess.run(command, check=True, capture_output=True, text=True)
          runs = json.loads(completed.stdout)
          lines = [
              "### Safe real OCR benchmark run observer",
              "",
              f"Observer HEAD: `{os.environ['GITHUB_SHA']}`",
              "",
              "| Run ID | Status | Conclusion | Event | HEAD | Created |",
              "|---:|---|---|---|---|---|",
          ]
          for run in runs:
              lines.append(
                  f"| [{run['databaseId']}]({run['url']}) | {run['status']} | "
                  f"{run.get('conclusion') or ''} | {run['event']} | "
                  f"`{run['headSha']}` | {run['createdAt']} |"
              )
          if not runs:
              lines.append("| — | no matching run found | | | | |")
          body = "\n".join(lines)
          subprocess.run(
              [
                  "gh", "api", "--method", "POST",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/72/comments",
                  "-f", f"body={body}",
              ],
              check=True,
          )
          PY
