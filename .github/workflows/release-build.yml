name: Windows Release Build

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Select stable Rust
        run: rustup default stable

      - name: Refresh Cargo lockfile metadata
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Check release version consistency
        run: npm run check:version

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-course-widget-windows-release
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Commit refreshed lockfiles
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: refresh release lockfiles"
            git push origin HEAD:${{ github.head_ref }}
          }
