name: Release version sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-version:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v0.5.0-beta.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate formal release versions
        run: node scripts/set-build-version.mjs 0.5.0-beta.3

      - name: Commit generated version files and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/release-version-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m 'release: sync v0.5.0-beta.3 version files'
          git push origin HEAD:${GITHUB_HEAD_REF}
