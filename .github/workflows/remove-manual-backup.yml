name: Remove manual backup feature

on:
  push:
    branches:
      - refactor/remove-manual-backup
    paths:
      - .github/workflows/remove-manual-backup.yml

permissions:
  contents: write

jobs:
  remove-and-validate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-manual-backup
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Remove manual backup feature
        run: python scripts/remove_manual_backup.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        shell: pwsh
        run: |
          npm run check:version
          npm run check:time-flow
          npm run web:build

      - name: Select stable Rust
        run: rustup default stable

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit removal
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md src/settings.ts src/settings.css src-tauri/src/lib.rs src-tauri/src/data_backup.rs
          git commit -m "refactor: remove manual backup and restore"
          git push origin HEAD:refactor/remove-manual-backup
