name: Repair beta.5 dual-install patch workflow once

on:
  push:
    branches:
      - fix/v0.5.0-beta.5

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/v0.5.0-beta.5
          fetch-depth: 0
      - name: Repair and re-enable patch workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-beta5-dual-install-once.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    if: github.actor != 'github-actions[bot]'", '    if: true', 1)
          marker = "          text += r'''\n\ntest('v0.3 release gate establishes and cleans real dual install roots', () => {\n"
          if marker not in text:
              raise SystemExit('unindented regression block marker not found')
          replacement = "          text += r'''\n\n          test('v0.3 release gate establishes and cleans real dual install roots', () => {\n"
          text = text.replace(marker, replacement, 1)
          lines = text.splitlines()
          inside = False
          out = []
          for line in lines:
              if line.startswith("          test('v0.3 release gate establishes"):
                  inside = True
              if inside and line and not line.startswith('          '):
                  line = '          ' + line
              out.append(line)
              if inside and line.strip() == "'''":
                  inside = False
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit repair and remove launcher
        shell: bash
        run: |
          rm .github/workflows/repair-beta5-dual-workflow-once.yml
          git add .github/workflows/apply-beta5-dual-install-once.yml .github/workflows/repair-beta5-dual-workflow-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: repair beta.5 dual-install patch workflow'
          git push origin HEAD:fix/v0.5.0-beta.5
