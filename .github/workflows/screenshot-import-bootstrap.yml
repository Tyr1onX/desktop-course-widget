name: Bootstrap screenshot import vertical slice

on:
  push:
    branches:
      - feat/screenshot-import-vertical-slice
    paths:
      - .github/workflows/screenshot-import-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screenshot-import-vertical-slice
          fetch-depth: 0

      - name: Apply screenshot import vertical slice
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()
          settings = root / "src/settings.ts"
          lib = root / "src-tauri/src/lib.rs"
          runner = root / "src-tauri/src/screenshot_import.rs"

          settings_text = settings.read_text(encoding="utf-8")
          settings_text = settings_text.replace(
              "let importCreatePending = false\nlet surfaceMessage = ''",
              "let importCreatePending = false\nlet importRecognitionPending = false\nlet surfaceMessage = ''",
              1,
          )

          old_picker = '''      <div class="surface-intro">
                <h3>从 Excel 创建独立课表</h3>
                <p>先逐项检查识别结果，再创建新课表；已有课表不会被覆盖。</p>
              </div>
              <button class="import-picker" type="button" data-action="choose-excel">
                <strong>${escapeHtml(draft?.sourceName ?? '选择一份 .xlsx 课表')}</strong>
                <span>${desktopRuntime ? '文件只在本机解析，不会上传' : '浏览器预览中不会读取本机文件'}</span>
              </button>'''
          new_picker = '''      <div class="surface-intro">
                <h3>从文件创建独立课表</h3>
                <p>选择 Excel 或课表截图，识别结果会进入同一套逐项复核流程；已有课表不会被覆盖。</p>
              </div>
              <button class="import-picker" type="button" data-action="choose-excel" ${importRecognitionPending ? 'disabled' : ''}>
                <strong>${escapeHtml(draft?.source === 'excel' ? draft.sourceName : '选择一份 .xlsx 课表')}</strong>
                <span>${desktopRuntime ? 'Excel 只在本机解析，不会上传' : '浏览器预览中不会读取本机文件'}</span>
              </button>
              <button class="import-picker" type="button" data-action="choose-screenshot" ${importRecognitionPending ? 'disabled' : ''}>
                <strong>${escapeHtml(importRecognitionPending ? '正在识别课表截图…' : draft?.source === 'image' ? draft.sourceName : '选择 PNG / JPG 课表截图')}</strong>
                <span>${desktopRuntime ? '图片与 OCR 全程留在本机；首次准备模型可能较慢' : '浏览器预览中不会读取本机图片'}</span>
              </button>'''
          if old_picker not in settings_text:
              raise SystemExit("settings import picker block not found")
          settings_text = settings_text.replace(old_picker, new_picker, 1)

          old_bind = '''function bindImportEvents(): void {
            document.querySelector('[data-action="choose-excel"]')?.addEventListener('click', () => void chooseExcel())'''
          new_bind = '''function bindImportEvents(): void {
            document.querySelector('[data-action="choose-excel"]')?.addEventListener('click', () => void chooseExcel())
            document.querySelector('[data-action="choose-screenshot"]')?.addEventListener('click', () => void chooseScreenshot())'''
          if old_bind not in settings_text:
              raise SystemExit("settings import event binding not found")
          settings_text = settings_text.replace(old_bind, new_bind, 1)

          choose_screenshot = '''async function chooseScreenshot(): Promise<void> {
            if (importRecognitionPending) return
            if (!desktopRuntime) {
              surfaceMessage = '浏览器预览不会读取本机图片，请在桌面应用中测试。'
              render()
              return
            }

            importRecognitionPending = true
            surfaceMessage = '正在本机识别课表截图，首次准备 OCR 模型可能需要较长时间…'
            render()
            try {
              const draft = await invoke<ImportDraft | null>('choose_and_parse_screenshot')
              if (draft) {
                importDraft = draft
                importNameDraft = draft.suggestedName
                importFirstWeekDraft = schedule.semesterStart
                expandedImportCourseIndex = 0
                refreshImportDraftSummary(draft)
                surfaceMessage = `已识别 ${draft.summary.arrangements} 项课程安排，请逐项确认后创建。`
              } else {
                surfaceMessage = '已取消选择课表截图。'
              }
            } catch (error) {
              surfaceMessage = errorText(error)
            } finally {
              importRecognitionPending = false
              render()
            }
          }

          '''
          marker = "async function chooseExcel(): Promise<void> {"
          if marker not in settings_text:
              raise SystemExit("chooseExcel function not found")
          settings_text = settings_text.replace(marker, choose_screenshot + marker, 1)
          settings.write_text(settings_text, encoding="utf-8")

          lib_text = lib.read_text(encoding="utf-8")
          lib_text = lib_text.replace("mod import_draft;\n", "mod import_draft;\nmod screenshot_import;\n", 1)

          screenshot_command = '''#[tauri::command]
          async fn choose_and_parse_screenshot(
              app: AppHandle,
          ) -> Result<Option<import_draft::ImportDraft>, String> {
              let selected = app
                  .dialog()
                  .file()
                  .add_filter("课表截图", &["png", "jpg", "jpeg"])
                  .blocking_pick_file();

              let Some(selected) = selected else {
                  return Ok(None);
              };

              let path = selected
                  .into_path()
                  .map_err(|_| "无法读取所选课表截图路径".to_owned())?;
              let draft = tauri::async_runtime::spawn_blocking(move || {
                  screenshot_import::recognize_screenshot(&path)
              })
              .await
              .map_err(|error| format!("截图识别任务异常结束：{error}"))??;
              Ok(Some(draft))
          }

          '''
          command_marker = "#[tauri::command]\nasync fn choose_and_parse_excel("
          if command_marker not in lib_text:
              raise SystemExit("choose_and_parse_excel command not found")
          lib_text = lib_text.replace(command_marker, screenshot_command + command_marker, 1)
          handler_marker = "            choose_and_parse_excel,\n"
          if handler_marker not in lib_text:
              raise SystemExit("Tauri handler registration not found")
          lib_text = lib_text.replace(
              handler_marker,
              handler_marker + "            choose_and_parse_screenshot,\n",
              1,
          )
          lib.write_text(lib_text, encoding="utf-8")

          runner.write_text(r'''use std::{
              env, fs,
              path::{Path, PathBuf},
              process::Command,
              time::{SystemTime, UNIX_EPOCH},
          };

          use crate::import_draft::{
              ImportCourseReview, ImportDraft, ImportFieldEvidence, ImportFieldKey,
              ImportIssueSeverity, ImportReviewStatus, ImportSource,
          };

          const OCR_PYTHON_ENV: &str = "COURSE_WIDGET_OCR_PYTHON";
          const OCR_REPO_ROOT_ENV: &str = "COURSE_WIDGET_OCR_REPO_ROOT";

          struct RecognizerRuntime {
              python: PathBuf,
              repo_root: PathBuf,
          }

          struct TempOutput {
              path: PathBuf,
          }

          impl TempOutput {
              fn create() -> Result<Self, String> {
                  let nonce = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map_err(|error| format!("无法创建截图识别临时目录：{error}"))?
                      .as_nanos();
                  let path = env::temp_dir().join(format!(
                      "course-widget-screenshot-ocr-{}-{nonce}",
                      std::process::id()
                  ));
                  fs::create_dir_all(&path)
                      .map_err(|error| format!("无法创建截图识别临时目录：{error}"))?;
                  Ok(Self { path })
              }
          }

          impl Drop for TempOutput {
              fn drop(&mut self) {
                  if let Err(error) = fs::remove_dir_all(&self.path) {
                      eprintln!("[screenshot-import] could not clean temporary output: {error}");
                  }
              }
          }

          pub fn recognize_screenshot(image_path: &Path) -> Result<ImportDraft, String> {
              validate_image_path(image_path)?;
              let runtime = resolve_runtime()?;
              let output = TempOutput::create()?;

              let process = Command::new(&runtime.python)
                  .current_dir(&runtime.repo_root)
                  .arg("-m")
                  .arg("experiments.screenshot_import")
                  .arg("recognize")
                  .arg("--input")
                  .arg(image_path)
                  .arg("--output")
                  .arg(&output.path)
                  .arg("--engine")
                  .arg("paddle")
                  .arg("--repo-root")
                  .arg(&runtime.repo_root)
                  .output()
                  .map_err(|error| format!("无法启动本地截图识别器：{error}"))?;

              if !process.status.success() {
                  let detail = compact_failure(&process.stderr, &process.stdout);
                  return Err(format!("课表截图识别失败：{detail}"));
              }

              let draft_path = output.path.join("draft.json");
              let raw = fs::read_to_string(&draft_path)
                  .map_err(|error| format!("截图识别器未生成可用草稿：{error}"))?;
              let mut draft: ImportDraft = serde_json::from_str(&raw)
                  .map_err(|error| format!("截图识别草稿格式无效：{error}"))?;

              if draft.source != ImportSource::Image {
                  return Err("截图识别器返回了错误的导入来源类型".into());
              }
              if draft.image_source.is_none() {
                  return Err("截图识别器未返回图片尺寸信息".into());
              }
              if draft.source_name.trim().is_empty() {
                  draft.source_name = image_path
                      .file_name()
                      .and_then(|name| name.to_str())
                      .unwrap_or("已选择课表截图")
                      .to_owned();
              }

              enforce_manual_review(&mut draft);
              if let Some(issue) = draft
                  .issues()
                  .into_iter()
                  .find(|issue| issue.severity == ImportIssueSeverity::Error)
              {
                  return Err(match issue.course_index {
                      Some(index) => format!("第 {} 项课程：{}", index + 1, issue.message),
                      None => issue.message,
                  });
              }
              Ok(draft)
          }

          fn validate_image_path(path: &Path) -> Result<(), String> {
              if !path.is_file() {
                  return Err("所选课表截图不存在或无法读取".into());
              }
              let extension = path
                  .extension()
                  .and_then(|value| value.to_str())
                  .map(str::to_ascii_lowercase)
                  .unwrap_or_default();
              if !matches!(extension.as_str(), "png" | "jpg" | "jpeg") {
                  return Err("仅支持 PNG、JPG、JPEG 课表截图".into());
              }
              Ok(())
          }

          fn resolve_runtime() -> Result<RecognizerRuntime, String> {
              let configured_python = env::var_os(OCR_PYTHON_ENV).map(PathBuf::from);
              let configured_root = env::var_os(OCR_REPO_ROOT_ENV).map(PathBuf::from);
              match (configured_python, configured_root) {
                  (Some(python), Some(repo_root)) => {
                      if !python.is_file() {
                          return Err(format!(
                              "环境变量 {OCR_PYTHON_ENV} 指向的 OCR Python 不存在"
                          ));
                      }
                      if !repo_root.join("experiments/screenshot_import").is_dir() {
                          return Err(format!(
                              "环境变量 {OCR_REPO_ROOT_ENV} 未指向有效的开发仓库"
                          ));
                      }
                      return Ok(RecognizerRuntime { python, repo_root });
                  }
                  (Some(_), None) | (None, Some(_)) => {
                      return Err(format!(
                          "开发态截图识别需要同时设置 {OCR_PYTHON_ENV} 与 {OCR_REPO_ROOT_ENV}"
                      ));
                  }
                  (None, None) => {}
              }

              if !cfg!(debug_assertions) {
                  return Err(
                      "当前安装包尚未包含离线 OCR 运行时；截图导入目前仅支持仓库开发环境"
                          .into(),
                  );
              }

              let repo_root = PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                  .parent()
                  .ok_or_else(|| "无法定位截图识别开发仓库".to_owned())?
                  .to_path_buf();
              let candidates = [
                  repo_root.join(".tmp/screenshot-ocr-venv/Scripts/python.exe"),
                  repo_root.join(".tmp/screenshot-ocr-venv/bin/python"),
                  repo_root.join(".venv/Scripts/python.exe"),
                  repo_root.join(".venv/bin/python"),
              ];
              let python = candidates
                  .into_iter()
                  .find(|candidate| candidate.is_file())
                  .ok_or_else(|| {
                      "未找到仓库内 OCR 开发运行时。请先准备 .tmp/screenshot-ocr-venv，不能依赖系统 Python。"
                          .to_owned()
                  })?;
              Ok(RecognizerRuntime { python, repo_root })
          }

          fn enforce_manual_review(draft: &mut ImportDraft) {
              for course in &mut draft.courses {
                  let review = course.review.get_or_insert_with(ImportCourseReview::default);
                  for field in [
                      ImportFieldKey::Name,
                      ImportFieldKey::Teacher,
                      ImportFieldKey::Location,
                      ImportFieldKey::Weeks,
                      ImportFieldKey::Parity,
                  ] {
                      let missing = match field {
                          ImportFieldKey::Name => course.name.trim().is_empty(),
                          ImportFieldKey::Teacher => course
                              .teacher
                              .as_deref()
                              .is_none_or(|value| value.trim().is_empty()),
                          ImportFieldKey::Location => course
                              .location
                              .as_deref()
                              .is_none_or(|value| value.trim().is_empty()),
                          ImportFieldKey::Weeks => course.weeks.is_empty(),
                          ImportFieldKey::Parity => course.parity.trim().is_empty(),
                          _ => false,
                      };
                      let status = if missing {
                          ImportReviewStatus::Missing
                      } else {
                          ImportReviewStatus::Review
                      };
                      if let Some(evidence) = review
                          .fields
                          .iter_mut()
                          .find(|evidence| evidence.field == field)
                      {
                          evidence.status = status;
                          if evidence.reason.is_none() {
                              evidence.reason = Some("截图 OCR 字段需人工确认".into());
                          }
                      } else {
                          review.fields.push(ImportFieldEvidence {
                              field,
                              status,
                              confidence: None,
                              raw_text: None,
                              source_box: None,
                              reason: Some("截图 OCR 字段需人工确认".into()),
                          });
                      }
                  }
              }
          }

          fn compact_failure(stderr: &[u8], stdout: &[u8]) -> String {
              let text = if stderr.is_empty() { stdout } else { stderr };
              let decoded = String::from_utf8_lossy(text);
              let mut lines = decoded
                  .lines()
                  .map(str::trim)
                  .filter(|line| !line.is_empty())
                  .rev()
                  .take(4)
                  .collect::<Vec<_>>();
              lines.reverse();
              let joined = lines.join(" · ");
              if joined.is_empty() {
                  "识别器未提供错误详情".into()
              } else {
                  joined.chars().take(600).collect()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use crate::import_draft::{
                  ImportCourse, ImportDraftSummary, ImportImageSource,
              };

              fn sample_draft() -> ImportDraft {
                  ImportDraft {
                      schema_version: 1,
                      source: ImportSource::Image,
                      source_name: "sample.png".into(),
                      suggested_name: "示例课表".into(),
                      detected_term_text: None,
                      summary: ImportDraftSummary {
                          arrangements: 1,
                          highest_week: 16,
                          location_count: 0,
                      },
                      warnings: vec![],
                      courses: vec![ImportCourse {
                          code: None,
                          name: "通信原理".into(),
                          teacher: None,
                          weekday: 1,
                          start_section: 1,
                          end_section: 2,
                          weeks: (1..=16).collect(),
                          parity: "all".into(),
                          location: None,
                          review: None,
                      }],
                      image_source: Some(ImportImageSource {
                          width: 1000,
                          height: 1600,
                          weekday_columns: Some(7),
                          section_rows: Some(12),
                          recognizer_version: Some("test".into()),
                      }),
                  }
              }

              #[test]
              fn forces_ocr_text_fields_back_to_review() {
                  let mut draft = sample_draft();
                  enforce_manual_review(&mut draft);
                  let fields = &draft.courses[0].review.as_ref().unwrap().fields;
                  assert_eq!(
                      fields
                          .iter()
                          .find(|item| item.field == ImportFieldKey::Name)
                          .unwrap()
                          .status,
                      ImportReviewStatus::Review
                  );
                  assert_eq!(
                      fields
                          .iter()
                          .find(|item| item.field == ImportFieldKey::Teacher)
                          .unwrap()
                          .status,
                      ImportReviewStatus::Missing
                  );
                  assert_eq!(
                      fields
                          .iter()
                          .find(|item| item.field == ImportFieldKey::Location)
                          .unwrap()
                          .status,
                      ImportReviewStatus::Missing
                  );
              }

              #[test]
              fn failure_output_is_bounded_and_prefers_stderr() {
                  let detail = compact_failure(b"first\nsecond\nthird\nfourth\nfifth\n", b"ignored");
                  assert_eq!(detail, "second · third · fourth · fifth");
              }

              #[test]
              fn rejects_unsupported_image_extensions() {
                  let path = env::temp_dir().join("course-widget-import-test.gif");
                  fs::write(&path, b"test").unwrap();
                  let result = validate_image_path(&path);
                  let _ = fs::remove_file(path);
                  assert!(result.is_err());
              }
          }
          ''', encoding="utf-8")

      - name: Format and verify patch
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Commit generated implementation
        run: |
          rm .github/workflows/screenshot-import-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.ts src-tauri/src/lib.rs src-tauri/src/screenshot_import.rs .github/workflows/screenshot-import-bootstrap.yml
          git commit -m "feat: connect screenshot import to review flow"
          git push origin HEAD:feat/screenshot-import-vertical-slice
