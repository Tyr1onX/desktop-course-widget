name: Shared Course Handoff Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to package
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: shared-course-handoff-package-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Check presentation clock and shared handoff architecture
        run: npm run check:presentation-clock

      - name: Build web interface
        run: npm run web:build

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Record installer metadata
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $commit = (git rev-parse HEAD).Trim()
          $shortSha = $commit.Substring(0, 12)
          $metadata = [ordered]@{
            commit = $commit
            requestedRef = '${{ inputs.ref }}'
            path = $installer.FullName
            fileName = $installer.Name
            sizeBytes = $installer.Length
            sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $metadata | ConvertTo-Json | Set-Content -Path installer-metadata.json -Encoding utf8
          Get-Content installer-metadata.json
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: course-handoff-nsis-${{ steps.installer.outputs.short_sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            installer-metadata.json
          if-no-files-found: error
          retention-days: 7
