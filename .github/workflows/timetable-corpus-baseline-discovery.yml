name: Timetable Corpus Baseline Discovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: experiments/screenshot_import/requirements-corpus-benchmark.txt

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: paddle-models-windows-py313-paddle331-ocr370

      - name: Install OCR benchmark dependencies
        run: python -m pip install -r experiments/screenshot_import/requirements-corpus-benchmark.txt

      - name: Select stable Rust
        run: rustup default stable

      - name: Prebuild ImportDraft validator
        run: cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Fetch pinned public samples
        run: python -m experiments.screenshot_import fetch-corpus --output .tmp/screenshot-import-corpus --force

      - name: Run six-original observational baseline
        id: baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/screenshot-import-corpus-baseline | Out-Null
          python -m experiments.screenshot_import benchmark-corpus `
            --corpus .tmp/screenshot-import-corpus `
            --output .tmp/screenshot-import-corpus-baseline `
            --repo-root . `
            --originals-only `
            --allow-errors `
            --allow-negative-recognition 2>&1 | Tee-Object -FilePath .tmp/screenshot-import-corpus-baseline/benchmark-console.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-corpus-baseline-${{ github.run_id }}
          path: |
            .tmp/screenshot-import-corpus/corpus-lock.json
            .tmp/screenshot-import-corpus/ATTRIBUTION.md
            .tmp/screenshot-import-corpus-baseline/**
          if-no-files-found: error
          retention-days: 3
