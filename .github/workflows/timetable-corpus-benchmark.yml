name: Timetable Corpus Benchmark

on:
  workflow_dispatch:
    inputs:
      sample_id:
        description: Optional manifest sample ID; leave empty to run all samples
        required: false
        type: string
      max_cases:
        description: Maximum cases to run; 0 means all originals and variants
        required: true
        default: "0"
        type: string
      require_positive:
        description: Fail when a positive or layout sample is not recognized
        required: true
        default: false
        type: boolean
      strict_incomplete:
        description: Fail when a cropped sample is accepted without review evidence
        required: true
        default: false
        type: boolean
      allow_negative_recognition:
        description: Record negative false positives without failing the workflow
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: timetable-corpus-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: experiments/screenshot_import/requirements-corpus-benchmark.txt

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: paddle-models-windows-py313-paddle331-ocr370

      - name: Install OCR benchmark dependencies
        run: python -m pip install -r experiments/screenshot_import/requirements-corpus-benchmark.txt

      - name: Select stable Rust
        run: rustup default stable

      - name: Prebuild ImportDraft validator
        run: cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Fetch licensed public samples
        shell: pwsh
        run: |
          $arguments = @(
            '-m', 'experiments.screenshot_import', 'fetch-corpus',
            '--output', '.tmp/screenshot-import-corpus'
          )
          if ('${{ inputs.sample_id }}' -ne '') {
            $arguments += @('--id', '${{ inputs.sample_id }}')
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build deterministic variants
        shell: pwsh
        run: |
          $arguments = @(
            '-m', 'experiments.screenshot_import', 'build-corpus-variants',
            '--corpus', '.tmp/screenshot-import-corpus'
          )
          if ('${{ inputs.sample_id }}' -ne '') {
            $arguments += @('--id', '${{ inputs.sample_id }}')
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run OCR-first corpus benchmark
        id: benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/screenshot-import-corpus-report | Out-Null
          $arguments = @(
            '-m', 'experiments.screenshot_import', 'benchmark-corpus',
            '--corpus', '.tmp/screenshot-import-corpus',
            '--output', '.tmp/screenshot-import-corpus-report',
            '--repo-root', '.'
          )
          if ('${{ inputs.sample_id }}' -ne '') {
            $arguments += @('--id', '${{ inputs.sample_id }}')
          }
          $maximum = [int]'${{ inputs.max_cases }}'
          if ($maximum -gt 0) {
            $arguments += @('--max-cases', $maximum.ToString())
          }
          if ('${{ inputs.require_positive }}' -eq 'true') {
            $arguments += '--require-positive'
          }
          if ('${{ inputs.strict_incomplete }}' -eq 'true') {
            $arguments += '--strict-incomplete'
          }
          if ('${{ inputs.allow_negative_recognition }}' -eq 'true') {
            $arguments += '--allow-negative-recognition'
          }
          & python @arguments 2>&1 | Tee-Object -FilePath .tmp/screenshot-import-corpus-report/benchmark-console.log
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload corpus benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-corpus-benchmark-${{ github.run_id }}
          path: |
            .tmp/screenshot-import-corpus/corpus-lock.json
            .tmp/screenshot-import-corpus/ATTRIBUTION.md
            .tmp/screenshot-import-corpus/variants.json
            .tmp/screenshot-import-corpus-report/**
          if-no-files-found: error
          retention-days: 14

      - name: Fail when benchmark gate failed
        if: steps.benchmark.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1
