name: Timetable Corpus Degenerate Grid Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: experiments/screenshot_import/requirements-corpus-benchmark.txt

      - name: Restore PaddleOCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: paddle-models-windows-py313-paddle331-ocr370

      - name: Install OCR benchmark dependencies
        run: python -m pip install -r experiments/screenshot_import/requirements-corpus-benchmark.txt

      - name: Fetch pinned regression sample
        run: |
          python -m experiments.screenshot_import fetch-corpus --output .tmp/screenshot-import-corpus --force --id commons-school-timetable-2014

      - name: Run regression sample
        shell: pwsh
        run: |
          python -m experiments.screenshot_import benchmark-corpus `
            --corpus .tmp/screenshot-import-corpus `
            --output .tmp/degenerate-grid-verification `
            --id commons-school-timetable-2014 `
            --originals-only `
            --allow-errors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $report = Get-Content .tmp/degenerate-grid-verification/corpus-benchmark.json -Raw | ConvertFrom-Json
          if ($report.cases.Count -ne 1) {
            throw "expected exactly one verification case"
          }
          $case = $report.cases[0]
          if ($case.status -ne 'rejected' -or $case.outcome -ne 'not-recognized') {
            throw "degenerate border grid still produced a recognized timetable: $($case | ConvertTo-Json -Depth 8)"
          }

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: degenerate-grid-verification-${{ github.run_id }}
          path: .tmp/degenerate-grid-verification/**
          if-no-files-found: error
          retention-days: 2
