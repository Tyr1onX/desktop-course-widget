name: Validate macOS baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feat/macos-baseline
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-macos.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'settings.html'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/check-macos-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: validate-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-dmg:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install web dependencies
        run: npm ci

      - name: Check release version consistency
        run: npm run check:version

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Check import review helpers
        run: npm run check:import-review

      - name: Check screenshot import policy
        run: npm run check:screenshot-import

      - name: Check presentation clock
        run: npm run check:presentation-clock

      - name: Check macOS baseline boundary
        run: npm run check:macos-baseline

      - name: Build web interface
        run: npm run web:build

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build unsigned Universal DMG
        run: npm run tauri:build:macos

      - name: Inspect macOS application boundary
        shell: bash
        run: |
          set -euo pipefail
          bundle_root='src-tauri/target/universal-apple-darwin/release/bundle'
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null

          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          if find "$app_path" -type f \( -iname 'python*' -o -iname '*paddle*' -o -iname '*pp-ocr*' \) | grep -q .; then
            echo 'The stable macOS bundle unexpectedly contains OCR runtime files.' >&2
            exit 1
          fi

          executable_path="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$executable_path"
          test -x "$executable_path"
          executable_info="$(file "$executable_path")"
          [[ "$executable_info" == *'arm64'* ]]
          [[ "$executable_info" == *'x86_64'* ]]

          echo "app_name=$(basename "$app_path")" >> "$GITHUB_STEP_SUMMARY"
          echo "dmg_path=$dmg_path" >> "$GITHUB_STEP_SUMMARY"
          echo "dmg_bytes=$(stat -f%z "$dmg_path")" >> "$GITHUB_STEP_SUMMARY"
          echo "$executable_info" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Universal macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-macos-universal-${{ github.sha }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
