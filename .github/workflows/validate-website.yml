name: Validate website

on:
  push:
    branches:
      - agent/apple-website-redesign
    paths:
      - 'website/**'
      - '.github/workflows/validate-website.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/validate-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build website
        working-directory: website
        run: npm run docs:build

      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium > /dev/null

      - name: Test responsive layouts
        working-directory: website
        shell: bash
        run: |
          set -o pipefail
          npm run docs:test:responsive 2>&1 | tee responsive-test-output.txt

      - name: Upload responsive test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-report
          path: |
            website/responsive-test-output.txt
            website/responsive-results.json
            website/test-results
          if-no-files-found: warn
          retention-days: 3

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: website/docs/.vitepress/dist
          retention-days: 3
