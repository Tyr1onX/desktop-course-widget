name: Validate website

on:
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - 'src/widget.ts'
      - 'src/course-handoff*.ts'
      - 'src/course-handoff.css'
      - 'src/widget-page.ts'
      - '.github/workflows/validate-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: |
          npm install > /tmp/npm-install.log 2>&1 || {
            cat /tmp/npm-install.log
            exit 1
          }

      - name: Install Chromium
        working-directory: website
        run: |
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1 || {
            cat /tmp/playwright-install.log
            exit 1
          }

      - name: Render social preview
        working-directory: website
        run: |
          npm run docs:render:social > /tmp/social-preview.log 2>&1 || {
            cat /tmp/social-preview.log
            exit 1
          }

      - name: Build website
        working-directory: website
        run: |
          npm run docs:build > /tmp/website-build.log 2>&1 || {
            cat /tmp/website-build.log
            exit 1
          }

      - name: Test responsive layouts
        working-directory: website
        run: |
          npm run docs:test:responsive > /tmp/responsive-test.log 2>&1 || {
            cat /tmp/responsive-test.log
            exit 1
          }

      - name: Upload responsive failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failure-log
          path: /tmp/responsive-test.log
          retention-days: 1

      - name: Upload social preview
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-png
          path: website/docs/public/social-preview.png
          retention-days: 3

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: website/docs/.vitepress/dist
          retention-days: 3
