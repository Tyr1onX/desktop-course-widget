name: Validate website

on:
  push:
    branches:
      - agent/apple-website-redesign
    paths:
      - 'website/**'
      - '.github/workflows/validate-website.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/validate-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build website
        working-directory: website
        run: npm run docs:build
