name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Refresh npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Check release version consistency
        run: npm run check:version

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Build web interface
        id: web_build
        shell: pwsh
        run: |
          npm run web:build *>&1 | Tee-Object -FilePath web-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when web build failed
        if: steps.web_build.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Select stable Rust
        run: rustup default stable

      - name: Refresh Cargo lockfile metadata
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-course-widget-v0.4.0-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Commit refreshed lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: refresh v0.4.0 lockfiles"
            git push origin HEAD:${{ github.head_ref }}
          }
