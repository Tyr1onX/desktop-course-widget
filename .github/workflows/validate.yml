name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture real OCR benchmark run status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list `
            --repo $env:GITHUB_REPOSITORY `
            --workflow "Real PaddleOCR Benchmark" `
            --branch feat/screenshot-recognition-spike `
            --limit 5 `
            --json databaseId,status,conclusion,headSha,url,createdAt,event `
            | Out-File -Encoding utf8 real-ocr-runs.json
          Get-Content real-ocr-runs.json

      - name: Upload real OCR run status
        uses: actions/upload-artifact@v4
        with:
          name: real-ocr-run-status
          path: real-ocr-runs.json
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Check release version consistency
        run: npm run check:version

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Check import review helpers
        run: npm run check:import-review

      - name: Check import review DOM lifecycle
        run: npm run check:import-review-dom

      - name: Check presentation clock
        run: npm run check:presentation-clock

      - name: Build web interface
        id: web_build
        shell: pwsh
        run: |
          npm run web:build *>&1 | Tee-Object -FilePath web-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when web build failed
        if: steps.web_build.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install screenshot experiment test dependencies
        run: python -m pip install -r experiments/screenshot_import/requirements-test.txt

      - name: Run screenshot experiment tests
        run: python -m pytest experiments/screenshot_import/tests

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Prebuild ImportDraft validator example
        run: cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Validate synthetic screenshot drafts with Rust
        shell: pwsh
        run: |
          python -m experiments.screenshot_import generate-synthetic --output .tmp/screenshot-import
          foreach ($sample in @('standard_10', 'tilted_12')) {
            foreach ($mode in @('block', 'full')) {
              python -m experiments.screenshot_import recognize `
                --input ".tmp/screenshot-import/$sample.png" `
                --output ".tmp/screenshot-import/$sample-$mode-output" `
                --engine fixture `
                --fixture ".tmp/screenshot-import/$sample.ocr.json" `
                --ocr-mode $mode `
                --ground-truth ".tmp/screenshot-import/$sample.ground-truth.json" `
                --repo-root .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
