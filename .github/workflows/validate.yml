name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Check release version consistency
        run: npm run check:version

      - name: Check widget time-flow model
        run: npm run check:time-flow

      - name: Check import review helpers
        run: npm run check:import-review

      - name: Check screenshot import policy
        run: npm run check:screenshot-import

      - name: Check import review DOM lifecycle
        run: npm run check:import-review-dom

      - name: Check screenshot import DOM lifecycle
        run: npm run check:screenshot-import-dom

      - name: Check presentation clock
        run: npm run check:presentation-clock

      - name: Build web interface
        id: web_build
        shell: pwsh
        run: |
          npm run web:build *>&1 | Tee-Object -FilePath web-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when web build failed
        if: steps.web_build.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install screenshot experiment test dependencies
        run: python -m pip install -r experiments/screenshot_import/requirements-test.txt

      - name: Run screenshot experiment tests
        run: python -m pytest experiments/screenshot_import/tests

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Prebuild ImportDraft validator example
        run: cargo build --quiet --manifest-path src-tauri/Cargo.toml --example validate_import_draft

      - name: Validate Chinese timetable style families with Rust
        shell: pwsh
        run: |
          $root = '.tmp/chinese-timetable-corpus'
          python -m experiments.screenshot_import generate-chinese-corpus --output $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($style in @('mobile_cards_12', 'minimal_lines_10', 'dense_export_12')) {
            $output = "$root/$style-output"
            python -m experiments.screenshot_import recognize `
              --input "$root/$style.png" `
              --output $output `
              --engine fixture `
              --fixture "$root/$style.ocr.json" `
              --ocr-mode ocr-first `
              --ground-truth "$root/$style.ground-truth.json" `
              --repo-root .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $report = Get-Content "$output/report.json" -Raw | ConvertFrom-Json
            $evaluation = $report.fieldEvaluation
            if ($report.courseCount -ne 4 `
                -or $evaluation.courseCountMatched -ne 4 `
                -or $evaluation.missingCourseCount -ne 0 `
                -or $evaluation.falsePositiveCourseCount -ne 0 `
                -or $evaluation.valueAccuracy.wrong -ne 0 `
                -or $evaluation.valueAccuracy.valueMissing -ne 0 `
                -or $evaluation.autoConfirmationErrors.Count -ne 0 `
                -or $report.rustValidation.structuralValid -ne $true) {
              throw "Chinese timetable style validation failed for $style`: $($evaluation | ConvertTo-Json -Depth 10)"
            }
          }

      - name: Validate synthetic screenshot drafts with Rust
        shell: pwsh
        run: |
          python -m experiments.screenshot_import generate-synthetic --output .tmp/screenshot-import
          foreach ($sample in @('standard_10', 'tilted_12')) {
            foreach ($mode in @('block', 'full')) {
              python -m experiments.screenshot_import recognize `
                --input ".tmp/screenshot-import/$sample.png" `
                --output ".tmp/screenshot-import/$sample-$mode-output" `
                --engine fixture `
                --fixture ".tmp/screenshot-import/$sample.ocr.json" `
                --ocr-mode $mode `
                --ground-truth ".tmp/screenshot-import/$sample.ground-truth.json" `
                --repo-root .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: course-widget-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
