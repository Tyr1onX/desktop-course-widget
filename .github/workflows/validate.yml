name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-data-backup-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/data-backup-recovery'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect pending fix
        id: state
        shell: pwsh
        run: |
          if (Test-Path scripts/fix-data-backup-rust.py) {
            "skip=false" >> $env:GITHUB_OUTPUT
          } else {
            "skip=true" >> $env:GITHUB_OUTPUT
          }

      - name: Select stable Rust
        if: steps.state.outputs.skip != 'true'
        run: rustup default stable

      - name: Apply Rust fix
        if: steps.state.outputs.skip != 'true'
        run: python scripts/fix-data-backup-rust.py

      - name: Run Rust library tests
        id: rust
        if: steps.state.outputs.skip != 'true'
        continue-on-error: true
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib *>&1 | Tee-Object -FilePath backup-rust-diagnostic.log

      - name: Check diff
        if: steps.state.outputs.skip != 'true'
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Commit fix and diagnostics
        if: steps.state.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/data_backup.rs backup-rust-diagnostic.log
          git rm scripts/fix-data-backup-rust.py
          git commit -m "fix: validate restored schedule without trait coupling"
          git push origin HEAD:${{ github.head_ref }}

      - name: Fail when Rust validation failed
        if: steps.state.outputs.skip != 'true' && steps.rust.outcome != 'success'
        shell: pwsh
        run: throw 'Backup Rust validation failed; see backup-rust-diagnostic.log'

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Check release version consistency
        run: npm run check:version

      - name: Build web interface
        id: web_build
        shell: pwsh
        run: |
          npm run web:build *>&1 | Tee-Object -FilePath web-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when web build failed
        if: steps.web_build.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
