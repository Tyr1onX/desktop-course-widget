name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-data-backup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/data-backup-recovery'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed implementation
        id: state
        shell: pwsh
        run: |
          if (Test-Path src-tauri/src/data_backup.rs) {
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Select stable Rust
        if: steps.state.outputs.skip != 'true'
        run: rustup default stable

      - name: Apply implementation
        if: steps.state.outputs.skip != 'true'
        run: python scripts/apply-data-backup.py

      - name: Build web interface
        if: steps.state.outputs.skip != 'true'
        run: npm run web:build

      - name: Run Rust library tests
        if: steps.state.outputs.skip != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check diff
        if: steps.state.outputs.skip != 'true'
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Commit validated implementation
        if: steps.state.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add settings.html src/backup-ui.ts src/backup-ui.css src-tauri/src/lib.rs src-tauri/src/data_backup.rs
          git commit -m "feat: add local data backup and recovery"
          git push origin HEAD:${{ github.head_ref }}

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Check release version consistency
        run: npm run check:version

      - name: Build web interface
        id: web_build
        shell: pwsh
        run: |
          npm run web:build *>&1 | Tee-Object -FilePath web-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when web build failed
        if: steps.web_build.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Select stable Rust
        run: rustup default stable

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
