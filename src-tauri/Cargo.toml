[package]
name = "desktop-course-widget"
version = "0.3.0"
description = "A local-first Windows desktop course schedule widget"
authors = ["Tyr1onX"]
license = "MIT"
repository = "https://github.com/Tyr1onX/desktop-course-widget"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "desktop_course_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
calamine = "0.26"
chrono = "0.4"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.4.1"
