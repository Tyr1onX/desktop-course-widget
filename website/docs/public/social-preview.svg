  <text x="72" y="574" fill="#81818b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">FREE · OPEN SOURCE · WINDOWS 10 / 11</text>
  <path d="M1014 568H1208" stroke="#0071e3" stroke-width="2"/>
