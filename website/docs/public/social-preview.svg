<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">课刻 Windows 桌面课表</title>
  <desc id="desc">课刻产品概览：把教务系统课表放到 Windows 桌面，支持 Excel 导入、截图识别和本地存储。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.48" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5576F6"/>
      <stop offset="1" stop-color="#7C5CE7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F7F8FF" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#4B5E9A" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#435485" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1150" cy="80" r="220" fill="#91A5FF" opacity="0.12"/>
  <circle cx="1060" cy="580" r="260" fill="#8B6EF0" opacity="0.10"/>
  <path d="M0 520 C220 455 420 590 650 520 C900 445 1040 500 1280 410 V640 H0Z" fill="#FFFFFF" opacity="0.42"/>

  <g transform="translate(74 72)">
    <g filter="url(#soft)">
      <rect width="76" height="76" rx="22" fill="url(#accent)"/>
      <path d="M22 24h32M22 37h32M22 50h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="53" cy="51" r="8" fill="#fff"/>
    </g>

    <text x="98" y="31" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#344061">课刻</text>
    <text x="98" y="62" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#687397">Windows 桌面课表</text>

    <text x="0" y="174" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="#1D2743">把今天的课程，</text>
    <text x="0" y="240" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="#1D2743">放回桌面。</text>
    <text x="0" y="290" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#5E6988">当前课程、下一节与完整周课表，抬眼就能看见。</text>

    <g transform="translate(0 334)">
      <g>
        <rect width="142" height="44" rx="22" fill="#FFFFFF" opacity="0.86"/>
        <circle cx="24" cy="22" r="8" fill="#5F7AF2"/>
        <text x="43" y="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#344061">Excel 导入</text>
      </g>
      <g transform="translate(156 0)">
        <rect width="142" height="44" rx="22" fill="#FFFFFF" opacity="0.86"/>
        <circle cx="24" cy="22" r="8" fill="#7965E8"/>
        <text x="43" y="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#344061">截图识别</text>
      </g>
      <g transform="translate(312 0)">
        <rect width="142" height="44" rx="22" fill="#FFFFFF" opacity="0.86"/>
        <circle cx="24" cy="22" r="8" fill="#47A68B"/>
        <text x="43" y="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#344061">完全本地</text>
      </g>
    </g>

    <g transform="translate(0 418)">
      <rect width="242" height="58" rx="18" fill="url(#accent)"/>
      <text x="121" y="37" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="18" font-weight="750" fill="#FFFFFF">免费下载 · 开源</text>
    </g>
    <text x="0" y="518" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#727C98">Windows 10 / 11 · Tauri + Rust · MIT License</text>
  </g>

  <g transform="translate(682 62)" filter="url(#shadow)">
    <rect width="514" height="516" rx="34" fill="#DDE4F9" opacity="0.66"/>
    <rect x="14" y="14" width="486" height="488" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-width="2"/>

    <g transform="translate(48 46)">
      <text x="0" y="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#7A85A3">星期一 · 第 5 周</text>
      <text x="0" y="56" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#202B47">今天有 3 节课</text>

      <g transform="translate(0 88)">
        <rect width="418" height="150" rx="24" fill="#FFFFFF" stroke="#E8EBF6"/>
        <rect width="8" height="150" rx="4" fill="url(#accent)"/>
        <text x="30" y="38" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6B76A0">正在上课 · 09:42</text>
        <text x="30" y="78" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#202B47">数字信号处理</text>
        <text x="30" y="111" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="15" font-weight="550" fill="#6C7692">09:00–10:35 · 逸夫教学楼 B311</text>
        <rect x="30" y="126" width="340" height="7" rx="3.5" fill="#ECEDF5"/>
        <rect x="30" y="126" width="188" height="7" rx="3.5" fill="url(#accent)"/>
      </g>

      <g transform="translate(0 256)">
        <rect width="418" height="104" rx="22" fill="#FAFBFF" stroke="#EAEDF7"/>
        <text x="24" y="30" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7B84A0">接下来</text>
        <text x="24" y="65" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="21" font-weight="780" fill="#28334E">通信原理</text>
        <text x="292" y="65" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="15" font-weight="650" fill="#687397">10:50–12:25</text>
        <text x="24" y="88" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#7A84A0">李四光楼 201</text>
      </g>

      <g transform="translate(0 378)">
        <rect width="196" height="50" rx="16" fill="#EEF2FF"/>
        <path d="M20 17h17v17H20zM24 13v8M33 13v8" fill="none" stroke="#5F76DA" stroke-width="2" stroke-linecap="round"/>
        <text x="51" y="31" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#4F5D88">打开完整课表</text>
      </g>
      <g transform="translate(212 378)">
        <rect width="206" height="50" rx="16" fill="#F1EEFF"/>
        <path d="M20 16h18v18H20zM24 22l4 4 7-8" fill="none" stroke="#725FD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="51" y="31" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#5A508C">课表仅存本机</text>
      </g>
    </g>
  </g>
</svg>
